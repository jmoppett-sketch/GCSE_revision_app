]},

'chemical-changes': { name: 'Chemical Changes', fc: [
  {q:'State the reactivity series (most to least reactive).', a:'Potassium > Sodium > Lithium > Calcium > Magnesium > Aluminium > (Carbon) > Zinc > Iron > (Hydrogen) > Copper > Silver > Gold > Platinum.'},
  {q:'What is a displacement reaction?', a:'A more reactive metal displaces a less reactive metal from its salt solution. E.g. Zn + CuSO₄ → ZnSO₄ + Cu.'},
  {q:'Define oxidation and reduction in terms of electrons (OIL RIG).', a:'Oxidation Is Loss of electrons. Reduction Is Gain of electrons. (OIL RIG.)'},
  {q:'What are the products when an acid reacts with a metal, a carbonate, or a metal oxide?', a:'Acid + metal → salt + hydrogen. Acid + carbonate → salt + water + CO₂. Acid + metal oxide → salt + water.'},
  {q:'What is electrolysis?', a:'Decomposition of an ionic compound using electricity. Cations (positive ions) move to the cathode (negative electrode) and are reduced. Anions move to the anode (positive electrode) and are oxidised.'},
  {q:'What are the products of electrolysing brine (concentrated NaCl)?', a:'Cathode: hydrogen gas (H₂). Anode: chlorine gas (Cl₂). Remaining solution: sodium hydroxide (NaOH).'},
  {q:'Why is aluminium extracted by electrolysis, not carbon reduction?', a:'Aluminium is more reactive than carbon — carbon cannot reduce it. Electrolysis of molten aluminium oxide is used instead.'},
  {q:'What is the difference between strong and weak acids?', a:'Strong acids fully ionise in water (e.g. HCl, H₂SO₄, HNO₃). Weak acids partially ionise (e.g. ethanoic acid). Same concentration → strong acid has lower pH.', t:'H'},
  {q:'What is neutralisation?', a:'Acid + base → salt + water. H⁺(aq) + OH⁻(aq) → H₂O(l). pH moves towards 7.'},
  {q:'What test confirms hydrogen gas is produced?', a:'Hold a burning splint near the gas — you hear a "squeaky pop". Hydrogen ignites and burns rapidly.', t:'F'},
], mc: [

  {q:'In electrolysis, what occurs at the cathode?', o:['Oxidation: electrons are lost','Reduction: electrons are gained','Anions are discharged','Acid is produced'], c:1, e:'Cathode is negative; positive cations are attracted and gain electrons — this is reduction. OIL RIG: cathode = reduction.'},
  {q:'What gas is produced at the anode during electrolysis of concentrated brine?', o:['Oxygen','Hydrogen','Chlorine','Sodium'], c:2, e:'At high Cl⁻ concentration, Cl⁻ ions are preferentially discharged: 2Cl⁻ − 2e⁻ → Cl₂.'},
  {q:'What are the products of reacting hydrochloric acid with sodium hydroxide?', o:['Sodium + water','Sodium chloride + hydrogen','Sodium chloride + water','Sodium carbonate + water'], c:2, e:'HCl + NaOH → NaCl + H₂O. Acid + alkali → salt + water. This is neutralisation.', t:'F'},
  {q:'In the reaction Fe + CuSO₄ → FeSO₄ + Cu, iron is:', o:['Reduced and is the oxidising agent','Oxidised and is the reducing agent','Neither oxidised nor reduced','The catalyst'], c:1, e:'Fe → Fe²⁺ (loses electrons) = oxidised. The species that is oxidised is the reducing agent.', t:'H'},
  {q:'Why can\'t carbon reduce aluminium oxide?', o:['Al₂O₃ has too high a melting point','Aluminium is more reactive than carbon so carbon cannot displace it','Carbon reacts with Al to make carbide','Al₂O₃ dissolves in carbon'], c:1, e:'Carbon can only reduce metals below it in the reactivity series. Aluminium is above carbon, so electrolysis is required.'},
]},

'energy-changes': { name: 'Energy Changes', fc: [
  {q:'What is an exothermic reaction?', a:'A reaction that transfers energy to the surroundings — temperature of surroundings rises. Examples: combustion, neutralisation, oxidation, many displacement reactions.'},
  {q:'What is an endothermic reaction?', a:'A reaction that absorbs energy from the surroundings — temperature falls. Examples: thermal decomposition, dissolving ammonium nitrate.'},
  {q:'What is activation energy?', a:'The minimum energy that colliding particles must have for a reaction to occur. Shown as the peak on a reaction profile diagram.'},
  {q:'What does a reaction profile diagram show?', a:'The relative energy of reactants and products, and the activation energy peak. Exothermic: products lower than reactants. Endothermic: products higher than reactants.'},
  {q:'How do you calculate ΔH from bond energies?', a:'ΔH = energy absorbed (bonds broken) − energy released (bonds formed). Negative ΔH = exothermic. Positive ΔH = endothermic.', t:'H'},
  {q:'How does a catalyst affect a reaction profile?', a:'Lowers the activation energy by providing an alternative reaction pathway. The reactant and product energy levels remain the same.'},
  {q:'What is a reversible reaction?', a:'A reaction that can proceed in both forward and reverse directions (shown as ⇌). At equilibrium, both reactions occur at equal rates.'},
  {q:'How does a hydrogen fuel cell work?', a:'Hydrogen is oxidised at the anode; oxygen is reduced at the cathode; water is produced. Chemical energy converts directly to electrical energy — more efficient than combustion.', t:'H'},
  {q:'Is combustion exothermic or endothermic? How do you know?', a:'Exothermic — it releases energy to the surroundings as heat and light. The temperature of the surroundings increases.', t:'F'},
], mc: [
  {q:'A reaction causes a temperature decrease. It is:', o:['Exothermic','Endothermic','Neutral','A combustion reaction'], c:1, e:'Endothermic reactions absorb energy from surroundings — temperature falls. Exothermic reactions release energy — temperature rises.'},
  {q:'A catalyst increases reaction rate because it:', o:['Increases activation energy','Provides a lower-energy alternative reaction pathway','Gets used up during the reaction','Increases the temperature'], c:1, e:'A catalyst lowers the activation energy — more collisions now have enough energy to react. The catalyst is unchanged overall.'},
  {q:'Energy to break bonds = 400 kJ; energy released forming bonds = 500 kJ. ΔH =', o:['+900 kJ/mol','+100 kJ/mol','−100 kJ/mol','−900 kJ/mol'], c:2, e:'ΔH = energy in − energy out = 400 − 500 = −100 kJ/mol. Negative = exothermic.', t:'H'},
  {q:'Which of these is an exothermic process?', o:['Melting ice','Dissolving ammonium nitrate','Thermal decomposition of limestone','Combustion of methane'], c:3, e:'Combustion always releases energy to surroundings (exothermic). The others all absorb energy from surroundings (endothermic).'},
  {q:'Which of these reactions is endothermic?', o:['Burning wood','Rusting iron','Neutralisation','Thermal decomposition of copper carbonate'], c:3, e:'Thermal decomposition requires heat energy to be absorbed to break down a compound. Burning, rusting, and neutralisation all release energy.', t:'F'},
]},

'rates-equilibrium': { name: 'Rate & Extent of Chemical Change', fc: [
  {q:'What four factors affect the rate of a chemical reaction?', a:'Temperature, concentration (or pressure for gases), surface area, and catalysts.'},
  {q:'Explain how temperature increases reaction rate using collision theory.', a:'Higher temperature → particles have more kinetic energy → move faster → more frequent collisions AND a greater proportion exceed the activation energy. Both effects increase rate.'},
  {q:'How does increasing concentration increase reaction rate?', a:'More particles in the same volume → more frequent collisions per second → more successful collisions → faster reaction.'},
  {q:'How does increasing surface area increase reaction rate?', a:'Smaller particles expose more surface → more collision sites available → more frequent collisions → faster reaction.'},
  {q:'What is a catalyst and how does it work?', a:'A substance that increases reaction rate without being used up. Provides an alternative pathway with lower activation energy → more collisions have enough energy to react.'},
  {q:'What is dynamic equilibrium?', a:'In a closed system, when the forward and reverse reaction rates are equal and concentrations of all species remain constant (both reactions are still occurring).', t:'H'},
  {q:'State Le Chatelier\'s Principle.', a:'If a system at equilibrium is subjected to a change, the equilibrium shifts to oppose that change.', t:'H'},
  {q:'How does increasing temperature affect equilibrium position?', a:'Shifts equilibrium in the endothermic direction, using up the extra energy. For an exothermic forward reaction, increasing temperature shifts equilibrium left (lower product yield).', t:'H'},
  {q:'How does increasing pressure affect a gaseous equilibrium?', a:'Shifts equilibrium towards the side with fewer moles of gas (to reduce pressure).', t:'H'},
  {q:'How does increasing concentration of a reactant affect equilibrium?', a:'Shifts equilibrium to the right (towards products) to use up the extra reactant.', t:'H'},
  {q:'Why does increasing surface area speed up a reaction? Give a real-life example.', a:'More surface area = more reactant particles exposed for collisions. Example: powdered marble reacts faster with acid than marble chips.', t:'F'},
], mc: [
  {q:'Marble chips react faster when ground to powder because:', o:['Powder has lower activation energy','Powder has greater surface area giving more collision sites','Powder contains more moles of CaCO₃','Powder increases temperature'], c:1, e:'Smaller particles → greater surface area exposed to acid → more frequent collisions → faster rate.'},
  {q:'For the reaction N₂ + 3H₂ ⇌ 2NH₃, which change shifts equilibrium right?', o:['Decreasing pressure','Increasing temperature (reaction is exothermic)','Increasing concentration of N₂','Removing the catalyst'], c:2, e:'Adding more reactant shifts equilibrium right to use it up (Le Chatelier). High pressure also shifts right (4 mol gas → 2 mol).', t:'H'},
  {q:'For an exothermic equilibrium reaction, increasing temperature:', o:['Increases yield of products','Decreases yield of products','Has no effect on equilibrium','Only speeds up the forward reaction'], c:1, e:'Le Chatelier: increasing T favours the endothermic direction (reverse). Equilibrium shifts left → lower yield. (Rate still increases; yield decreases.)', t:'H'},
  {q:'A catalyst increases reaction rate because:', o:['It raises the temperature','It raises the activation energy','It provides a lower-energy pathway so more collisions succeed','It increases reactant concentration'], c:2, e:'Catalysts lower activation energy → a greater proportion of collisions have enough energy to react.'},
  {q:'Why is ~450°C used in the Haber process rather than a very high temperature?', o:['High temperature melts the iron catalyst','Higher T speeds up the rate but shifts the exothermic equilibrium left, reducing yield; 450°C is a practical compromise','High temperature produces too much ammonia','Low temperature always maximises yield'], c:1, e:'Higher T = faster kinetics but lower equilibrium yield. 450°C balances acceptable rate with acceptable yield (~15%) for industrial viability.', t:'H'},
  {q:'Which of these increases the rate of a reaction?', o:['Cooling the reactants','Using larger pieces of solid reactant','Adding a catalyst','Reducing the concentration of reactants'], c:2, e:'A catalyst provides a lower activation energy pathway → more successful collisions per second → faster rate. The other options all decrease rate.', t:'F'},
]},

'organic-chemistry': { name: 'Organic Chemistry', fc: [
  {q:'What is a homologous series?', a:'A family of compounds with the same general formula and functional group, differing by −CH₂− between members. Show trends in boiling points and similar chemical properties.'},
  {q:'What are alkanes and their general formula?', a:'Saturated hydrocarbons (single C−C bonds only). General formula: CₙH₂ₙ₊₂. Methane (CH₄), ethane (C₂H₆), propane (C₃H₈), butane (C₄H₁₀).'},
  {q:'What are alkenes and their general formula?', a:'Unsaturated hydrocarbons containing at least one C=C double bond. General formula: CₙH₂ₙ. Ethene (C₂H₄), propene (C₃H₆).'},
  {q:'How do you test for an alkene?', a:'Add bromine water (orange). An alkene decolourises it to colourless because bromine adds across the C=C double bond. Alkanes do not react with bromine water.'},
  {q:'What is fractional distillation of crude oil?', a:'Crude oil is heated and vapours rise up a fractionating column. Fractions condense at different temperatures — short chains at the top (low boiling point), long chains at the bottom.'},
  {q:'What is cracking and why is it done?', a:'Breaking long-chain hydrocarbons into shorter, more useful molecules and alkenes. Thermal cracking: high temperature/pressure. Catalytic cracking: lower temperature with a catalyst.'},

let currentUser = null;

async function doLogin(){
  var nameEl=document.getElementById('login-name');
  var pinEl=document.getElementById('login-pin');
  var msg=document.getElementById('login-msg');
  var name=nameEl.value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  var pin=pinEl.value.trim();

  if(!name){msg.textContent='Please enter your name.';return;}
  if(!/^\d{4}$/.test(pin)){msg.textContent='PIN must be exactly 4 digits.';return;}

  msg.style.color='#64748b';
  msg.textContent='Checking…';
  document.getElementById('login-btn').disabled=true;

  try{
    var userRef=db.collection('users').doc(name);
    var userDoc=await userRef.get();
    if(userDoc.exists){
      if(userDoc.data().pin!==pin){
        msg.style.color='#dc2626';
        msg.textContent='Wrong PIN. Try again.';
        document.getElementById('login-btn').disabled=false;
        return;
      }
    } else {
      await userRef.set({pin:pin,created:firebase.firestore.FieldValue.serverTimestamp()});
    }
    localStorage.setItem('gcse_user',name);
    localStorage.setItem('gcse_pin',pin);
    loginSuccess(name);
  }catch(e){
    msg.style.color='#dc2626';
    msg.textContent='Connection error. Check your internet connection.';
    document.getElementById('login-btn').disabled=false;
  }
}

function loginSuccess(name){
  currentUser=name;
  document.getElementById('login-overlay').style.display='none';
  var hu=document.getElementById('header-user');
  hu.style.display='flex';
  var display=name.charAt(0).toUpperCase()+name.slice(1);
  document.getElementById('user-greeting').textContent=display;
  startApp();
}

async function tryAutoLogin(){
  var name=localStorage.getItem('gcse_user');
  var pin=localStorage.getItem('gcse_pin');
  if(!name||!pin){return false;}
  try{
    var userDoc=await db.collection('users').doc(name).get();
    if(userDoc.exists&&userDoc.data().pin===pin){
      loginSuccess(name);
      return true;
    }
  }catch(e){/* network error — fall through to show login */}
  return false;
}

async function saveSession(){
  if(!currentUser)return;
  var score=S.mode==='mc'?S.mcScore:S.fcKnow;
  var total=S.mode==='mc'?S.mcTotal:S.fcSeen;
  if(total===0)return;
  try{
    await db.collection('sessions').add({
      user:currentUser,
      subject:S.subject,
      topic:S.topic,
      mode:S.mode,
      score:score,
      total:total,
      pct:Math.round(score/total*100),
      timestamp:firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){console.log('Save error:',e);}
}

async function showProgress(){
  var modal=document.getElementById('progress-modal');
  var content=document.getElementById('prog-content');
  modal.style.display='flex';
  content.innerHTML='<p class="prog-empty">Loading your progress…</p>';

  try{
    var snap=await db.collection('sessions')
      .where('user','==',currentUser)
      .limit(200)
      .get();

    var sessions=snap.docs.map(function(d){return d.data();});
    // Sort client-side by timestamp descending
    sessions.sort(function(a,b){
      var ta=a.timestamp?a.timestamp.seconds||0:0;
      var tb=b.timestamp?b.timestamp.seconds||0:0;
      return tb-ta;
    });

    if(!sessions.length){
      content.innerHTML='<p class="prog-empty">No sessions yet!<br>Complete a deck to start tracking your progress. 🚀</p>';
      return;
    }

    // Summary stats
    var totalSessions=sessions.length;
    var avgPctAll=Math.round(sessions.reduce(function(a,s){return a+s.pct;},0)/totalSessions);

    // Build topic stats per subject
    var html='<div class="prog-summary">'
      +'<div class="prog-stat"><div class="n">'+totalSessions+'</div><div class="l">Sessions</div></div>'
      +'<div class="prog-stat"><div class="n">'+avgPctAll+'%</div><div class="l">Avg Score</div></div>'
      +'</div>';

    // Weak topics alert
    var topicMap={};
    sessions.forEach(function(s){
      var key=s.subject+'|'+s.topic;
      if(!topicMap[key])topicMap[key]={subject:s.subject,topic:s.topic,pcts:[]};
      topicMap[key].pcts.push(s.pct);
    });
    var weakNames=[];
    Object.values(topicMap).forEach(function(t){
      var avg=t.pcts.reduce(function(a,b){return a+b;},0)/t.pcts.length;
      if(avg<60&&t.pcts.length>=2){
        var subj=SUBJECTS[t.subject];
        var name=t.topic==='all'?subj.name+' (all)':(subj&&subj.data[t.topic]?subj.data[t.topic].name:t.topic);
        weakNames.push(name);
      }
    });
    if(weakNames.length){
      html+='<div class="prog-alert">⚠️ Needs work: '+weakNames.join(', ')+'</div>';
    }

    // Per subject
    ['biology','physics','chemistry'].forEach(function(subj){
      var subjSessions=sessions.filter(function(s){return s.subject===subj;});
      if(!subjSessions.length)return;
      var subjInfo=SUBJECTS[subj];

      html+='<div class="prog-subject" style="border-left:4px solid '+subjInfo.accent+';padding-left:12px">';
      html+='<h3>'+subjInfo.icon+' '+subjInfo.name+'</h3>';

      // Group by topic
      var topics={};
      subjSessions.forEach(function(s){
        if(!topics[s.topic])topics[s.topic]=[];
        topics[s.topic].push(s.pct);
      });

      Object.entries(topics).forEach(function(entry){
        var topicKey=entry[0],pcts=entry[1];
        var avg=Math.round(pcts.reduce(function(a,b){return a+b;},0)/pcts.length);
        var topicName=topicKey==='all'?'All Topics':(subjInfo.data[topicKey]?subjInfo.data[topicKey].name:topicKey);
        var colour=avg>=80?'#16a34a':avg>=60?'#d97706':'#dc2626';
        var emoji=avg>=80?'✅':avg>=60?'⚠️':'❌';
        html+='<div class="prog-topic">'
          +'<div class="prog-topic-name">'+topicName+'</div>'
          +'<div class="prog-topic-bar"><div style="width:'+avg+'%;background:'+colour+'"></div></div>'
          +'<div class="prog-topic-score" style="color:'+colour+'">'+emoji+' '+avg+'% <span>('+pcts.length+')</span></div>'
          +'</div>';
      });

      html+='</div>';
    });

    content.innerHTML=html;
  }catch(e){
    content.innerHTML='<p style="color:#dc2626;padding:24px;text-align:center">Error loading progress. Check your internet connection.</p>';
    console.log(e);
  }
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function getCards(){
  const subj=SUBJECTS[S.subject];
  let out=[];
  for(const[key,topic] of Object.entries(subj.data)){
    if(S.topic!=='all'&&key!==S.topic)continue;
    const pool=S.mode==='fc'?(topic.fc||[]):(topic.mc||[]);
    const filtered=pool.filter(q=>!q.t||q.t===S.tier);
    out.push(...filtered.map(q=>({...q,topicName:topic.name})));
  }
  return shuffle(out);
}

function loadCards(){
  S.cards=getCards(); S.index=0; S.flipped=false; S.done=false;
  S.fcKnow=0; S.fcSeen=0;
  S.mcScore=0; S.mcTotal=0; S.mcAnswered=false; S.mcSelected=null;
}

function renderProgress(){
  const n=S.cards.length;

  document.getElementById('progress-fill').style.width=n>0?(done/n*100)+'%':'0%';
  document.getElementById('progress-label').textContent=n>0?(S.index+1)+' / '+n:'0 / 0';

  const sb=document.getElementById('score-badge');
  if(S.mode==='mc'&&S.mcTotal>0){
    sb.style.display='';sb.textContent='✓ '+S.mcScore+' / '+S.mcTotal;
  } else if(S.mode==='fc'&&S.fcSeen>0){
    sb.style.display='';sb.textContent='✓ '+S.fcKnow+' / '+S.fcSeen;
  } else {
    sb.style.display='none';
  }

  const btnNext=document.getElementById('btn-next');
  const btnPrev=document.getElementById('btn-prev');
  btnPrev.disabled=S.index===0||S.done;
  btnNext.disabled=(S.mode==='mc'&&!S.mcAnswered&&!S.done)||(S.index>=n-1&&S.mode==='fc')||S.done;
}

function renderCard(){

  if(!S.cards.length){

  const card=S.cards[S.index];
  if(S.mode==='fc') renderFC(area,card);

  if(!S.flipped){
    area.innerHTML='<div class="fc-panel" id="fc-front">'
      +badges(card)
      +'<p class="card-label">Question</p>'
      +'<p class="card-text">'+card.q+'</p>'
      +'<div class="tap-hint">Tap card to reveal answer</div>'
      +'</div>';
    document.getElementById('fc-front').addEventListener('click',()=>{
      S.flipped=true; renderCard(); renderProgress();
    });
  } else {
    area.innerHTML='<div class="fc-panel answer-panel" id="fc-back">'
      +badges(card)
      +'<p class="card-label">Answer</p>'
      +'<p class="card-text">'+card.a+'</p>'
      +'<div class="fc-actions">'
      +'<button class="fc-btn fc-no" id="fc-no">✗ Still learning</button>'
      +'<button class="fc-btn fc-yes" id="fc-yes">✓ Got it</button>'
      +'</div>'
      +'</div>';
    document.getElementById('fc-no').addEventListener('click',()=>fcAnswer(false));
    document.getElementById('fc-yes').addEventListener('click',()=>fcAnswer(true));
  }
}

function renderMC(area,card){
  const lbls=['A','B','C','D'];
  let opts='';
  card.o.forEach((opt,i)=>{
    let cls='mc-opt';
    if(S.mcAnswered){
      if(i===card.c)cls+=' correct';
      else if(i===S.mcSelected)cls+=' wrong';
      else cls+=' dim';
    }
    opts+='<button class="'+cls+'" data-i="'+i+'" '+(S.mcAnswered?'disabled':'')+' >'
      +'<span class="opt-lbl">'+lbls[i]+'</span><span>'+opt+'</span>'
      +'</button>';
  });

  let expl='';
  if(S.mcAnswered){
    const ok=S.mcSelected===card.c;
    expl='<div class="explanation '+(ok?'ok':'bad')+'">'
      +'<strong>'+(ok?'✓ Correct!':'✗ Incorrect')+'</strong>'
      +card.e
      +(card.s?'<span class="src-note">'+card.s+'</span>':'')
      +'</div>';
  }

  area.innerHTML='<div class="mc-card">'
    +badges(card)
    +'<p class="card-label">Question</p>'
    +'<p class="mc-q">'+card.q+'</p>'
    +'<div class="mc-opts">'+opts+'</div>'
    +expl
    +'</div>';

  if(!S.mcAnswered){
    area.querySelectorAll('.mc-opt').forEach(btn=>{
      btn.addEventListener('click',()=>answerMC(parseInt(btn.dataset.i)));
    });
  }
}

function renderComplete(area){
  let msg='',score='';
  if(S.mode==='mc'){
    const pct=S.mcTotal>0?Math.round(S.mcScore/S.mcTotal*100):0;
    score='<div class="big-score">'+S.mcScore+' / '+S.mcTotal+'</div>';
    msg=pct>=80?'Excellent work! 🎉':pct>=60?'Good effort — keep going!':'Keep revising — you\'ll get there!';
  } else {
    score='<div class="big-score">'+S.fcKnow+' / '+S.fcSeen+'</div>';
    msg=S.fcKnow===S.fcSeen?'Perfect! You knew them all! 🎉':'Deck complete — restart to drill the tricky ones.';
  }
  area.innerHTML='<div class="complete">'
    +'<span class="complete-emoji">'+(S.mode==='mc'?'🏆':'🎴')+'</span>'
    +'<h2>Deck Complete!</h2>'
    +score
    +'<p>'+msg+'</p>'
    +(currentUser?'<button class="view-prog-btn" onclick="showProgress()">📊 View My Progress</button>':'')
    +'</div>';

  // Save to Firebase
  saveSession();
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function fcAnswer(knew){
  S.fcSeen++;
  if(knew){
    S.fcKnow++;
    if(S.index>=S.cards.length-1){S.done=true;}
    else{S.index++;S.flipped=false;}
  } else {
    const c=S.cards.splice(S.index,1)[0];
    S.cards.push(c);
    S.flipped=false;
    if(S.index>=S.cards.length)S.index=S.cards.length-1;
  }
  render();
}

function answerMC(i){
  if(S.mcAnswered)return;
  S.mcAnswered=true; S.mcSelected=i; S.mcTotal++;
  if(i===S.cards[S.index].c)S.mcScore++;
  render();
}

function nextCard(){
  if(S.done)return;
  if(S.mode==='mc'&&!S.mcAnswered)return;
  if(S.index<S.cards.length-1){
    S.index++; S.flipped=false; S.mcAnswered=false; S.mcSelected=null;
    render();
  } else if(S.mode==='mc'){
    S.done=true; render();
  }
}

function prevCard(){
  if(S.index>0&&!S.done){
    S.index--; S.flipped=false; S.mcAnswered=false; S.mcSelected=null;
    render();
  }
}

// ── EVENT LISTENERS ───────────────────────────────────────────────────────────
document.querySelectorAll('.subj-tab').forEach(b=>b.addEventListener('click',()=>{
  S.subject=b.dataset.subject; S.topic='all';
  applyTheme(); populateTopics(); loadCards(); render();
}));

document.querySelectorAll('#tier-toggle .pill-btn').forEach(b=>b.addEventListener('click',()=>{
  S.tier=b.dataset.tier; loadCards(); render();
}));

document.querySelectorAll('#mode-toggle .pill-btn').forEach(b=>b.addEventListener('click',()=>{
  S.mode=b.dataset.mode; loadCards(); render();
}));

document.getElementById('topic-select').addEventListener('change',e=>{
  S.topic=e.target.value; loadCards(); render();
});

document.getElementById('btn-next').addEventListener('click',nextCard);
document.getElementById('btn-prev').addEventListener('click',prevCard);

document.getElementById('btn-shuffle').addEventListener('click',()=>{
  S.cards=shuffle(S.cards); S.index=0; S.flipped=false;
  S.mcAnswered=false; S.mcSelected=null; S.done=false;
  render();
});

document.getElementById('btn-restart').addEventListener('click',()=>{
  loadCards(); render();
});

document.getElementById('login-btn').addEventListener('click',doLogin);
document.getElementById('login-pin').addEventListener('keydown',function(e){
  if(e.key==='Enter')doLogin();
});
document.getElementById('login-name').addEventListener('keydown',function(e){
  if(e.key==='Enter')document.getElementById('login-pin').focus();
});

document.getElementById('btn-progress').addEventListener('click',showProgress);
document.getElementById('prog-close').addEventListener('click',function(){
  document.getElementById('progress-modal').style.display='none';
});
document.getElementById('progress-modal').addEventListener('click',function(e){
  if(e.target===this)this.style.display='none';
});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')nextCard();
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp')prevCard();
  else if(e.key===' '&&S.mode==='fc'&&S.cards.length){
    e.preventDefault();
    if(!S.flipped){S.flipped=true;renderCard();renderProgress();}
  }
});

// ── APP START ─────────────────────────────────────────────────────────────────
function startApp(){
  try{
    var bio=typeof QB!=='undefined'?Object.keys(QB).length:0;
    var phy=typeof QB_PHYSICS!=='undefined'?Object.keys(QB_PHYSICS).length:0;
    var che=typeof QB_CHEM!=='undefined'?Object.keys(QB_CHEM).length:0;
    if(!bio||!phy||!che){
      var d=document.getElementById('ios-error');
      d.style.display='block';
      d.style.background='#b45309';
      d.textContent='QB LOAD ERROR\nBiology topics: '+bio+'\nPhysics topics: '+phy+'\nChemistry topics: '+che;
      return;
    }
    applyTheme();
    populateTopics();
    loadCards();
    render();
  }catch(e){
    var d=document.getElementById('ios-error');
    d.style.display='block';
    d.textContent='INIT ERROR: '+e.message+'\n'+(e.stack||'');
  }
}

function init(){
  // Try auto-login from localStorage, fall back to showing login screen
  tryAutoLogin().then(function(success){
    if(!success){
      document.getElementById('login-overlay').style.display='flex';
    }
  }).catch(function(){
    document.getElementById('login-overlay').style.display='flex';
  });
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}

</script>
</body>
</html>
