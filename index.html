  {q:'Air is pumped into a tyre at constant temperature and volume. What best explains the increase in pressure?', o:['The particles move faster','There are more particles causing more frequent collisions with the tyre walls','The volume of each particle increases','The temperature increases'], c:1, e:'At constant temperature, particle speed does not change. More particles in the same volume → more collisions per second with the tyre walls → greater force per unit area → higher pressure.', s:AQA_P1H_MOCK23},
]},

'atomic-structure': { name: 'Atomic Structure & Radioactivity', fc: [
  {q:'Describe the nuclear model of the atom.', a:'A tiny, dense, positively charged nucleus (protons + neutrons) surrounded by electrons in shells. Most of the atom is empty space.'},
  {q:'What are the relative masses and charges of a proton, neutron, and electron?', a:'Proton: mass 1, charge +1. Neutron: mass 1, charge 0. Electron: mass ~0, charge −1.'},
  {q:'What is atomic number and mass number?', a:'Atomic number (Z) = number of protons. Mass number (A) = protons + neutrons. Neutrons = A − Z.'},
  {q:'What are isotopes?', a:'Atoms of the same element with the same number of protons but different numbers of neutrons (different mass numbers). Some isotopes are radioactive.'},
  {q:'What are the three types of nuclear radiation?', a:'Alpha (α): helium nucleus, +2 charge, stopped by paper. Beta (β): fast electron, −1 charge, stopped by aluminium. Gamma (γ): EM wave, no charge, reduced by thick lead.'},
  {q:'What is alpha (α) radiation?', a:'A helium-4 nucleus (2 protons + 2 neutrons). Charge: +2. Strongly ionising. Stopped by a few cm of air or paper. Deflected by electric/magnetic fields.'},
  {q:'What is beta (β) radiation?', a:'A fast-moving electron emitted when a neutron → proton. Charge: −1. Moderately ionising. Stopped by a few mm of aluminium. Deflected by fields.'},
  {q:'What is gamma (γ) radiation?', a:'Electromagnetic radiation from the nucleus. No charge, no mass. Weakly ionising, very penetrating — reduced by thick lead or concrete. Not deflected by fields.'},
  {q:'What is half-life?', a:'The time for half the radioactive nuclei in a sample to decay, or for the activity to halve. It is constant for a given isotope and cannot be changed.'},
  {q:'What is nuclear fission?', a:'Splitting of a large unstable nucleus (e.g. U-235) by a neutron into two smaller nuclei, releasing energy and 2–3 neutrons that can trigger a chain reaction.', t:'H'},
  {q:'What is nuclear fusion?', a:'Two small nuclei (e.g. hydrogen isotopes) join to form a larger nucleus, releasing a large amount of energy. Requires extremely high temperatures and pressures.', t:'H'},
  {q:'What are the sources of background radiation?', a:'Radon gas from rocks (biggest source in UK), cosmic rays, food and drink, medical uses, nuclear industry, building materials.'},
  {q:'What did Rutherford\'s gold foil experiment show?', a:'Most alpha particles passed straight through, but some were deflected and a few bounced back. This proved atoms have a small, dense, positive nucleus with mostly empty space.'},
  {q:'In nuclear fission, what type of electromagnetic radiation is released?', a:'Gamma rays. The fission process also releases neutrons and two smaller daughter nuclei.', s:AQA_P1H},
  {q:'Suggest one precaution taken to reduce the hazard from radioactive waste with a long half-life.', a:'Store deep underground in thick concrete or lead-lined sealed containers; monitor storage sites continuously. Long half-life means the waste remains dangerous for thousands of years.', s:AQA_P1H},
  {q:'State one precaution to reduce radiation dose when working near a radioactive source.', a:'Increase distance from the source (intensity decreases with distance) / minimise time spent near source / use lead, concrete, or thick glass shielding.', s:AQA_P1H},
  {q:'State one precaution to avoid contamination when handling radioactive sources.', a:'Wear gloves and lab coat / use tongs — never touch the source directly / wash hands thoroughly afterwards.', s:AQA_P1H},
  {q:'A nuclear power station has a power output of 500 MW. Calculate the energy output in 3600 s.', a:'E = Pt = 500 × 10⁶ × 3600 = 1.8 × 10⁹ J', t:'H', s:AQA_P1H},
  {q:'Krypton-85 (Kr, atomic number 36) undergoes beta-minus decay. Write the nuclear equation and state the products.', a:'In β⁻ decay a neutron converts to a proton: mass number stays at 85, atomic number increases by 1 (36 → 37 = Rubidium). Equation: ⁸⁵₃₆Kr → ⁸⁵₃₇Rb + ⁰₋₁β. The missing numbers in the equation are 85 (mass number) and 37 (atomic number) for Rb.', t:'H', s:AQA_P1H_22},
  {q:'Explain how the risk from internal contamination by an alpha source differs from external irradiation by the same source.', a:'External: alpha has very low penetrating ability — stopped by a few cm of air or by skin. External irradiation is therefore low risk. Internal: if an alpha source is inside the body, radiation is absorbed directly by living cells, tissues, and organs. Alpha is highly ionising, so internal contamination causes far greater damage to DNA and cells — significantly increasing the risk of cancer or mutations.', s:AQA_P1H_22},
  {q:'Complete the sentences: Nuclear fusion is the joining together of ___. During nuclear fusion, the total mass of the particles ___.', a:'Nuclear fusion is the joining together of nuclei (not atoms). During nuclear fusion, the total mass of the particles decreases (the mass difference is converted into the energy released).', s:AQA_P1H_NOV21},
  {q:'Electricity is used to increase the temperature of 4.0 g of deuterium by 50 000 000 °C. Specific heat capacity of deuterium = 5200 J/kg°C. Calculate the energy needed.', a:'Convert mass: m = 4.0 g = 0.004 kg. Q = mcΔθ = 0.004 × 5200 × 50 000 000 = 1.04 × 10⁹ J.', t:'H', s:AQA_P1H_NOV21},
  {q:'Models of nuclear fusion were tested before building the first commercial fusion power station. Suggest two reasons why models were tested.', a:'Any two of: (1) To confirm the fusion process is achievable. (2) To develop understanding of the process. (3) To identify adaptations needed. (4) To assess the efficiency. (5) To make predictions about full-scale performance. (6) To assess safety risks. (7) To assess environmental impact. (8) Small-scale experiments are far cheaper than full-scale construction.', s:AQA_P1H_NOV21},
  {q:'Figure 6 shows five atoms (A–E) with their mass numbers and atomic numbers. How many neutrons are there in nucleus A (mass number 230, atomic number 82)?', a:'⚠️ DIAGRAM REQUIRED — Figure 6 shows atom A with mass number 230 and atomic number 82. Neutrons = mass number − atomic number = 230 − 82 = 148 neutrons.', s:AQA_P1H_NOV21},
  {q:'Figure 7 shows nucleus B which decays by emitting an alpha particle. Describe what the nuclear equation shows about the daughter nucleus.', a:'⚠️ DIAGRAM REQUIRED — Figure 7 requires drawing an arrow from B to the daughter nucleus position. Alpha decay: mass number decreases by 4, atomic number decreases by 2. If B has 88 protons and mass number 226: daughter has 86 protons (Radon) and mass number 222.', t:'H', s:AQA_P1H_NOV21},
  {q:'What is meant by the \'random nature of radioactive decay\'?', a:'It is impossible to predict which nucleus in a sample will decay next, or when a particular nucleus will decay. Each decay is spontaneous and cannot be controlled or predicted for individual nuclei.', s:AQA_P1H_NOV21},
  {q:'A Po nucleus decays by emitting an alpha particle (forming Pb), then Pb emits a beta particle (forming Bi), then Bi emits a beta particle (forming Po). Explain how these three decays return to the original element.', a:'Alpha emission decreases the atomic number by 2. Each beta emission increases the atomic number by 1. Net change: −2 + 1 + 1 = 0. The final nucleus has the same atomic number as the original polonium nucleus, so it is the same element. Mass number is unchanged by the two beta decays, but decreases by 4 from alpha, so final Po has different mass number.', t:'H', s:AQA_P1H_NOV21},
  {q:'A decay diagram (Figure 7) shows mass number decreasing by 4 and atomic number decreasing by 2. Which type of radiation does nucleus D emit?', a:'⚠️ DIAGRAM REQUIRED — Figure 7 shows the decay of nucleus D with mass number −4 and atomic number −2. This identifies alpha decay. An alpha particle is a helium-4 nucleus (2 protons + 2 neutrons). It carries a +2 charge and has very low penetrating power.', s:AQA_P1F_NOV21},
  {q:'A decay diagram (Figure 8) shows mass number staying the same and atomic number increasing by 1. Which type of radiation does nucleus E emit?', a:'⚠️ DIAGRAM REQUIRED — Figure 8 shows the decay of nucleus E with mass number unchanged and atomic number +1. This identifies beta-minus decay. A neutron converts to a proton and emits a high-energy electron (beta particle). Atomic number increases by 1; mass number unchanged.', s:AQA_P1F_NOV21},
  {q:'A beta source monitors paper thickness in a factory (Figure 9). The thickness of paper between the source and detector increases. What happens to the detector reading and why?', a:'The detector reading decreases. Thicker paper absorbs more beta radiation — the amount of radiation absorbed by the paper increases, so less beta passes through to reach the detector. The computer detects the lower reading and adjusts the rollers to reduce the paper thickness.', s:AQA_P1F_NOV21},
  {q:'Give one man-made source of background radiation other than nuclear power stations.', a:'Any one of: medical uses (X-rays, radiotherapy, radioactive tracers used in medical diagnosis); nuclear weapons testing fallout; nuclear weapons.', s:AQA_P1H_NOV20},
  {q:'Give the name of one nuclear fuel used in nuclear fission power stations.', a:'Uranium (specifically uranium-235 / U-235) is the most commonly used nuclear fuel. Plutonium (plutonium-239 / Pu-239) is also used in some reactors.', s:AQA_P1H_NOV20},
  {q:'Describe the process of nuclear fission inside a nuclear reactor.', a:'(1) A slow (thermal) neutron is absorbed by a large, unstable nucleus (e.g. uranium-235). (2) The nucleus becomes highly unstable and splits into two smaller daughter nuclei (fission fragments). (3) The fission also releases 2–3 neutrons and a large amount of energy (as kinetic energy of fragments and gamma radiation). (4) The released neutrons can trigger further fission events — a sustained chain reaction. (5) Control rods (e.g. boron) absorb surplus neutrons to regulate the reaction rate. (6) A moderator (e.g. graphite or water) slows the neutrons so they are more likely to cause fission.', t:'H', s:AQA_P1H_NOV20},
  {q:'Explain how the process of nuclear fusion leads to the release of energy.', a:'In nuclear fusion, two light nuclei (e.g. deuterium and tritium — isotopes of hydrogen) are forced together at extremely high temperature and pressure, overcoming their electrostatic repulsion. The nuclei fuse to form a larger nucleus. The total mass of the products is slightly less than the total mass of the original nuclei — this mass difference is converted into a large amount of energy (E = mc²). Energy is released because c² is a very large number.', t:'H', s:AQA_P1H_NOV20},
  {q:'Nuclear fusion waste has a much shorter half-life than nuclear fission waste. Explain the advantage of the fusion waste having a shorter half-life.', a:'A shorter half-life means the activity of the waste decreases more rapidly. The waste reaches safe radiation levels (comparable to natural background radiation) in a much shorter time than fission waste, which remains dangerously radioactive for thousands of years. This significantly reduces the duration and cost of hazardous storage, and the risk of long-term environmental contamination.', s:AQA_P1H_NOV20},
], mc: [
  {q:'Which type of radiation is most ionising?', o:['Alpha','Beta','Gamma','X-rays'], c:0, e:'Alpha particles are large, slow, and carry +2 charge — they interact strongly with matter, causing the most ionisation per unit distance.'},
  {q:'A radioactive sample has activity 800 Bq. After 3 half-lives, what is the activity?', o:['400 Bq','200 Bq','100 Bq','50 Bq'], c:2, e:'800 → 400 → 200 → 100 Bq. After each half-life, activity halves.', t:'H'},
  {q:'Which type of radiation is stopped by a sheet of paper?', o:['Alpha','Beta','Gamma','All three'], c:0, e:'Alpha particles are the least penetrating — stopped by a few cm of air or a thin sheet of paper.', t:'F'},
  {q:'Carbon-14 has 6 protons and 8 neutrons. Its mass number is:', o:['6','8','14','2'], c:2, e:'Mass number = protons + neutrons = 6 + 8 = 14.'},
  {q:'When a nucleus emits beta radiation, its atomic number:', o:['Decreases by 1','Stays the same','Increases by 1','Increases by 2'], c:2, e:'A neutron → proton + β⁻ particle. Proton count increases by 1; mass number unchanged.', t:'H'},
  {q:'Nuclear fusion is difficult to achieve on Earth because:', o:['It produces too little energy','It requires extremely high temperatures and pressures to overcome repulsion between nuclei','It only works with very large nuclei','It produces dangerous alpha particles'], c:1, e:'Nuclei are positively charged and strongly repel. Temperatures above ~10 million °C are needed to give nuclei enough energy to fuse.', t:'H'},
  {q:'What is the purpose of the moderator in a nuclear fission reactor?', o:['To absorb neutrons and stop the reaction','To slow neutrons so they are more likely to cause further fission','To cool the reactor core','To shield workers from radiation'], c:1, e:'Fast neutrons are unlikely to cause fission of U-235. The moderator (e.g. graphite, water) slows them, increasing the probability of a chain reaction.', t:'H'},
  {q:'In nuclear fission, which particles are released and can trigger a chain reaction?', o:['Electrons','Protons','Neutrons','Alpha particles'], c:2, e:'Fission of U-235 releases 2–3 neutrons. These can strike other U-235 nuclei and cause further fission — sustaining a chain reaction in the reactor.', s:AQA_P1H},
  {q:'Why does Source A\'s count rate drop to near zero within ~5 cm in air, showing it emits only alpha?', o:['Alpha travels slowly so takes longer','Alpha has very short range in air (a few cm) and is absorbed quickly','Alpha is deflected by air molecules','Alpha has low ionising power'], c:1, e:'Alpha particles are large and highly ionising — they lose energy very quickly in air and are stopped within a few centimetres. Gamma (Source B) travels many metres in air.', s:AQA_P1H},
  {q:'Figure 6 shows five atoms (A–E) with mass numbers and atomic numbers. Which two atoms are the same element?', o:['A and B','A and C','C and D','D and E'], c:3, e:'⚠️ DIAGRAM REQUIRED — Figure 6 shows atoms D and E have the same atomic number (same number of protons), making them the same element (isotopes of each other — same element, different mass numbers). Same element = same atomic number.', s:AQA_P1H_NOV21},
  {q:'Which of the following is the same for all atoms of the same element?', o:['Atomic number','Mass number','Neutron number'], c:0, e:'All atoms of the same element have the same atomic number (number of protons). Isotopes of an element have the same atomic number but different mass numbers and different neutron numbers (different numbers of neutrons).', s:AQA_P1F_NOV21},
  {q:'Which of the following is different for isotopes of the same element?', o:['Number of electrons','Number of neutrons','Number of protons'], c:1, e:'Isotopes have the same atomic number (same protons, same electrons) but different numbers of neutrons, giving them different mass numbers. Having the same number of electrons means isotopes have the same chemical properties.', s:AQA_P1F_NOV21},
  {q:'What is meant by the half-life of a radioactive substance?', o:['The time it takes for all nuclei in a sample to split in half','The time it takes for the count rate of a radioactive sample to halve','The time it takes for radiation to travel half its range in air'], c:1, e:'Half-life is the time for the count rate (or activity, or number of undecayed nuclei) of a radioactive sample to decrease to half its original value. It is constant for a given isotope and cannot be changed by physical or chemical means.', s:AQA_P1F_NOV21},
  {q:'A beta radiation source monitors paper thickness in a factory. Why should the source have a long half-life?', o:['So the activity of the source is approximately constant','So the amount of radiation decreases quickly','So the radiation has a long range in air'], c:0, e:'A long half-life means the activity changes very little over the operational period. This ensures consistent detector readings, so changes in the detector reading are due only to changes in paper thickness — not to decay of the source.', s:AQA_P1F_NOV21},
  {q:'Which of the following is a man-made source of background radiation?', o:['Radon gas from rocks','Cosmic rays from space','Nuclear weapons testing fallout','Radioactivity in food and drink'], c:2, e:'Nuclear weapons testing fallout is a man-made (artificial) source of background radiation. Radon gas from rocks, cosmic rays, and radioactivity in food and drink are all natural sources.', s:AQA_P1H_NOV20},
  {q:'Which statement correctly describes nuclear fission?', o:['Two small nuclei join together to form a larger nucleus, releasing energy','A large nucleus splits into two smaller nuclei after absorbing a neutron, releasing energy and further neutrons','A nucleus emits an alpha particle, reducing its mass number by 4','A nucleus emits a beta particle, increasing its proton number by 1'], c:1, e:'Fission = splitting a large nucleus (e.g. U-235) after absorbing a slow neutron → two daughter nuclei + 2–3 neutrons + large energy release. Option 1 describes fusion. Options 3 and 4 describe radioactive decay, not fission.', t:'H', s:AQA_P1H_NOV20},
  {q:'Compare the structure of an atom of carbon-14 with the structure of an atom of carbon-12.', a:'Both atoms of carbon-14 and carbon-12 have 6 protons and 6 electrons (same element, same atomic number). Carbon-12 has 6 neutrons; carbon-14 has 8 neutrons. Carbon-14 has 2 more neutrons than carbon-12. The mass number of carbon-14 (14) is greater than that of carbon-12 (12).', s:AQA_P1H_MOCK23},
  {q:'Carbon-14 has a half-life of 5700 years. What does this mean?', a:'The half-life of 5700 years means that the activity (count rate / number of undecayed carbon-14 nuclei) of a sample of carbon-14 will decrease to half its original value every 5700 years. After 5700 years, half the carbon-14 nuclei in the sample will have decayed.', s:AQA_P1H_MOCK23},
  {q:'A sample of fluorine-17 has an activity that is one quarter of its original activity. Fluorine-17 has a half-life of 64.37 seconds. Calculate the age of the sample.', a:'Activity reduced to ¼ = two half-lives (½ × ½ = ¼). Age = 2 × 64.37 = 128.74 s ≈ 129 s.', t:'H', s:AQA_P1H_MOCK23},
  {q:'TABLE 1 shows four isotopes that all emit beta radiation with half-lives: Nitrogen-18 (0.62 s), Nitrogen-17 (4.17 s), Fluorine-17 (64.37 s), Fluorine-18 (6584.34 s). Which isotope would cause the biggest risk based only on its half-life? Explain.', a:'Nitrogen-18 would cause the biggest immediate risk — it has the shortest half-life (0.62 s), which means it has the highest activity (most decays per second) for a given number of atoms. More decays per second = more beta radiation emitted per second = greatest immediate radiation dose. (Note: Fluorine-18 has the longest half-life and would remain radioactive for the longest time, causing prolonged exposure if a source persisted in the environment.)', t:'H', s:AQA_P1H_MOCK23},
  {q:'Describe the difference between irradiation and contamination.', a:'Irradiation: exposure to nuclear radiation from an external source. The person does not become radioactive. The exposure stops when the person moves away from the source. Contamination: radioactive material is deposited on or inside the body (on skin, inhaled, or ingested). The person then carries the radioactive source — they continue to be irradiated even when removed from the original source environment.', s:AQA_P1H_MOCK23},
  {q:'Give ONE health risk to a person working close to a source of nuclear radiation.', a:'Any one of: increased risk of cancer / damage to DNA / genetic mutations / radiation sickness / increased risk of developing leukaemia. (Nuclear radiation can ionise atoms in body cells, damaging or killing cells, or causing mutations that can lead to cancer.)'},
  {q:'Workers who monitor their radiation exposure stand 1 cm from a detector. Explain why they need to stand close to the detector.', a:'Radiation intensity decreases with distance from a source (following an inverse square law). The amount of radiation emitted by a monitored worker is very low — close to background radiation levels. By standing only 1 cm away, the count rate at the detector is much higher than at greater distances, making it possible to detect and measure the small amounts of radiation emitted by the worker. At greater distances the radiation from the worker would be undetectable above background.', t:'H', s:AQA_P1H_MOCK23},
  {q:'A nuclear power station worker receives 0.00050 mSv per day. A pilot receives 0.0030 mSv per hour from cosmic radiation while flying. Calculate the number of days for the worker to receive the same dose as a pilot flying for 24 hours.', a:'Pilot\'s dose in 24 hours = 0.0030 × 24 = 0.072 mSv. Days for worker = 0.072 ÷ 0.00050 = 144 days.', t:'H', s:AQA_P1H_MOCK23},
  {q:'Match each subatomic particle to its year of discovery: Electron, Neutron, Nucleus, Proton.', a:'Electron: 1897 (J.J. Thomson — cathode ray experiment). Nucleus: 1911 (Rutherford — alpha particle scattering). Proton: 1920 (Rutherford — named by Rutherford). Neutron: 1932 (Chadwick).', s:AQA_P1H_MOCK23},
  {q:'In an alpha particle scattering experiment (Figure 8), alpha particle A passes straight through the gold foil without deflection. Explain why.', a:'⚠️ DIAGRAM REQUIRED — Figure 8 shows alpha particle paths through gold foil. Alpha particle A passes at a large distance from any gold nucleus. Because the nucleus is tiny relative to the size of the atom (atom is mostly empty space), most alpha particles miss the nucleus by a large distance. At a large distance, the electrostatic repulsive force between the positively charged alpha particle and the positively charged nucleus is negligible. Therefore particle A experiences no significant force and continues in a straight line.', s:AQA_P1H_MOCK23},
  {q:'In an alpha particle scattering experiment (Figure 8), alpha particle B is more tightly curved than alpha particle C. Explain why.', a:'⚠️ DIAGRAM REQUIRED — Figure 8 shows alpha particle paths through gold foil. Alpha particle B passes closer to the nucleus than alpha particle C. The closer an alpha particle is to the nucleus, the stronger the electrostatic (Coulomb) repulsive force between the positive alpha particle and the positive nucleus. A stronger repulsive force causes greater deflection — so B is deflected more sharply/tightly than C.', s:AQA_P1H_MOCK23},
  {q:'In an alpha particle scattering experiment, most alpha particles (D, E, F, G) pass straight through the gold foil. What does this tell us about the atom?', a:'The atom is mostly empty space. Most alpha particles pass through without deflection because they do not pass near any nucleus. The nucleus is tiny compared with the size of the whole atom, so most alpha particles miss it entirely and travel straight through.', s:AQA_P1H_MOCK23},
  {q:'How is the Bohr model of the atom different from the nuclear (Rutherford) model?', a:'In the nuclear (Rutherford) model, electrons orbit the nucleus at any distance — there are no fixed orbits or energy levels. In the Bohr model (1913), electrons can only exist in specific, fixed energy levels (shells) at set distances from the nucleus. Electrons cannot exist between energy levels.', s:AQA_P1H_MOCK23},
  {q:'Explain how an electron can move up and down between energy levels in an atom.', a:'Moving up (to higher energy level): the electron absorbs a photon of electromagnetic radiation. The photon\'s energy equals exactly the difference in energy between the two levels. The electron is now in an excited state. Moving down (to lower energy level): the electron emits a photon of electromagnetic radiation. The photon\'s energy equals the difference in energy between the two levels. The frequency (and therefore colour/type) of the emitted photon corresponds to this specific energy difference.', t:'H', s:AQA_P1H_MOCK23},
  {q:'A sample of fluorine-17 (half-life = 64.37 s) has its activity reduced to one quarter of its original value. How old is the sample?', o:['32.2 s','64.37 s','128.74 s','257.48 s'], c:2, e:'Activity reduced to ¼ of original = 2 half-lives (½ × ½ = ¼). Age = 2 × 64.37 = 128.74 s.', t:'H', s:AQA_P1H_MOCK23},
  {q:'What can be concluded about the atom from the fact that most alpha particles pass straight through gold foil without deflection?', o:['The atom contains a nucleus','The atom contains protons, neutrons and electrons','The atom is mostly empty space'], c:2, e:'Most alpha particles are undeflected, passing straight through. This means they miss the nucleus. For this to happen, the nucleus (where the charge is concentrated) must be very small relative to the atom — the atom is mostly empty space.', s:AQA_P1H_MOCK23},
  {q:'When was the neutron discovered?', o:['1897','1911','1920','1932'], c:3, e:'Neutron: discovered in 1932 by James Chadwick. Electron: 1897 (Thomson). Nucleus: 1911 (Rutherford). Proton: 1920 (Rutherford).', s:AQA_P1H_MOCK23},
  {q:'A nuclear worker receives 0.00050 mSv per day. A pilot receives 0.0030 mSv per hour from cosmic rays. How many days does it take the worker to receive the same dose as a pilot flying 24 hours?', o:['24 days','72 days','144 days','288 days'], c:2, e:'Pilot 24-hour dose = 0.0030 × 24 = 0.072 mSv. Days for worker = 0.072 ÷ 0.00050 = 144 days.', t:'H', s:AQA_P1H_MOCK23},
]},
