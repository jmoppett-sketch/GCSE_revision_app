  {q:'The National Grid transferred 1.25 × 10¹⁸ J of energy in one year (3.16 × 10⁷ seconds). Calculate the mean energy transferred each second. Give your answer to 3 significant figures.', a:'Mean energy per second = 1.25 × 10¹⁸ ÷ 3.16 × 10⁷ = 3.96 × 10¹⁰ J (to 3 s.f.).', t:'H', s:AQA_P1H_NOV21},
  {q:'Solar cells have a total power input of 7.8 kW and an efficiency of 0.15. Calculate the useful power output.', a:'Efficiency = useful output ÷ total input. Useful output = 0.15 × 7800 = 1170 W.', s:AQA_P1H_NOV21},
  {q:'Explain why it is unlikely that all of the electricity the UK needs can be generated by solar power.', a:'Any of: (1) A very large area of land would need to be covered with solar cells due to the low efficiency (only ~15%). (2) The number of hours of daylight in the UK is too low. (3) Solar intensity in the UK is relatively low. (4) Material for solar cells and batteries is in limited supply.', s:AQA_P1H_NOV21},
  {q:'Explain one environmental effect of generating electricity using fossil fuels.', a:'Any one of: (1) Releases CO₂ → causes global warming/climate change. (2) Releases particulates → causes global dimming or breathing problems. (3) Releases SO₂ → causes acid rain. (4) Releases nitrogen oxides → breathing problems or acid rain.', s:AQA_P1H_NOV21},
  {q:'A toy car (mass 0.040 kg) is released from rest at position A and slides to position B. The vertical height A to B is 90 cm and g = 9.8 N/kg. Calculate the maximum possible speed at B.', a:'GPE = mgh = 0.040 × 9.8 × 0.90 = 0.3528 J. All GPE → KE: 0.3528 = ½ × 0.040 × v² → v² = 17.64 → v = 4.2 m/s.', t:'H', s:AQA_P1H_NOV21},
  {q:'Solar cells on a roof always face the same direction. Explain one disadvantage caused by this.', a:'Solar cells facing a fixed direction are not always pointed directly at the Sun (the Sun moves across the sky during the day and changes position through the seasons). This means the cells do not always receive maximum solar radiation intensity, so they generate less electricity than they could if they tracked the Sun.', s:AQA_P1F_NOV21},
  {q:'Solar cells have a total power input of 7500 W and an efficiency of 0.16. Calculate the useful power output.', a:'Efficiency = useful power output ÷ total power input. Rearrange: useful power output = efficiency × total input = 0.16 × 7500 = 1200 W.', s:AQA_P1F_NOV21},
  {q:'A diver falls from a diving board towards the water. Which energy store decreases and which energy store increases?', a:'As the diver falls: gravitational potential energy store decreases (height decreases). Kinetic energy store increases (speed increases). Energy is transferred from the gravitational potential store to the kinetic store.', s:AQA_P1F_NOV21},
  {q:'At the instant a diver hits the water, her kinetic energy is 5040 J and her speed is 12 m/s. Calculate her mass.', a:'KE = ½mv². 5040 = ½ × m × 12² = 0.5 × m × 144 = 72m. m = 5040 ÷ 72 = 70 kg.', s:AQA_P1F_NOV21},
  {q:'Write down the equation which links energy transferred (E), power (P) and time (t).', a:'E = Pt where E = energy transferred (joules, J), P = power (watts, W), t = time (seconds, s). Rearranged: P = E/t and t = E/P.', s:AQA_P1H_NOV20},
  {q:'A hydroelectric power station can provide 1.5 × 10⁹ W of power for a maximum of 5 hours. Calculate the maximum energy that can be transferred by the electrical generators.', a:'Convert time: t = 5 × 3600 = 18 000 s. E = Pt = 1.5 × 10⁹ × 18 000 = 2.7 × 10¹³ J.', t:'H', s:AQA_P1H_NOV20},
  {q:'Figure 5 shows UK electricity demand over one day. The demand increase between 04:00 and 16:00 lasts 12 hours and exceeds 1.5 × 10⁹ W. A hydroelectric power station provides 1.5 × 10⁹ W for a maximum of 5 hours. Give two reasons why this station cannot meet the increase in demand shown.', a:'⚠️ DIAGRAM REQUIRED — Figure 5 shows UK daily electricity demand. (1) The period of increased demand (04:00 to 16:00) is 12 hours, but the station can only sustain maximum power for 5 hours — the duration is insufficient. (2) The peak demand exceeds 1.5 × 10⁹ W — the station\'s maximum power output is too low to meet the peak demand.', s:AQA_P1H_NOV20},
  {q:'Give two environmental advantages of using a gas-fired power station to generate electricity compared with using a coal-fired power station.', a:'Any two of: (1) Gas releases less CO₂ per unit of electricity generated than coal — less contribution to global warming/climate change. (2) Gas produces less sulfur dioxide (SO₂) — less acid rain. (3) Gas produces fewer particulates — less air pollution / global dimming. (4) Gas does not require large-scale surface mining, causing less land damage.', s:AQA_P1H_NOV20},
  {q:'Figure 6 shows electricity generated from gas-fired and coal-fired stations in January over 5 years. Determine the percentage increase in electricity from gas-fired stations from 2014 to 2018.', a:'⚠️ DIAGRAM REQUIRED — Figure 6 shows a bar chart of electricity generated. Method: read off the gas-fired generation values for 2014 and 2018. Percentage increase = [(2018 value − 2014 value) ÷ 2014 value] × 100. Show all working clearly.', t:'H', s:AQA_P1H_NOV20},
  {q:'Figure 7 shows mean sea surface temperature from 1988 to 2016. A student claims climate change is not occurring. Explain how the data in Figure 7 suggests the student is wrong.', a:'⚠️ DIAGRAM REQUIRED — Figure 7 shows mean sea surface temperature over time. The data shows an overall upward trend in mean sea surface temperature across the period, despite year-to-year fluctuations. Temperatures in later years are higher than in earlier years, indicating global warming — evidence that climate change is occurring.', s:AQA_P1H_NOV20},
  {q:'Figure 8 shows resistance vs temperature for four thermistors A, B, C and D. Which thermistor is most suitable to measure the surface temperature of the sea? Explain your answer.', a:'⚠️ DIAGRAM REQUIRED — Figure 8 shows resistance-temperature graphs. The most suitable thermistor: (1) must cover the range of sea surface temperatures (approximately −2°C to 35°C); and (2) should show the largest change in resistance over that range (steepest gradient) for greatest sensitivity, allowing the most precise temperature reading. Select the thermistor whose resistance changes most across the sea temperature range.', s:AQA_P1H_NOV20},
  {q:'When an electric kettle was switched on, the temperature of the water did not immediately start to increase. Suggest one reason why.', a:'The heating element needs time to heat up before it can transfer significant energy to the water, OR some initial energy is transferred to the kettle body and element itself rather than to the water, OR there is a short delay before heat conducts from the element into the bulk of the water.', s:AQA_P1H_NOV20},
], mc: [
  {q:'A 2 kg ball moves at 3 m/s. What is its kinetic energy?', o:['3 J','6 J','9 J','12 J'], c:2, e:'KE = ½mv² = ½ × 2 × 3² = ½ × 2 × 9 = 9 J.', t:'H'},
  {q:'A device uses 500 J of input energy; 350 J is usefully transferred. What is its efficiency?', o:['35%','50%','70%','85%'], c:2, e:'Efficiency = useful/total = 350/500 = 0.7 = 70%.', t:'H'},
  {q:'Why does the National Grid use step-up transformers at power stations?', o:['To increase current and reduce voltage','To reduce current and increase voltage, minimising heat loss in cables','To increase both voltage and current','To convert AC to DC'], c:1, e:'High voltage → low current (P = IV). Lower current → less power wasted as heat (P = I²R).', t:'H'},
  {q:'Specific heat capacity of water = 4200 J/kg°C. How much energy heats 2 kg by 5°C?', o:['2100 J','8400 J','21 000 J','42 000 J'], c:3, e:'Q = mcΔθ = 2 × 4200 × 5 = 42 000 J.', t:'H'},
  {q:'Which of these is a renewable energy resource?', o:['Coal','Natural gas','Solar','Nuclear fuel'], c:2, e:'Solar energy is renewed continuously by the Sun. Coal, natural gas, and nuclear fuel are finite and will eventually run out.', t:'F'},
  {q:'An appliance uses 200 J of input energy and transfers 80 J usefully. How much is wasted?', o:['20 J','80 J','120 J','280 J'], c:2, e:'Wasted energy = input − useful = 200 − 80 = 120 J. Energy is conserved — it is not destroyed but dissipated to the surroundings.', t:'F'},
  {q:'A ball rolls down a ramp. Which energy transfer is occurring?', o:['Chemical to kinetic','Gravitational potential to kinetic','Elastic to kinetic','Nuclear to kinetic'], c:1, e:'As height decreases, GPE decreases; as speed increases, KE increases. GPE → KE (some also wasted as thermal via friction).'},
  {q:'Infrared radiation differs from conduction because it:', o:['Requires a medium to travel through','Can transfer energy through a vacuum without needing particles','Only occurs in metals','Only transfers energy upwards'], c:1, e:'Radiation is an EM wave — it does not need particles and can travel through a vacuum. Conduction requires particles to be in contact.'},
  {q:'A nuclear power station generates electricity for 92% of a year (365 days). How many days is this?', o:['92 days','273 days','336 days','356 days'], c:2, e:'Days = 0.92 × 365 = 335.8 ≈ 336 days.', t:'H', s:AQA_P1H},
  {q:'When stored wind energy is compared: heating water stores 33 600 kJ/100 kg but wastes 40%; pumping uphill stores 490 kJ/100 kg but wastes 25%. Which stores more useful energy per 100 kg?', o:['Method B (pumped water)','Method A (heated water) — higher useful energy despite more waste','They store equal useful energy','Cannot be determined'], c:1, e:'Method A useful = 33600 × 0.60 = 20 160 kJ. Method B useful = 490 × 0.75 = 367.5 kJ. Method A stores far more useful energy per 100 kg, but requires specific geography for Method B.', t:'H', s:AQA_P1H},
  {q:'A boy takes longer than 1.40 s to run up the same stairs as a girl, yet his power output equals hers. What can be concluded about the boy\'s mass?', o:['Less than the girl\'s mass','The same as the girl\'s mass','Greater than the girl\'s mass','Cannot be determined'], c:2, e:'Same power, same height, longer time → P = E/t, so same P and longer t means greater E = mgh must be achieved. Since g and h are the same, m must be greater. The boy is heavier.', s:AQA_P1H_22},
  {q:'As a spring-launched toy aeroplane moves upward through the air, which energy decreases?', o:['Elastic potential energy','Gravitational potential energy','Kinetic energy','Chemical energy'], c:2, e:'The aeroplane slows as it rises (gravity and air resistance act). Speed decreases → kinetic energy decreases. Gravitational potential energy increases as it gains height. Elastic potential energy was released at launch.', s:AQA_P1H_22},
  {q:'Why can the toy car and racing track be modelled as a closed system?', o:['Both have gravitational potential energy','They are always in contact with each other','The total energy of the racing track and the car is constant'], c:2, e:'A closed system is one where total energy is constant — no net energy enters or leaves. The total energy is conserved between stores within the system.', s:AQA_P1H_NOV21},
  {q:'At position C on a loop track, a car\'s GPE is 0.20 J greater than at position B. How much KE must the car have at B to complete the loop?', o:['Less than 0.20 J','Exactly 0.20 J','More than 0.20 J'], c:2, e:'The car must still be moving at the top of the loop (position C) to maintain contact with the track. It needs 0.20 J to gain the GPE, plus extra KE to keep moving at C. Total KE at B must be more than 0.20 J.', s:AQA_P1H_NOV21},
  {q:'What happens to energy that has been dissipated to the surroundings?', o:['The energy becomes less useful','The energy is destroyed','The energy is used to generate electricity'], c:0, e:'Energy cannot be destroyed (conservation of energy). Dissipated energy spreads out to the surroundings as thermal energy — it becomes less useful because it is too spread out to recover and use again.', s:AQA_P1F_NOV21},
  {q:'Why is it unlikely that all the UK\'s electricity needs could be met by solar power systems?', o:['A very large area would need to be covered with solar cells','Solar power is a non-renewable energy resource','The efficiency of solar cells is too high'], c:0, e:'Solar cells have low efficiency (~15–16%). Generating all UK electricity would require covering a vast area with solar panels. Solar power IS renewable (option 2 is incorrect). The efficiency is too LOW, not too high — so option 3 is also wrong.', s:AQA_P1F_NOV21},
  {q:'A diver\'s kinetic energy is transferred to the water on impact. How does this affect the thermal energy of the water?', o:['The thermal energy decreases','The thermal energy stays the same','The thermal energy increases'], c:2, e:'When the diver\'s kinetic energy is transferred to the water, the water molecules gain kinetic energy and move faster. The internal/thermal energy of the water increases — the water temperature rises slightly.', s:AQA_P1F_NOV21},
  {q:'What is the equation linking energy transferred (E), power (P) and time (t)?', o:['E = P ÷ t','E = P + t','E = P × t','t = E × P'], c:2, e:'E = Pt (energy = power × time). Rearranging P = E/t gives E = Pt. Units: joules = watts × seconds.', s:AQA_P1H_NOV20},
  {q:'A gas-fired power station produces less SO₂ than a coal-fired power station. What environmental advantage does this provide?', o:['It reduces global warming directly','It reduces acid rain','It reduces nuclear waste','It reduces infrared radiation'], c:1, e:'Sulfur dioxide (SO₂) dissolves in atmospheric water to form sulfuric acid, producing acid rain. Less SO₂ from gas-fired stations means less acid rain, protecting lakes, forests, and buildings.', s:AQA_P1H_NOV20},
  {q:'A student determines the SHC of iron. Before recording the initial temperature, they leave the thermometer in the iron block for a few minutes. Suggest why.', a:'So that the thermometer reaches thermal equilibrium with the iron block. If the thermometer is not left long enough, it will still be at the temperature of the surrounding air rather than the iron, and the initial temperature reading will be inaccurate.', s:AQA_P1H_MOCK23},
  {q:'A student heats an iron block of mass 2.0 kg. Between 5 and 10 minutes, 26 000 J is transferred to the block. Calculate the specific heat capacity of iron using the temperature change from Figure 3.', a:'⚠️ DIAGRAM REQUIRED — Figure 3 shows a temperature-time graph for the iron block. Read ΔT between 5 and 10 minutes from the graph (approximately 29°C). Rearrange Q = mcΔT: c = Q ÷ (m × ΔT) = 26 000 ÷ (2.0 × ΔT). Example: if ΔT = 29°C → c = 26 000 ÷ 58 ≈ 448 J/kg°C (close to 450 J/kg°C for iron). Show all working.', t:'H', s:AQA_P1H_MOCK23},
  {q:'A student wraps insulation around an iron block in a specific heat capacity experiment. Which TWO effects does this have?', a:'(1) The calculated SHC will be more accurate — less energy is lost to the surroundings, so more of the measured energy input actually goes into heating the iron. (2) The iron block transfers thermal energy to the surroundings at a lower rate — insulation reduces heat loss.', s:AQA_P1H_MOCK23},
  {q:'In one day, 2 500 000 kg of water passes through a hydroelectric generator. The change in GPE is 367.5 MJ (g = 9.8 N/kg). Calculate the mean change in vertical height of the water.', a:'Rearrange GPE = mgh → h = GPE ÷ (mg) = 367 500 000 ÷ (2 500 000 × 9.8) = 367 500 000 ÷ 24 500 000 = 15 m.', t:'H', s:AQA_P1H_MOCK23},
  {q:'A hydroelectric generator has a power output of 3.0 kW. Calculate the time taken to transfer 2.16 × 10⁷ J of energy. Give your answer in standard form.', a:'Rearrange P = E/t → t = E ÷ P = 2.16 × 10⁷ ÷ 3000 = 7200 s = 7.2 × 10³ s.', t:'H', s:AQA_P1H_MOCK23},
  {q:'Figure 5 shows how the power output of a hydroelectric generator varied over one year. A solar power system is also installed. Explain why this improves the reliability of the electricity supply.', a:'⚠️ DIAGRAM REQUIRED — Figure 5 shows power output varying through the year. When the hydroelectric generator\'s output is low (e.g. in dry seasons or months with low rainfall), the solar system can still generate electricity. The two systems complement each other — when one produces less, the other compensates. This ensures a more continuous and reliable supply of electricity throughout the year.', s:AQA_P1H_MOCK23},
  {q:'A baby bouncer has a maximum mass limit of 12 kg. Suggest ONE reason why it should not be used with babies heavier than this.', a:'The spring may stretch beyond its elastic limit, permanently deforming and no longer returning to its original length, making the bouncer unsafe. Alternatively: the harness may not be strong enough to safely support a heavier baby.', s:AQA_P1H_MOCK23},
  {q:'A baby in a bouncer is stationary at position A (bottom) and at position B (top). Describe the energy transfers as the baby moves from position A to position B.', a:'As the baby moves upward from A to B: elastic potential energy stored in the stretched spring decreases → this transfers to kinetic energy (baby moves) and gravitational potential energy (baby gains height). Some energy is also transferred as thermal energy to the surroundings due to air resistance and friction in the spring.', s:AQA_P1H_MOCK23},
  {q:'A spring in a baby bouncer has an extension of 8.0 cm and stores 4.0 J of elastic potential energy. Calculate the spring constant.', a:'Convert: e = 8.0 cm = 0.080 m. Rearrange EPE = ½ke²: k = 2 × EPE ÷ e² = (2 × 4.0) ÷ (0.080²) = 8.0 ÷ 0.0064 = 1250 N/m.', t:'H', s:AQA_P1H_MOCK23},
  {q:'A hydroelectric generator transfers 3.0 kW of electrical power. How long does it take to transfer 2.16 × 10⁷ J?', o:['720 s','7.2 × 10³ s','7.2 × 10⁴ s','2.16 × 10¹⁰ s'], c:1, e:'t = E ÷ P = 2.16 × 10⁷ ÷ 3000 = 7200 s = 7.2 × 10³ s. Convert P: 3.0 kW = 3000 W.', t:'H', s:AQA_P1H_MOCK23},
  {q:'Adding insulation to an iron block in a SHC experiment increases the accuracy of the result. Which of the following best explains why?', o:['The power output of the heater increases','Less energy is lost to the surroundings so the measured energy is closer to the energy actually absorbed by the iron','The temperature uncertainty increases','The iron heats up more slowly'], c:1, e:'Insulation reduces energy lost to the surroundings. More of the measured energy input goes into heating the iron block, so the calculated SHC is closer to the true value.', s:AQA_P1H_MOCK23},
  {q:'A spring has extension 8.0 cm and elastic potential energy 4.0 J. What is its spring constant?', o:['50 N/m','500 N/m','1250 N/m','2000 N/m'], c:2, e:'k = 2EPE ÷ e² = (2 × 4.0) ÷ (0.08²) = 8.0 ÷ 0.0064 = 1250 N/m. Remember to convert cm to m first.', t:'H', s:AQA_P1H_MOCK23},
]},

'electricity': { name: 'Electricity', fc: [
  {q:'What is the difference between current, potential difference, and resistance?', a:'Current (A): rate of flow of charge. Potential difference/voltage (V): energy transferred per unit charge. Resistance (Ω): opposition to current flow.'},
  {q:'State Ohm\'s Law.', a:'For an ohmic conductor at constant temperature, current is directly proportional to potential difference: V = IR.'},
  {q:'What does an ammeter measure and how is it connected?', a:'Current (in amperes, A). Connected in series with the component being measured.', t:'F'},
  {q:'What does a voltmeter measure and how is it connected?', a:'Potential difference/voltage (in volts, V). Connected in parallel across the component being measured.', t:'F'},
  {q:'How do resistors behave in series vs parallel?', a:'Series: R_total = R₁ + R₂; same current throughout; voltages add up. Parallel: 1/R_total = 1/R₁ + 1/R₂; same voltage across each branch; currents add up.', t:'H'},
  {q:'What is the equation for charge?', a:'Q = It where Q = charge (coulombs, C), I = current (A), t = time (s).'},
  {q:'What are the equations for electrical power?', a:'P = IV = I²R = V²/R where P = power (W), I = current (A), V = voltage (V), R = resistance (Ω).', t:'H'},
  {q:'What is the equation for electrical energy transferred?', a:'E = Pt = IVt where E = energy (J), P = power (W), t = time (s).', t:'H'},
  {q:'What is the difference between AC and DC?', a:'DC: flows in one direction only (e.g. batteries). AC: periodically reverses direction (e.g. UK mains = 230 V AC at 50 Hz).'},
  {q:'What is the function of a fuse and an earth wire in a plug?', a:'Fuse: melts and breaks circuit if current exceeds its rating, protecting the cable and appliance. Earth wire: provides a safe low-resistance path if a fault occurs, causing the fuse to blow and preventing electrocution.'},
  {q:'Describe the I-V characteristic of a diode.', a:'Current flows in one direction only. Negligible current below a threshold (~0.7 V). Very high resistance in reverse. Non-ohmic.', t:'H'},
  {q:'Describe the I-V characteristic of a filament lamp.', a:'Not linear — as current increases, temperature rises, resistance increases. Curve gets shallower at higher voltages. Non-ohmic.', t:'H'},
  {q:'What is a thermistor and how does its resistance change?', a:'Resistance decreases as temperature increases. Used in temperature-sensing circuits.'},
  {q:'What is an LDR and how does its resistance change?', a:'A light-dependent resistor. Resistance decreases as light intensity increases. Used in automatic lighting circuits.'},
  {q:'What happens in a series circuit if one component breaks?', a:'The circuit is broken — no current flows anywhere in the circuit. All components stop working. (This is why mains lighting uses parallel circuits.)', t:'F'},
  {q:'What is the relationship between the resistance of a wire at constant temperature and its length?', a:'Resistance is directly proportional to length — the graph is a straight line through the origin. Doubling the length doubles the resistance.', s:AQA_P1H},
  {q:'Why is a 1.5 V cell not an electrical hazard in a school investigation?', a:'The potential difference is too low to drive a dangerous current through the human body. High voltage is what creates a hazard, not current alone at low pd.', s:AQA_P1H},
  {q:'What is an electric field?', a:'A region of space where a charged object experiences a force. The direction of the field is the direction of force on a positive test charge.', s:AQA_P1H},
  {q:'How does electric field strength vary with distance from a charged dome?', a:'Electric field strength decreases as distance from the charged dome increases.', s:AQA_P1H},
  {q:'A student touches a negatively charged dome. Explain why their hair stands on end.', a:'Electrons transfer from the dome to the student\'s hair. Each hair strand gains the same negative charge. Like charges repel, so each hair repels all others, causing them to spread out and stand up.', t:'H', s:AQA_P1H},
  {q:'Power dissipated by a coin = 340 mW, current = 0.75 A. Calculate the resistance.', a:'Using P = I²R → R = P/I² = 0.340 / (0.75²) = 0.340 / 0.5625 = 0.60 Ω', t:'H', s:AQA_P1H},
  {q:'Why might a dirty coin not be recognised by a vending machine that identifies coins by resistance?', a:'Dirt on the coin\'s surface changes its resistance to a value that does not match the expected resistance for that denomination.', s:AQA_P1H},
  {q:'A pavement tile has 40 V induced across it and a power output of 4.4 W. Calculate the current in the tile.', a:'P = VI → I = P ÷ V = 4.4 ÷ 40 = 0.11 A.', t:'H', s:AQA_P1H_22},
  {q:'An LED light has a total power input of 4.0 W and an efficiency of 0.85. Calculate its useful power output.', a:'Efficiency = useful power output ÷ total power input → useful output = 0.85 × 4.0 = 3.4 W.', s:AQA_P1H_22},
  {q:'A plastic rod is rubbed with a cloth; the rod becomes negatively charged. Explain why the cloth becomes positively charged.', a:'Electrons are transferred from the cloth to the rod. Since electrons are negatively charged, the cloth loses negative charge — it now has more positive charges than negative charges, so it becomes positively charged.', s:AQA_P1H_22},
  {q:'A negatively charged rod rests on a balance. A second negatively charged rod is held stationary above it without touching. Explain why the balance reading increases.', a:'Both rods carry the same (negative) charge. Like charges repel — the upper rod exerts a downward repulsive force on the lower rod. This additional downward force increases the balance reading.', s:AQA_P1H_22},
  {q:'In a static electricity experiment, the balance has a zero error. Explain why the zero error does not affect the result.', a:'Only the change in the balance reading is being measured, not its absolute value. A zero error shifts all readings by the same constant amount, so it cancels out when finding the change.', s:AQA_P1H_22},
  {q:'A negatively charged rod is held near an earthed conductor. Explain why a spark jumps between the rod and the conductor.', a:'The large potential difference between the rod and the conductor creates a strong electric field in the air gap. This drives electrons (negative charges) through the air from the rod to the earthed conductor — this flow of charge is the spark.', s:AQA_P1H_22},
  {q:'Explain why a step-up transformer is used between the power station and the National Grid transmission cables.', a:'The step-up transformer increases the potential difference and decreases the current. Lower current in the cables means less power wasted as thermal energy (P = I²R), reducing energy waste and increasing the efficiency of transmission.', t:'H', s:AQA_P1H_22},
  {q:'Explain why a step-down transformer is used at the end of the National Grid before electricity reaches homes.', a:'The step-down transformer decreases the potential difference from the high transmission voltage (e.g. 400 000 V) to a safe level for domestic use (230 V). The high grid voltage would be extremely dangerous for appliances and users.', s:AQA_P1H_22},
  {q:'A battery supplies a town via a 230 V supply, transferring 3.24 × 10¹¹ J of energy in one day. Calculate the total charge flow. Give your answer to 3 significant figures.', a:'E = QV → Q = E ÷ V = 3.24 × 10¹¹ ÷ 230 = 1.41 × 10⁹ C (to 3 s.f.).', t:'H', s:AQA_P1H_22},
  {q:'Hair straighteners have a maximum power of 120 W. The energy needed to reach operating temperature is 3.6 kJ. Calculate the time taken.', a:'Convert: E = 3600 J. Rearrange P = E/t: t = E ÷ P = 3600 ÷ 120 = 30 s.', s:AQA_P1H_22},
  {q:'A parallel circuit has one active branch. When two more switches are closed adding two further parallel branches simultaneously, explain what happens to the power output of the supply.', a:'Adding parallel branches decreases the total circuit resistance. Lower resistance increases current (V = IR, V fixed). Greater current means greater power output from the supply (P = IV). Power output increases.', t:'H', s:AQA_P1H_22},
  {q:'What does \'direct potential difference\' mean?', a:'The potential difference always acts in the same direction — the polarity of the supply does not change or reverse. This means current flows in one direction only (unlike alternating current).', s:AQA_P1H_NOV21},
  {q:'A battery can store 162 000 000 J of energy. A charging station has a power output of 7200 W. Calculate the time taken to fully recharge the battery from zero.', a:'Rearrange P = E/t: t = E ÷ P = 162 000 000 ÷ 7200 = 22 500 s.', s:AQA_P1H_NOV21},
  {q:'A motor has a potential difference of 480 V across it and a current of 15 A. Calculate its resistance.', a:'Rearrange V = IR: R = V ÷ I = 480 ÷ 15 = 32 Ω.', t:'H', s:AQA_P1H_NOV21},
  {q:'Describe a method to investigate how current in a resistor at constant temperature varies with potential difference, recording both positive and negative values.', a:'⚠️ DIAGRAM REQUIRED — circuit (Figure 2) has resistor R, ammeter in series, voltmeter in parallel, variable resistor and power supply. Method: (1) Measure current using ammeter in series with R. (2) Measure pd across R using voltmeter in parallel. (3) Vary the resistance of the variable resistor to change pd. (4) Record a range of current and pd values. (5) Keep current low to avoid temperature rise in R. (6) Switch off between readings. (7) Reverse connections to R to obtain negative values. (8) Plot a graph of current against pd.', s:AQA_P1H_NOV21},
  {q:'In an I-V investigation, the temperature of resistor R increased during the experiment. Explain how this would have affected the results.', a:'As temperature increased, the resistance of R increased. Current and pd would no longer be directly proportional — the I-V graph would not be a straight line through the origin (it would curve as resistance rises with temperature).', s:AQA_P1H_NOV21},
  {q:'A moving coil ammeter scale is shown (Figure 3). What is the resolution of the ammeter?', a:'⚠️ DIAGRAM REQUIRED — Figure 3 shows the ammeter scale. The smallest division readable from the scale is 0.2 A. Resolution = 0.2 A.', s:AQA_P1H_NOV21},
  {q:'A digital ammeter has higher resolution than a moving coil ammeter. Give one other reason why the digital ammeter is better.', a:'Any one of: (1) Less chance of misreading (digital display is unambiguous). (2) No parallax error — the reading is the same from any viewing angle. (3) Can give a reading closer to the true value.', s:AQA_P1H_NOV21},
  {q:'The charge flow through a cable between solar cells and a battery in 24 hours was 27 000 coulombs. Calculate the mean current in the cable.', a:'Convert: t = 24 × 3600 = 86 400 s. Rearrange Q = It: I = Q ÷ t = 27 000 ÷ 86 400 = 0.3125 A.', t:'H', s:AQA_P1H_NOV21},
  {q:'A battery had a power output of 230 mW when the resistance of the variable resistor was 36 Ω. The current at this resistance (read from Figure 9) was 0.08 A. Determine the potential difference across the battery.', a:'⚠️ DIAGRAM REQUIRED — I = 0.08 A is read from graph Figure 9 at R = 36 Ω. Method 1: P = IV → V = P ÷ I = 0.230 ÷ 0.08 = 2.875 V. Method 2: V = IR = 0.08 × 36 = 2.88 V. Answer: ~2.9 V (allow 2.875 to 2.88 V).', t:'H', s:AQA_P1H_NOV21},
  {q:'A student concluded that current was inversely proportional to resistance. Explain how a graph of current against resistance (Figure 9) supports this.', a:'⚠️ DIAGRAM REQUIRED — from Figure 9: calculate the product current × resistance for three or more pairs of values. If the product is constant for all pairs, this confirms inverse proportionality (I ∝ 1/R). The constant product equals the EMF of the battery.', t:'H', s:AQA_P1H_NOV21},
  {q:'Figure 10 shows a switch connected in parallel with the variable resistor in a circuit. Explain how closing the switch would affect the current in the variable resistor.', a:'⚠️ DIAGRAM REQUIRED — closing the switch creates a parallel path of (effectively) zero resistance across the variable resistor. The pd across the variable resistor drops to (effectively) zero. Current in the variable resistor drops to (almost) zero — essentially all current flows through the switch instead (short circuit).', s:AQA_P1H_NOV21},
  {q:'Explain the advantage of transmitting electricity at a very high potential difference in the National Grid.', a:'High pd → very low current for the same power (P = IV). Low current → less energy wasted as thermal energy in the cables (P = I²R). This increases the efficiency of electricity transmission.', t:'H', s:AQA_P1H_NOV21},
  {q:'Explain why a person flying a kite very close to (but not touching) an overhead power cable could receive a fatal electric shock.', a:'The very high pd between the cable and earth creates an extremely strong electric field in the air. This is strong enough to ionise the air (the air becomes a conductor). The ionised air (or kite string) then conducts charge from the cable to the person and to earth, delivering a fatal electric shock.', s:AQA_P1H_NOV21},
  {q:'A graph (Figure 15) shows pd against distance for air to conduct charge (dry air). When humidity increases, air becomes a better conductor. Describe how the graph line would change.', a:'⚠️ DIAGRAM REQUIRED — Figure 15 shows a straight line through the origin. With higher humidity, air is a better conductor so a lower pd is needed to cause conduction at any distance. The new line should be a straight line through the origin, drawn below the original line for all distances.', t:'H', s:AQA_P1H_NOV21},
  {q:'In an overhead power cable, aluminium and steel wires are connected in parallel (same pd across all wires). A 1 m aluminium wire has lower resistance than a 1 m steel wire. Explain why the current in the steel wire is different to the current in a single aluminium wire.', a:'The pd across both wires is the same (parallel connection). The steel wire has greater resistance than the aluminium wire. Since V = IR and V is fixed, higher resistance → lower current. The current in the steel wire is therefore less than the current in a single aluminium wire.', s:AQA_P1H_NOV21},
  {q:'Figure 2 shows part of the National Grid. Part A is the long-distance transmission cables; part B reduces the potential difference before electricity reaches consumers. Name parts A and B.', a:'⚠️ DIAGRAM REQUIRED — Figure 2 shows the National Grid from power station to consumers. A: transmission cables / power cables (also accept power lines). B: step-down transformer.', s:AQA_P1F_NOV21},
  {q:'A power station generates electricity at a potential difference of 25 000 V. The energy transferred in one second is 500 000 000 J. Calculate the charge flow from the power station in one second.', a:'Rearrange E = QV: Q = E ÷ V = 500 000 000 ÷ 25 000 = 20 000 C.', s:AQA_P1F_NOV21},
  {q:'A 230 V supply powers: dishwasher (6.50 A), DVD player (0.10 A), lamp (0.40 A) and TV (0.20 A). Calculate the total power of all four appliances.', a:'Total current = 6.50 + 0.10 + 0.40 + 0.20 = 7.20 A. Total power = potential difference × current = 230 × 7.20 = 1656 W.', s:AQA_P1F_NOV21},
  {q:'Four appliances each switched on for 2 hours at 230 V: dishwasher (6.50 A), DVD player (0.10 A), lamp (0.40 A), TV (0.20 A). Which transfers the most energy and why?', a:'The dishwasher transfers the most energy. It has the largest current and therefore the largest power (P = V × I). Over the same 2 hours, the appliance with the largest power transfers the most energy (E = Pt).', s:AQA_P1F_NOV21},
  {q:'The average energy transferred from the National Grid every second for each person in the UK is 600 J. There are 32 000 000 seconds in one year. Calculate the average energy transferred from the National Grid per person per year.', a:'E = power × time = 600 × 32 000 000 = 19 200 000 000 J = 1.92 × 10¹⁰ J.', s:AQA_P1F_NOV21},
  {q:'The mean current from solar cells to a battery is 3.5 A. Calculate the charge flow in 3600 seconds.', a:'Q = It = 3.5 × 3600 = 12 600 C.', s:AQA_P1F_NOV21},
  {q:'In a parallel circuit, as more identical lamps are added: what happens to (a) the current from the battery, (b) the total resistance, and (c) the pd across the battery?', a:'(a) Current increases — more parallel branches create more paths for current. (b) Total resistance decreases — adding parallel branches reduces overall resistance. (c) Potential difference across the battery stays the same — the battery supplies a fixed pd regardless of how many parallel branches are connected.', s:AQA_P1F_NOV21},
  {q:'An LED torch has a current of 50 mA. It works for 14 400 s. What is the total charge flow?', o:['50 C','288 C','720 C','7200 C'], c:2, e:'Q = It = 0.050 × 14 400 = 720 C. Convert 50 mA = 0.050 A first.', t:'H', s:AQA_P1H_NOV20},
  {q:'Three identical resistors, each 45 Ω, are connected in parallel. What is the total resistance?', o:['135 Ω','45 Ω','15 Ω','3 Ω'], c:2, e:'1/R_total = 1/45 + 1/45 + 1/45 = 3/45. R_total = 45/3 = 15 Ω. Adding parallel branches always reduces total resistance below the resistance of any individual branch.', t:'H', s:AQA_P1H_NOV20},
  {q:'A person with resistance 9200 Ω accidentally contacts a 230 V supply. What current flows through them?', o:['0.025 mA','0.25 A','0.025 A','40 A'], c:2, e:'I = V/R = 230 ÷ 9200 = 0.025 A = 25 mA. Even this small current is potentially life-threatening, especially at 50 Hz mains frequency.', t:'H', s:AQA_P1H_NOV20},
  {q:'A parallel circuit (Figure 6) has five ammeters and three identical lamps. A1 reads 0.36 A; each lamp carries 0.12 A. A2 is in series with one lamp; A5 measures total current from the battery. What are the readings on A2 and A5?', a:'⚠️ DIAGRAM REQUIRED — Figure 6 shows three lamps in parallel with five ammeters. A2 is in series with a single lamp: A2 = 0.12 A. A5 measures the total current through all three lamps: A5 = 3 × 0.12 = 0.36 A.', s:AQA_P1F_NOV21},
  {q:'One lamp in a parallel circuit has a resistance of 15 Ω and a current of 0.12 A. Calculate the power output of the lamp.', a:'P = I²R = 0.12² × 15 = 0.0144 × 15 = 0.216 W.', s:AQA_P1F_NOV21},
  {q:'Describe how to set up a circuit to investigate how current in a filament lamp varies with potential difference, and how to obtain both positive and negative values.', a:'⚠️ DIAGRAM REQUIRED — Figure 1 shows a partial circuit. Complete the circuit by: (1) connecting an ammeter in series with the filament lamp (to measure current); (2) connecting a voltmeter in parallel across the filament lamp (to measure pd). Use a variable resistor to change the pd. Record pairs of I and V values. To obtain negative values, reverse the connections to the power supply and repeat the measurements.', s:AQA_P1H_NOV20},
  {q:'A filament lamp I-V graph shows data for positive pd values. Describe how the negative-value section of the graph should appear.', a:'⚠️ DIAGRAM REQUIRED — Figure 2 shows positive I-V values for a filament lamp. The negative section is point-symmetric about the origin — the same non-linear curve reflected through the origin (rotated 180°). As the magnitude of negative pd increases, the magnitude of current increases non-linearly (resistance increases with temperature in both directions).', s:AQA_P1H_NOV20},
  {q:'Write down the equation which links current (I), potential difference (V) and resistance (R).', a:'V = IR where V = potential difference (volts, V), I = current (amperes, A), R = resistance (ohms, Ω). Rearranged: I = V/R and R = V/I.', s:AQA_P1H_NOV20},
  {q:'A filament lamp I-V graph (Figure 2) is used to determine resistance at pd = 1.0 V. Describe the method and show the working.', a:'⚠️ DIAGRAM REQUIRED — Figure 2 shows the I-V graph for a filament lamp. Method: read off the current at V = 1.0 V from the graph. Rearrange V = IR: R = V ÷ I = 1.0 ÷ (current read from graph). Show all working. The resistance is higher than at low pd because the filament heats up and resistance increases with temperature.', t:'H', s:AQA_P1H_NOV20},
  {q:'What is meant by a zero error in a measuring instrument?', a:'A zero error occurs when an instrument gives a non-zero reading when the quantity being measured is actually zero. It means all readings are consistently shifted by a fixed amount — this is a type of systematic error. Example: an ammeter reads 0.05 A when no current flows.', s:AQA_P1H_NOV20},
  {q:'An LED torch contains one LED, one switch and three cells. Describe the correct circuit for this torch.', a:'⚠️ DIAGRAM REQUIRED — Figure shows four circuit diagram options. The correct circuit has all components in series: three cells in series (all oriented the same way to produce maximum pd), one switch in series (to turn torch on/off), and one LED in series correctly oriented (current can only flow through an LED in one direction).', s:AQA_P1H_NOV20},
  {q:'A torch LED has a current of 50 mA. The torch worked for 14 400 seconds before the cells needed replacing. Calculate the total charge flow through the cells.', a:'Convert: I = 50 mA = 0.050 A. Q = It = 0.050 × 14 400 = 720 C.', t:'H', s:AQA_P1H_NOV20},
  {q:'The cells in an LED torch were inserted the wrong way around. Explain why the torch did not work.', a:'An LED only allows current to flow in one direction — it has very high resistance in the reverse direction. With the cells reversed, the conventional current would flow in the reverse direction through the LED. The LED blocks this reverse current, so no current flows in the circuit and the torch does not light.', s:AQA_P1H_NOV20},
  {q:'Write down the equation which links efficiency, total power input and useful power output.', a:'Efficiency = useful power output ÷ total power input. This gives a decimal value between 0 and 1. Multiply by 100 for a percentage.', s:AQA_P1H_NOV20},
  {q:'The total power input to an LED was 0.24 W and its efficiency was 0.75. Calculate the useful power output.', a:'Rearrange efficiency = useful power output ÷ total power input: useful power output = efficiency × total power input = 0.75 × 0.24 = 0.18 W.', s:AQA_P1H_NOV20},
  {q:'Three resistance readings for 3 parallel resistors were: 15.8 Ω, 15.3 Ω, and X Ω. The mean was 15.7 Ω. Calculate X.', a:'Total of all readings = mean × count = 15.7 × 3 = 47.1 Ω. X = 47.1 − 15.8 − 15.3 = 16.0 Ω.', s:AQA_P1H_NOV20},
  {q:'A student took three resistance readings (15.8, 15.3, 15.7 Ω) and thought a fourth reading of 16.2 Ω would improve precision. Explain why the student was wrong.', a:'Precision depends on how closely repeated readings agree with each other. The fourth reading (16.2 Ω) is anomalous — it is much further from the other three values than expected. Including it increases the spread of results, decreasing precision rather than improving it. The anomalous value should be identified and excluded before calculating the mean.', s:AQA_P1H_NOV20},
  {q:'Figure 12 shows results from a parallel resistor investigation. The student concluded that number of resistors was inversely proportional to total resistance. Explain why the student was correct, using data from Figure 12.', a:'⚠️ DIAGRAM REQUIRED — Figure 12 shows a graph of mean total resistance vs number of resistors. To verify inverse proportionality, read off several (n, R) pairs from Figure 12 and calculate the product n × R for each. If n × R gives the same constant value for all pairs, then R ∝ 1/n — confirming inverse proportionality. State the pairs used and their products.', t:'H', s:AQA_P1H_NOV20},
  {q:'Explain why connecting resistors in parallel decreases the total resistance.', a:'Adding more resistors in parallel provides additional conducting paths for current. The total current through the circuit increases because more parallel branches carry current simultaneously. Since the supply voltage is fixed, a larger total current means a lower total resistance (R = V/I — V constant, I larger → R smaller). Each extra parallel branch reduces the overall opposition to current flow.', s:AQA_P1H_NOV20},
  {q:'A fault in a mains switch caused a person to receive a mild electric shock. The mean power transfer to the person was 5.75 W and the potential difference across them was 230 V. Calculate the resistance of the person.', a:'Method 1 (two steps): I = P ÷ V = 5.75 ÷ 230 = 0.025 A. Then R = V ÷ I = 230 ÷ 0.025 = 9200 Ω. Method 2 (direct): R = V² ÷ P = 230² ÷ 5.75 = 52 900 ÷ 5.75 = 9200 Ω.', t:'H', s:AQA_P1H_NOV20},
  {q:'An electrician needed to replace a faulty mains light switch. Explain why the circuit had to be disconnected from the mains supply before the work began.', a:'The mains supply keeps the live wire at 230 V. Even with the switch open, the live wire between the consumer unit and the switch remains at 230 V. If the electrician touched the live wire while also in contact with earth (through the floor, pipes, or other earthed conductors), a potential difference of 230 V would drive a current through their body to earth — causing a potentially fatal electric shock.', s:AQA_P1H_NOV20},
  {q:'Figure 14 shows the maximum current at which a person can voluntarily let go of a live conductor, as a function of frequency. The UK mains supply is 50 Hz. Explain why it would be safer if the UK mains frequency was not 50 Hz.', a:'⚠️ DIAGRAM REQUIRED — Figure 14 shows that the maximum "let-go current" is at or near its minimum value at 50 Hz (approximately 9 mA). At other frequencies (both lower and higher), the let-go current is larger. This means at 50 Hz, even a very small current prevents a person from releasing a live conductor, making electric shocks at mains frequency especially dangerous. At a different frequency, a higher current would be needed before a person lost voluntary muscle control.', t:'H', s:AQA_P1H_NOV20},
], mc: [
  {q:'Two resistors of 4 Ω and 6 Ω are connected in series. Total resistance?', o:['2.4 Ω','5 Ω','10 Ω','24 Ω'], c:2, e:'Series: R_total = R₁ + R₂ = 4 + 6 = 10 Ω.'},
  {q:'A 9 V battery drives a current of 3 A. What is the resistance?', o:['3 Ω','27 Ω','0.33 Ω','6 Ω'], c:0, e:'R = V/I = 9/3 = 3 Ω.'},
  {q:'A 60 W lamp is on for 2 hours. How much energy does it use?', o:['120 J','7200 J','432 000 J','3600 J'], c:2, e:'E = Pt = 60 × (2 × 3600) = 60 × 7200 = 432 000 J.', t:'H'},
  {q:'The UK mains supply is:', o:['110 V DC at 60 Hz','230 V AC at 50 Hz','230 V DC at 50 Hz','110 V AC at 50 Hz'], c:1, e:'UK mains: 230 V AC at 50 Hz. The direction of current reverses 50 times per second.'},
  {q:'In a parallel circuit, what is the same across all branches?', o:['Current','Resistance','Potential difference','Power'], c:2, e:'Potential difference across each parallel branch equals the supply voltage. Current splits between branches.'},
  {q:'Which component has resistance that decreases as temperature increases?', o:['Fixed resistor','Diode','Thermistor','Filament lamp'], c:2, e:'A thermistor\'s resistance falls with rising temperature — opposite to a metallic conductor, whose resistance increases with temperature.'},
  {q:'What is the unit of electrical resistance?', o:['Ampere (A)','Volt (V)','Ohm (Ω)','Watt (W)'], c:2, e:'Resistance is measured in ohms (Ω). Current in amperes, potential difference in volts, power in watts.', t:'F'},
  {q:'What colour is the insulation on the live wire in a UK three-core mains cable?', o:['Blue','Green and yellow','Brown','Red'], c:2, e:'Brown = live. Blue = neutral. Green/yellow = earth. These are the standard UK/EU cable colours.', s:AQA_P1H},
  {q:'A fuse wire melts when 2.0 C of charge flows in 400 ms. What is the current?', o:['0.80 A','4.0 A','5.0 A','800 A'], c:2, e:'I = Q/t = 2.0 / 0.400 = 5.0 A. (400 ms = 0.400 s)', t:'H', s:AQA_P1H},
  {q:'A spark transfers 0.60 J of energy and 2.0 μC of charge. What is the potential difference? (V = E/Q)', o:['1.2 × 10⁻⁶ V','300 V','3 × 10⁵ V','1.2 V'], c:2, e:'V = E/Q = 0.60 / (2.0 × 10⁻⁶) = 300 000 V = 3 × 10⁵ V. Note: 2.0 μC = 2.0 × 10⁻⁶ C.', t:'H', s:AQA_P1H},
  {q:'Which equation correctly links power (P), potential difference (V) and current (I)?', o:['P = V ÷ I','P = I ÷ V','P = V × I','P = V + I'], c:2, e:'P = VI. Power equals potential difference multiplied by current. Equivalent forms: P = I²R or P = V²/R.', s:AQA_P1H_22},
  {q:'Which equation correctly gives efficiency in terms of power?', o:['Efficiency = total power input ÷ useful power output','Efficiency = useful power output ÷ total power input','Efficiency = useful power output × total power input','Efficiency = total power input − useful power output'], c:1, e:'Efficiency = useful power output ÷ total power input. Value is between 0 and 1 (multiply by 100 for a percentage). Always ≤ 1.', s:AQA_P1H_22},
  {q:'Which equation correctly links energy transferred (E), power (P) and time (t)?', o:['E = power ÷ time','E = time ÷ power','E = power × time','E = power² × time'], c:2, e:'E = Pt (energy = power × time). This follows from P = E/t. Units: joules = watts × seconds.', s:AQA_P1H_NOV21},
  {q:'Which equation correctly links current (I), potential difference (V) and resistance (R)?', o:['I = V × R','I = V² × R','R = I × V','V = I × R'], c:3, e:"V = IR (Ohm\'s Law). Rearranged: I = V/R and R = V/I. Applies to ohmic conductors at constant temperature.", s:AQA_P1H_NOV21},
  {q:'Charging system A (13 A) and system B (26 A) both use 230 V. How does the time to recharge a battery using system A compare with system B?', o:['Time using A is half the time of B','Time using A is the same as B','Time using A is double the time of B'], c:2, e:'Power A = 230 × 13 = 2990 W; Power B = 230 × 26 = 5980 W. B delivers twice the power, charging twice as fast. A takes double the time of B.', s:AQA_P1H_NOV21},
  {q:'An ammeter reading fluctuates between 0.35 A and 0.36 A. What type of error does this lead to?', o:['Random error','Systematic error','Zero error'], c:0, e:'Random errors cause readings to vary unpredictably above and below the true value. Systematic errors shift all readings consistently in one direction. Zero error is a fixed offset when nothing is connected. Fluctuating readings are characteristic of random error.', s:AQA_P1F_NOV21},
  {q:'What is the advantage of transmitting electricity at a very high potential difference in the National Grid?', o:['A high potential difference is safer for consumers','Less thermal energy is transferred to the surroundings','Power transmission is faster'], c:1, e:'High pd → low current for the same power (P = IV). Lower current → less energy wasted as thermal energy in cables (P = I²R), increasing transmission efficiency. High pd is actually dangerous (not safer) for consumers.', s:AQA_P1F_NOV21},
  {q:'Figure 1 shows a National Grid diagram. Transformer X is a step-up transformer. Complete: Transformer X causes the potential difference to ___ and causes the current to ___.', a:'⚠️ DIAGRAM REQUIRED — Figure 1 shows the National Grid connecting a power station to consumers. Transformer X causes the potential difference to INCREASE (step up). Transformer X causes the current to DECREASE. This is so that less energy is wasted as thermal energy in the transmission cables (P = I²R).', s:AQA_P1H_MOCK23},
  {q:'A transmission cable has a power loss of 1.60 × 10⁹ W and carries a current of 2000 A. Calculate the resistance of the cable.', a:'Rearrange P = I²R: R = P ÷ I² = 1.60 × 10⁹ ÷ (2000²) = 1.60 × 10⁹ ÷ 4 × 10⁶ = 400 Ω.', t:'H', s:AQA_P1H_MOCK23},
  {q:'Write down the equation which links efficiency, total energy input and useful energy output.', a:'Efficiency = useful energy output ÷ total energy input. (Multiply by 100 for a percentage.) Rearranged: useful energy output = efficiency × total energy input.', s:AQA_P1H_MOCK23},
  {q:'A power station supplies 34.2 GJ total energy input to the National Grid. The National Grid has an efficiency of 0.992. Calculate the useful energy output in GJ.', a:'Useful energy output = efficiency × total energy input = 0.992 × 34.2 = 33.9 GJ (to 3 s.f.).', t:'H', s:AQA_P1H_MOCK23},
  {q:'What is meant by \'direct potential difference\'?', a:'A direct potential difference always acts in the same direction — the polarity of the supply does not reverse. This means current flows in one direction only (direct current, DC). Examples: batteries, cells. Contrast with AC where the potential difference alternates direction.', s:AQA_P1H_MOCK23},
  {q:'Calculate the charge flow through a 12 V battery when it transfers 5010 J of energy.', a:'Rearrange E = QV: Q = E ÷ V = 5010 ÷ 12 = 417.5 C.', t:'H', s:AQA_P1H_MOCK23},
  {q:'Describe a method to investigate the I-V characteristic of a filament lamp, including a circuit diagram.', a:'⚠️ DIAGRAM REQUIRED — Figure 6 shows the I-V results. Circuit: connect the filament lamp in series with an ammeter and a variable resistor; connect a voltmeter in parallel across the lamp; connect to a power supply. Method: (1) Vary the variable resistor to change the pd across the lamp. (2) For each setting, record the current (ammeter) and pd (voltmeter). (3) Reverse the power supply connections to obtain negative values of pd and current. (4) Plot a graph of current (y-axis) against pd (x-axis). (5) Repeat readings to identify anomalies.', t:'H', s:AQA_P1H_MOCK23},
  {q:'A filament lamp I-V graph (Figure 6) shows data for both positive and negative pd. Determine the resistance of the lamp at a pd of +3.0 V.', a:'⚠️ DIAGRAM REQUIRED — Figure 6 shows the I-V characteristic. Method: read the current from the graph at pd = +3.0 V. Rearrange V = IR: R = V ÷ I = 3.0 ÷ (current from graph). Show working. The resistance is greater than at low pd because the filament temperature is higher at +3.0 V, and resistance increases with temperature for a metal.', t:'H', s:AQA_P1H_MOCK23},
  {q:'The current in a filament lamp is 0.21 A when the pd across it is 6.0 V. Calculate the energy transferred by the lamp in 30 minutes.', a:'Convert time: t = 30 × 60 = 1800 s. Power: P = IV = 0.21 × 6.0 = 1.26 W. Energy: E = Pt = 1.26 × 1800 = 2268 J.', t:'H', s:AQA_P1H_MOCK23},
  {q:'A filament lamp has power output 1.0 W at 5.0 V. A student predicts the power would be 4.0 W if the pd was doubled to 10.0 V. Explain why the student is NOT correct.', a:'Doubling the pd would quadruple the power only if resistance were constant (P = V²/R). However, the filament lamp is non-ohmic — as pd increases, the filament gets hotter and its resistance increases. At 10.0 V the resistance is greater than at 5.0 V, so the current is less than double. Therefore power (P = IV) is less than 4.0 W.', t:'H', s:AQA_P1H_MOCK23},
  {q:'A transmission cable carries a current of 2000 A and has a power loss of 1.60 × 10⁹ W. What is the resistance of the cable?', o:['4 × 10⁻⁴ Ω','400 Ω','800 Ω','3.2 × 10¹² Ω'], c:1, e:'R = P ÷ I² = 1.60 × 10⁹ ÷ (2000²) = 1.60 × 10⁹ ÷ 4 × 10⁶ = 400 Ω.', t:'H', s:AQA_P1H_MOCK23},
  {q:'Which equation links charge flow (Q), energy (E) and potential difference (V)?', o:['E = Q ÷ V','E = QV','Q = E ÷ V² ','E = V ÷ Q'], c:1, e:'E = QV (energy = charge × potential difference). Rearranged: Q = E ÷ V and V = E ÷ Q. Units: joules = coulombs × volts.', s:AQA_P1H_MOCK23},
  {q:'A filament lamp is non-ohmic. When its pd is doubled, which of the following correctly describes what happens to its resistance?', o:['Resistance stays the same','Resistance decreases','Resistance increases','Resistance halves'], c:2, e:'As pd increases, more current flows and the filament gets hotter. A metal\'s resistance increases with temperature (more lattice ion vibrations impede electron flow). So doubling pd causes resistance to increase — making the lamp non-ohmic.', t:'H', s:AQA_P1H_MOCK23},
]},

'particle-model': { name: 'Particle Model of Matter', fc: [
  {q:'Describe particles in a solid.', a:'Closely packed in a regular lattice. Vibrate about fixed positions. Cannot move past each other. Very strong forces of attraction.'},
  {q:'Describe particles in a liquid.', a:'Close together but in a random arrangement. Can flow past each other. Weaker forces than in a solid.'},
  {q:'Describe particles in a gas.', a:'Far apart. Move rapidly and randomly in all directions. Negligible forces between particles. Fill the available container.'},
  {q:'Which state of matter can be compressed, and why?', a:'Only gases can be compressed significantly — because gas particles are far apart with large spaces between them.', t:'F'},
  {q:'A syringe plunger is pushed in at constant temperature. Explain why pressure increases.', a:'Smaller volume → same number of particles in less space → particles collide with the walls more frequently per unit area → greater force per unit area → higher pressure.', s:AQA_P1H},
  {q:'A balance reads 0.02 g after a ring is removed. How should the student find the correct mass of the ring?', a:'Subtract the zero error (0.02 g) from the balance reading with the ring on. Correct mass = (reading with ring) − 0.02 g.', s:AQA_P1H},
  {q:'Energy transferred to air = 0.0130 J, mass of air = 2.60 × 10⁻⁸ kg, SHC = 1010 J/kg°C. Calculate the temperature change.', a:'Δθ = Q/(mc) = 0.0130 / (2.60 × 10⁻⁸ × 1010) = 0.0130 / 2.626 × 10⁻⁵ ≈ 495°C', t:'H', s:AQA_P1H},
  {q:'A metal ring has density 21 500 kg/m³ and volume 0.44 cm³. Calculate its mass in kg.', a:'Convert: 0.44 cm³ = 0.44 × 10⁻⁶ m³. m = ρV = 21 500 × 0.44 × 10⁻⁶ = 9.46 × 10⁻³ kg ≈ 9.5 × 10⁻³ kg', t:'H', s:AQA_P1H},
  {q:'What is density and its equation?', a:'Density = mass per unit volume. ρ = m/V where ρ = density (kg/m³), m = mass (kg), V = volume (m³).'},
  {q:'What happens to internal energy when a substance is heated (no state change)?', a:'Internal energy increases. Particles gain kinetic energy, vibrating/moving faster, so temperature rises.'},
  {q:'What is latent heat?', a:'Energy absorbed or released during a change of state at constant temperature. No temperature change occurs while the substance changes state.'},
  {q:'What is specific latent heat and its equation?', a:'Energy required to change the state of 1 kg of a substance without a temperature change. Q = mL where L = specific latent heat (J/kg).', t:'H'},
  {q:'What is the difference between specific latent heat of fusion and vaporisation?', a:'Fusion (L_f): solid → liquid (melting). Vaporisation (L_v): liquid → gas (boiling). L_v > L_f because more intermolecular bonds are broken during vaporisation.', t:'H'},
  {q:'What is the relationship between temperature and pressure of a gas at constant volume?', a:'Pressure is directly proportional to absolute temperature (K): P/T = constant. Higher T → faster particles → more frequent and energetic collisions → higher pressure.', t:'H'},
  {q:'How do you convert between Celsius and kelvin?', a:'K = °C + 273. Absolute zero (0 K = −273°C) is the theoretical minimum — particles have minimum internal energy.', t:'H'},
  {q:'Describe a method to determine the density of an irregularly shaped rock.', a:'(1) Measure mass using a balance. (2) Part-fill a measuring cylinder with water; record volume V₁. (3) Submerge the rock fully; record new volume V₂. (4) Volume of rock = V₂ − V₁. (5) Density = mass ÷ volume. (Alternative: use a displacement/eureka can, collect displaced water, measure its volume.)'},
  {q:'A rock has a determined density of 2.55 ± 0.10 g/cm³. What are the maximum and minimum possible values for its density?', a:'Maximum = 2.55 + 0.10 = 2.65 g/cm³. Minimum = 2.55 − 0.10 = 2.45 g/cm³.', s:AQA_P1H_22},
  {q:'Why does repeating a measurement and calculating a mean improve the accuracy of a result?', a:'A mean can be calculated from repeated readings, which reduces the effect of random errors. Anomalous (outlier) values can also be identified and removed before calculating the mean.', s:AQA_P1H_22},
  {q:'SHC of water = 4200 J/kg°C. Water cools from 85.0°C to 65.0°C; energy transferred = 10.5 kJ. Calculate the mass of water.', a:'Convert: E = 10 500 J, ΔT = 20°C. Rearrange Q = mcΔθ: m = Q ÷ (cΔθ) = 10 500 ÷ (4200 × 20) = 0.125 kg.', t:'H', s:AQA_P1H_22},
  {q:'A student boils water to find specific latent heat of vaporisation: initial mass of beaker + water = 0.080 kg, final mass = 0.071 kg, energy supplied = 25 200 J. Calculate L.', a:'Mass vaporised = 0.080 − 0.071 = 0.009 kg. L = E ÷ m = 25 200 ÷ 0.009 = 2 800 000 J/kg = 2.8 × 10⁶ J/kg.', t:'H', s:AQA_P1H_22},
  {q:'In a latent heat experiment, thermal energy was also lost to the surroundings while the water boiled. How did this affect the calculated value of L?', a:'Less than 25 200 J was actually used to vaporise the water — some energy escaped to the surroundings. The student assumed all input energy went to vaporisation, so the calculated value of L is too high.', t:'H', s:AQA_P1H_22},
  {q:'In a latent heat experiment, some water evaporated before reaching 100°C. How did this affect the calculated value of L?', a:'Evaporation below 100°C increases the measured mass loss (more mass lost than just from boiling). The denominator in L = E/m is too large, so the calculated value of L is too low.', t:'H', s:AQA_P1H_22},
  {q:'A student determined the density of different fruits using a displacement can to find volume. What other piece of equipment is needed?', a:'A balance (or scales) — to measure the mass of each fruit. Density = mass ÷ volume; volume is found by displacement, so mass is the only other measurement needed.', s:AQA_P1H_NOV21},
  {q:'Write down the equation which links density (ρ), mass (m) and volume (V).', a:'ρ = m/V. Density (kg/m³ or g/cm³) = mass (kg or g) ÷ volume (m³ or cm³).', s:AQA_P1H_NOV21},
  {q:'An apple has a mass of 85 g and a density of 0.68 g/cm³. Calculate its volume.', a:'Rearrange ρ = m/V → V = m ÷ ρ = 85 ÷ 0.68 = 125 cm³.', s:AQA_P1H_NOV21},
  {q:'A student measured the volume of each fruit only once. Explain why these single measurements cannot show that the method gives precise readings.', a:'To assess precision, repeat readings are needed so that you can check whether they are close together. A single measurement cannot be compared to other measurements, so it is impossible to determine precision from one reading alone.', s:AQA_P1H_NOV21},
  {q:'In a gas pressure investigation, weights from 0.0 N to 12.0 N were attached to a syringe in 2.0 N steps. What was the range of force used?', a:'From 0 N to 12 N. The first reading is taken with no weight (0 N) and the final reading with 12.0 N attached.', s:AQA_P1H_NOV21},
  {q:'In a gas pressure investigation using a syringe and pressure gauge, give one control variable.', a:'Temperature of the gas in the syringe (must be kept constant), OR mass/amount of gas in the syringe (must not change). Both ensure only one variable changes at a time.', s:AQA_P1H_NOV21},
  {q:'When the volume of gas in a syringe was 45 cm³, the pressure was 60 kPa. Temperature is constant. Calculate the pressure when the volume is 40 cm³.', a:"Use Boyle\'s Law: P₁V₁ = P₂V₂. P₂ = (60 × 45) ÷ 40 = 2700 ÷ 40 = 67.5 kPa.", t:'H', s:AQA_P1H_NOV21},
  {q:'When the volume of gas in a syringe increases at constant temperature, the pressure decreases. Explain why in terms of particles.', a:'When volume increases, the same number of particles occupy a larger space. Particles travel further between collisions with the walls, so there are fewer collisions per second per unit area of wall. Lower frequency of collisions → lower average force per unit area → lower pressure.', s:AQA_P1H_NOV21},
  {q:'A temperature-time graph (Figure 17) shows ice being heated until the water produced boils. The specific heat capacity of ice is less than that of water. Explain how Figure 17 shows this.', a:'⚠️ DIAGRAM REQUIRED — Figure 17 is a temperature-time graph of heating ice then liquid water. The gradient of the ice section is steeper than the gradient for liquid water (temperature rises faster for ice). Since power is constant, a steeper gradient means temperature rises faster → less energy needed per °C per kg → SHC of ice < SHC of water.', s:AQA_P1H_NOV21},
  {q:'A temperature-time graph (Figure 17) shows ice being heated until the water produced boils. The specific latent heat of fusion of ice is less than that of vaporisation of water. Explain how Figure 17 shows this.', a:'⚠️ DIAGRAM REQUIRED — Figure 17 shows two horizontal sections (temperature constant during state changes). The horizontal section for boiling (liquid → gas) is longer than for melting (solid → liquid). Since power is constant, a longer horizontal section means more energy is transferred → greater specific latent heat. Therefore SLH of vaporisation > SLH of fusion.', s:AQA_P1H_NOV21},
  {q:'In a heating experiment a second student transferred more thermal energy to the surroundings. Describe two ways the temperature-time graph results would have been different.', a:'Any two of: (1) Temperature would take longer to increase (shallower gradient on rising sections). (2) Each state change would take more time (longer horizontal sections). (3) The temperature rise over time would not be linear (curved rather than straight sections).', s:AQA_P1H_NOV21},
  {q:'When 0.030 kg of boiling water turned to steam, 69 kJ of energy was transferred. Calculate the specific latent heat of vaporisation of water. Give the unit.', a:'Convert: E = 69 000 J. Rearrange Q = mL: L = E ÷ m = 69 000 ÷ 0.030 = 2 300 000 J/kg. Unit: J/kg.', t:'H', s:AQA_P1H_NOV21},
  {q:'Describe the arrangement of particles in each of the three states of matter.', a:'⚠️ DIAGRAM REQUIRED — Question 1.1 shows particle arrangement diagrams. Solid: particles closely packed in a regular lattice, vibrating about fixed positions, strong forces of attraction between particles. Liquid: particles close together but in a random arrangement, able to flow past each other, weaker forces than in a solid. Gas: particles far apart, moving rapidly and randomly in all directions, negligible forces between particles.', s:AQA_P1F_NOV21},
  {q:'Calculate the thermal energy needed to melt 0.250 kg of ice at 0°C. Specific latent heat of fusion of water = 334 000 J/kg.', a:'Use E = mL: E = 0.250 × 334 000 = 83 500 J.', s:AQA_P1F_NOV21},
  {q:'Describe a method to measure the volume of an irregularly shaped fruit using displacement.', a:'Method A (Eureka/displacement can): Fill the can with water to the spout level. Place the fruit in the can. Collect the displaced water that overflows. Measure its volume with a measuring cylinder — this equals the volume of the fruit. Method B (measuring cylinder): Part-fill a measuring cylinder with water; record initial volume V₁. Submerge the fruit fully; record new volume V₂. Volume of fruit = V₂ − V₁.', s:AQA_P1F_NOV21},
  {q:'Three measurements of a grape\'s volume are: 2.1 cm³, 2.1 cm³, and 2.4 cm³. Calculate the mean value.', a:'Mean = (2.1 + 2.1 + 2.4) ÷ 3 = 6.6 ÷ 3 = 2.2 cm³.', s:AQA_P1F_NOV21},
  {q:'An apple has a mass of 84.0 g and a volume of 120 cm³. Calculate its density in g/cm³.', a:'Density = mass ÷ volume = 84.0 ÷ 120 = 0.70 g/cm³.', s:AQA_P1F_NOV21},
  {q:'The equation pressure × volume = constant applies to a gas. Which quantity (besides the mass of gas) must stay the same?', a:'The temperature of the gas must stay the same. This is Boyle\'s Law: at constant temperature for a fixed mass of gas, P × V = constant.', s:AQA_P1F_NOV21},
  {q:'The initial volume of gas in a syringe is 12 cm³ and the pressure is 101 000 Pa. Calculate the value of the constant in: pressure × volume = constant.', a:'Constant = P × V = 101 000 × 12 = 1 212 000 Pa cm³.', s:AQA_P1F_NOV21},
  {q:'For a gas in a syringe, pressure × volume = 1 212 000 Pa cm³. The plunger is pulled out until the volume is 24 cm³. Calculate the new pressure.', a:'P × 24 = 1 212 000. New pressure P = 1 212 000 ÷ 24 = 50 500 Pa.', s:AQA_P1F_NOV21},
  {q:'A reservoir stores 6 500 000 m³ of water with a density of 998 kg/m³. Calculate the mass of water in the reservoir. Give your answer in standard form.', a:'m = ρV = 998 × 6 500 000 = 6 487 000 000 kg ≈ 6.49 × 10⁹ kg (to 3 s.f.).', t:'H', s:AQA_P1H_NOV20},
  {q:'The energy transferred to the water in a kettle in 100 s was 155 000 J. Using Figure 10 (a temperature-time graph), determine the mass of water. (Specific heat capacity of water = 4200 J/kg°C) Give your answer to 2 significant figures.', a:'⚠️ DIAGRAM REQUIRED — Figure 10 shows temperature vs time for the kettle. Read ΔT over 100 s from the straight section of the graph. Rearrange Q = mcΔT: m = Q ÷ (c × ΔT) = 155 000 ÷ (4200 × ΔT). Round to 2 s.f. Example: if ΔT = 37°C → m = 155 000 ÷ 155 400 ≈ 1.0 kg.', t:'H', s:AQA_P1H_NOV20},
  {q:'Explain how the straight section of a temperature-time graph for a kettle (Figure 10) can be used to calculate the useful power output of the kettle.', a:'⚠️ DIAGRAM REQUIRED — Figure 10 shows temperature vs time for the kettle water. Method: (1) From the straight-line section, read off a temperature change ΔT over a time interval Δt. (2) Calculate the energy transferred to the water: Q = mcΔT (use known mass and specific heat capacity of water). (3) Power = Q ÷ Δt. Alternatively, the gradient of the line (ΔT/Δt) multiplied by mc gives power directly.', s:AQA_P1H_NOV20},
  {q:'A balloon contains helium at 100 000 Pa and volume 0.030 m³. It is compressed at constant temperature to a volume of 0.025 m³. No helium escapes. Calculate the new pressure in the balloon.', a:"Use Boyle\'s Law: P₁V₁ = P₂V₂ (constant temperature, fixed mass of gas). P₂ = P₁ × V₁ ÷ V₂ = 100 000 × 0.030 ÷ 0.025 = 3000 ÷ 0.025 = 120 000 Pa.", t:'H', s:AQA_P1H_NOV20},
  {q:'The temperature of helium in a balloon is increased. The mass and volume of the helium remain constant. Explain why the pressure exerted by the helium would increase.', a:'As temperature increases, the helium particles gain kinetic energy and move faster (higher mean speed). (1) Faster particles collide with the balloon walls more frequently — more collisions per second per unit area. (2) Each collision involves greater momentum transfer, so a larger force is exerted per collision. Both effects increase the total force per unit area on the walls — increasing the pressure.', t:'H', s:AQA_P1H_NOV20},
], mc: [
  {q:'A substance has mass 500 g and volume 250 cm³. What is its density?', o:['0.5 g/cm³','2 g/cm³','125 g/cm³','750 g/cm³'], c:1, e:'ρ = m/V = 500 ÷ 250 = 2 g/cm³.'},
  {q:'During a change of state, what happens to temperature?', o:['It increases rapidly','It decreases rapidly','It remains constant','It fluctuates'], c:2, e:'Energy goes into breaking/forming bonds (latent heat) rather than increasing kinetic energy, so temperature stays constant.'},
  {q:'A gas at 300 K has pressure 100 kPa. What is its pressure at 600 K (constant volume)?', o:['50 kPa','100 kPa','200 kPa','300 kPa'], c:2, e:'P₁/T₁ = P₂/T₂ → P₂ = 100 × 600/300 = 200 kPa.', t:'H'},
  {q:'What is absolute zero?', o:['0°C','−100°C','−273°C','−373°C'], c:2, e:'Absolute zero = −273°C = 0 K. The theoretical minimum temperature where particles have minimum internal energy.', t:'H'},
  {q:'Which state of matter has a definite volume but no definite shape?', o:['Solid','Liquid','Gas','Plasma'], c:1, e:'Liquids have a fixed volume but take the shape of their container, because particles can flow past each other.'},
  {q:'Why does evaporation cool a liquid?', o:['Particles slow when they escape the surface','The fastest particles escape, lowering the average KE of those remaining','Heat is absorbed from outside only','Density increases as it cools'], c:1, e:'Only highest-energy particles escape. Average KE of remaining particles falls — so temperature falls.'},
  {q:'What happens to gas particles when the gas is heated at constant volume?', o:['They get bigger','They move faster and collide more frequently and with more force','They escape through the container','They slow down'], c:1, e:'Heating increases kinetic energy of particles → faster movement → more frequent and more energetic collisions with the container walls → higher pressure.', t:'F'},
  {q:'A student\'s eye is not level with the water surface in a measuring cylinder. Which type of error does this cause?', o:['Random error','Systematic error','Zero error','Calibration error'], c:1, e:'Parallax error is a systematic error — all readings are consistently shifted in the same direction depending on the angle of view.', s:AQA_P1H},
  {q:'How does an increase in temperature affect gas particles?', o:['Mean potential energy of particles increases','Mean separation of particles increases','Mean kinetic energy of particles increases','Mean mass of particles increases'], c:2, e:'Temperature is a measure of the mean kinetic energy of particles. Higher temperature → particles move faster → greater mean KE. Separation and potential energy only change significantly during state changes.', s:AQA_P1H},
  {q:'A rock has density 2.55 ± 0.10 g/cm³. Possible rock types: Basalt 2.90±0.10, Chalk 2.35±0.15, Flint 2.60±0.10, Sandstone 2.20±0.20, Slate 2.90±0.20. Which two could match?', o:['Basalt or chalk','Chalk or flint','Flint or sandstone','Sandstone or slate'], c:1, e:'Rock range: 2.45–2.65 g/cm³. Chalk range: 2.20–2.50 (overlaps). Flint range: 2.50–2.70 (overlaps). Basalt (2.80–3.00) and Slate (2.70–3.10) are too dense; Sandstone (2.00–2.40) is too light.', s:AQA_P1H_22},
  {q:'In a specific latent heat experiment where water is boiled, which of the following is the hazard?', o:['Wearing heatproof gloves','Boiling water','Using safety goggles','Placing the heater on a heatproof mat'], c:1, e:'Boiling water is the hazard — it can cause severe scalds. Heatproof gloves, safety goggles, and heatproof mats are precautions taken to reduce the risk from the hazard, not hazards themselves.', s:AQA_P1H_22},
  {q:'What instrument is most appropriate for accurately measuring a small volume of liquid in an experiment?', o:['Beaker','Conical flask','Measuring cylinder','Test tube'], c:2, e:'A measuring cylinder has graduated scale markings for accurate volume measurement. Beakers and flasks have only rough volume markings and are not suitable for accurate measurement.', s:AQA_P1H_22},
  {q:'A temperature-time graph (Figure 1) shows ice being heated. Which part of the graph shows when the ice is melting?', o:['A','B','C','D'], c:1, e:'⚠️ DIAGRAM REQUIRED — Figure 1 shows a temperature-time graph for ice being heated. During melting, temperature stays constant as energy goes into breaking intermolecular bonds (latent heat of fusion). Section B is the first horizontal section, corresponding to the melting point. Answer: B (index 1).', s:AQA_P1F_NOV21},
  {q:'A temperature-time graph (Figure 1) shows ice heated until the water boils. Which part shows the water boiling?', o:['A','B','C','D'], c:3, e:'⚠️ DIAGRAM REQUIRED — Figure 1 shows a temperature-time graph. During boiling, temperature stays constant at 100°C as energy goes into breaking intermolecular bonds (latent heat of vaporisation). Section D is the second (later) horizontal section at 100°C. Answer: D (index 3).', s:AQA_P1F_NOV21},
  {q:'As the temperature of water increases, which property of the water particles changes?', o:['The kinetic energy of the particles','The mass of each particle','The number of particles'], c:0, e:'Temperature is a measure of the mean kinetic energy of particles. As temperature rises, particles move faster and have greater kinetic energy. The mass of individual water molecules and the total number of particles remain unchanged.', s:AQA_P1F_NOV21},
  {q:'A substance is heated and changes directly from a solid to a gas without passing through the liquid phase. Which word describes this process?', o:['Condenses','Evaporates','Ionises','Sublimates'], c:3, e:'Sublimation is the direct change of state from solid to gas. Examples include dry ice (solid CO₂) and iodine at room temperature. Condensation is gas→liquid; evaporation is liquid→gas from the surface; ionisation involves removing electrons.', s:AQA_P1F_NOV21},
  {q:'A student takes three volume measurements of a fruit and calculates a mean. Which two advantages does this give?', o:['Allows anomalous results to be identified and ignored, and reduces the effect of random errors','Improves the resolution of the measurement and stops all types of error','Increases precision and improves resolution','Reduces random errors and eliminates systematic errors'], c:0, e:'Repeat readings and a mean: (1) allow anomalous (outlier) values to be identified and excluded before calculating the mean; (2) reduce the effect of random errors by averaging out fluctuations. They do not improve instrument resolution or eliminate systematic errors.', s:AQA_P1F_NOV21},
  {q:'Figure 12 shows a syringe used in a gas pressure investigation. What is the range of the syringe?', o:['From 0 to 1 cm³','From 0 to 5 cm³','From 0 to 25 cm³'], c:2, e:'⚠️ DIAGRAM REQUIRED — Figure 12 shows the syringe used in the investigation. The scale runs from 0 to 25 cm³, so the range is 0 to 25 cm³.', s:AQA_P1F_NOV21},
  {q:'A gas in a syringe is expanded by pulling the plunger outwards. Which change occurs in the gas?', o:['The gas particles stop moving','There are more frequent collisions between gas particles','There is more space between the gas particles'], c:2, e:'Pulling the plunger increases the volume. The same number of particles occupies more space, so there is more space between the particles. Particles travel further between wall collisions → less frequent collisions → lower pressure.', s:AQA_P1F_NOV21},
  {q:'A balloon contains helium at 100 000 Pa and volume 0.030 m³. It is compressed at constant temperature to a volume of 0.025 m³. What is the new pressure?', o:['80 000 Pa','100 000 Pa','120 000 Pa','133 000 Pa'], c:2, e:"Boyle\'s Law: P₁V₁ = P₂V₂. P₂ = (100 000 × 0.030) ÷ 0.025 = 3000 ÷ 0.025 = 120 000 Pa. Volume decreased so pressure increases.", t:'H', s:AQA_P1H_NOV20},
  {q:'Which two statements correctly describe the movement of gas particles in a balloon?', o:['All particles move at the same speed in predictable paths','Particles vibrate about fixed positions in circular paths','Particles move in random directions with a range of speeds','Particles move in one direction only at increasing speed'], c:2, e:'Gas particles move randomly in all directions (unpredictably, in straight lines between collisions) and have a range (distribution) of speeds — not all at the same speed. Vibrating about fixed positions describes a solid. This is the kinetic particle model.', s:AQA_P1H_NOV20},
  {q:'The electrical circuit in a car windscreen heater transfers 5010 J to melt 0.015 kg of ice. Calculate the specific latent heat of fusion of water.', a:'Rearrange Q = mL: L = Q ÷ m = 5010 ÷ 0.015 = 334 000 J/kg.', t:'H', s:AQA_P1H_MOCK23},
  {q:'Explain the changes in the arrangement AND movement of particles as ice at 0°C melts and the water warms to 5°C.', a:'During melting (0°C throughout): The regular lattice arrangement of particles in ice breaks down — particles move to a more random, disordered arrangement. Particles begin to slide and move past each other (liquid state) rather than vibrating about fixed positions. Temperature stays constant as energy breaks intermolecular bonds (latent heat of fusion) rather than increasing kinetic energy. After melting, as water warms from 0°C to 5°C: The random arrangement of particles remains. Particles move faster (greater kinetic energy) as temperature increases. Average separation increases very slightly. There is no change of state so no constant-temperature period.', s:AQA_P1H_MOCK23},
  {q:'Complete the sentence: Air particles in a tyre move quickly in ___ directions.', a:'Air particles in a tyre move quickly in RANDOM directions. Gas particles travel in straight lines between collisions, constantly changing direction — the overall motion is disordered and unpredictable.', s:AQA_P1H_MOCK23},
  {q:'More air is pumped into a tyre. The volume and temperature of the air do NOT change. Explain why the pressure increases.', a:'More air means more particles in the same volume. With more particles, there are more frequent collisions between particles and the tyre walls per second. Each collision exerts a force on the wall. A greater number of collisions per second means a greater total force on the same area of wall — which means higher pressure.', s:AQA_P1H_MOCK23},
  {q:'The temperature of the air inside a car tyre increases (volume stays constant). Explain why the pressure increases.', a:'As temperature increases: (1) The particles gain kinetic energy and move faster. (2) Faster-moving particles collide with the tyre walls more frequently per second. (3) Each collision involves a greater change in momentum, so each collision exerts a greater force on the wall. Both the increased collision frequency and the greater force per collision mean the total force per unit area (pressure) on the tyre walls increases.', t:'H', s:AQA_P1H_MOCK23},
  {q:'An electrical circuit melts 0.015 kg of ice using 5010 J. What is the specific latent heat of fusion of water?', o:['75 150 J/kg','167 000 J/kg','334 000 J/kg','668 000 J/kg'], c:2, e:'L = Q ÷ m = 5010 ÷ 0.015 = 334 000 J/kg. This matches the accepted value of SLH of fusion for water (~334 000 J/kg).', t:'H', s:AQA_P1H_MOCK23},
