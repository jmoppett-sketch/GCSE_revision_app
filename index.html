'forces': { name: 'Forces', fc: [
  {q:'What is the difference between scalar and vector quantities?', a:'Scalar: magnitude only (e.g. speed, mass, energy). Vector: magnitude and direction (e.g. velocity, force, acceleration, momentum, displacement).'},
  {q:'State Newton\'s First Law of Motion.', a:'An object remains at rest or in uniform motion unless acted on by a resultant force.'},
  {q:'State Newton\'s Second Law of Motion.', a:'The resultant force on an object equals mass × acceleration: F = ma (N, kg, m/s²).'},
  {q:'State Newton\'s Third Law of Motion.', a:'When two objects interact, they exert equal and opposite forces on each other (same type, different objects).'},
  {q:'What is the difference between weight and mass?', a:'Mass (kg): amount of matter — constant everywhere. Weight (N): gravitational force, W = mg. Weight varies with gravitational field strength.'},
  {q:'What is the equation for speed?', a:'speed = distance ÷ time. v = s/t where v = speed (m/s), s = distance (m), t = time (s).', t:'F'},
  {q:'What is the equation for work done?', a:'W = Fs where W = work done (J), F = force (N), s = displacement in direction of force (m).'},
  {q:'What is momentum and its equation?', a:'p = mv where p = momentum (kg m/s), m = mass (kg), v = velocity (m/s). Momentum is a vector.', t:'H'},
  {q:'State the law of conservation of momentum.', a:'In a closed system with no external forces, total momentum before an event equals total momentum after.', t:'H'},
  {q:'What is stopping distance?', a:'Stopping distance = thinking distance + braking distance. Thinking distance depends on reaction time. Braking distance depends on speed, road conditions, and tyre/brake quality.'},
  {q:'State Hooke\'s Law.', a:'Extension is directly proportional to the applied force, up to the elastic limit: F = ke (k = spring constant N/m, e = extension m).'},
  {q:'What is the difference between elastic and inelastic deformation?', a:'Elastic: returns to original shape when force removed. Inelastic (plastic): permanent deformation remains.'},
  {q:'An aeroplane has thrust 14 000 N, air resistance 4500 N, and friction 9500 N. What is the resultant force and what does this tell you about its motion?', a:'Resultant = 14 000 − (4500 + 9500) = 0 N. Zero resultant force → constant velocity (Newton\'s First Law).', s:AQA_P2H},
  {q:'How can a driver increase the moment of a lever about its pivot without increasing the force applied?', a:'Apply the force at a greater perpendicular distance from the pivot. Moment = force × perpendicular distance, so increasing the distance increases the moment.', s:AQA_P2H},
  {q:'How does driver distraction increase stopping distance?', a:'Distraction increases reaction time → longer thinking distance → greater stopping distance. (Braking distance is unchanged; it is the thinking distance that increases.)', s:AQA_P2H},
  {q:'Why does the temperature of car brakes increase when they are used?', a:'Friction between brake pads and discs transfers kinetic energy to thermal energy. The brakes gain thermal energy and their temperature increases.', s:AQA_P2H},
  {q:'What is a closed system in physics?', a:'A system where no net external force acts on it. Total momentum is conserved — it cannot be changed by internal forces alone.', s:AQA_P2H},
  {q:'How does a flexible bumper on a bumper car reduce injury risk during a collision?', a:'The flexible bumper increases the time of the collision. Since F = Δp/t, a longer collision time means a smaller force for the same change in momentum, reducing injury.', s:AQA_P2H},
  {q:'A bumper car accelerates at 2.0 m/s² over 1.5 m to reach 2.5 m/s. Calculate the initial velocity.', a:'Using v² = u² + 2as: u² = v² − 2as = 2.5² − 2(2.0)(1.5) = 6.25 − 6.0 = 0.25. u = 0.5 m/s.', t:'H', s:AQA_P2H},
  {q:'Which energy store increases as bungee cords (springs) are stretched?', a:'The elastic potential energy store increases as the bungee cords are stretched.', s:AQA_P1H},
  {q:'Two bungee cords (k = 735 N/m, extension = 8.0 m each) launch a 240 kg pod. Calculate maximum height. (g = 9.8 N/kg)', a:'EPE each cord = ½ × 735 × 8² = 23 520 J. Total EPE = 47 040 J. h = EPE/mg = 47 040 / (240 × 9.8) = 20 m.', t:'H', s:AQA_P1H},
  {q:'Why is the actual maximum height of a bungee-launched pod less than the calculated value?', a:'Some elastic potential energy is transferred as thermal energy due to air resistance acting on the pod as it moves upwards. Not all EPE converts to GPE.', s:AQA_P1H},
  {q:'What is terminal velocity?', a:'When driving force = resistive forces (resultant force = 0), acceleration = 0 and the object moves at constant maximum velocity.'},
  {q:'What is the difference between a contact force and a non-contact force? Give examples.', a:'Contact: forces where objects physically touch (friction, normal reaction, tension, air resistance). Non-contact: forces that act at a distance (gravity, magnetism, electrostatic).', t:'F'},
  {q:'The decrease in gravitational potential energy of a rider on a slide (AquaShute) was 8.33 kJ. The rider moved through a vertical height of 17.0 m. (g = 9.8 N/kg) Calculate the mass of the rider.', a:'Convert: GPE = 8.33 kJ = 8330 J. Rearrange GPE = mgh: m = GPE ÷ (g × h) = 8330 ÷ (9.8 × 17.0) = 8330 ÷ 166.6 = 50.0 kg.', t:'H', s:AQA_P1H_NOV20},
  {q:'Suggest two factors that affect the distance an electric car can travel before the battery needs recharging.', a:'Any two of: (1) The capacity/energy stored in the battery — a larger battery stores more energy for greater range. (2) The speed of travel — higher speeds increase air resistance, requiring more work per km. (3) The mass of the car and passengers — greater mass requires more energy to accelerate. (4) The efficiency of the motor — a more efficient motor wastes less energy as heat.', t:'H', s:AQA_P2H_22},
  {q:'Write down the equation linking acceleration (a), change in velocity (Δv) and time taken (t).', a:'a = Δv ÷ t. Rearranged: Δv = at and t = Δv/a. Units: a in m/s², Δv in m/s, t in seconds.', s:AQA_P2H_22},
  {q:'An electric car has maximum acceleration 20 m/s². Calculate the time taken for its speed to change from 0 m/s to 28 m/s at maximum acceleration.', a:'Rearrange a = Δv/t: t = Δv/a = 28 ÷ 20 = 1.4 s.', t:'H', s:AQA_P2H_22},
  {q:'An electric car accelerates at 10 m/s² from rest over 605 m. Calculate its final velocity.', a:'Using v² = u² + 2as: v² = 0² + 2 × 10 × 605 = 12 100. v = √12 100 = 110 m/s.', t:'H', s:AQA_P2H_22},
  {q:'Write down the equation linking distance (s), force (F) and work done (W).', a:'W = Fs. Work done (J) = force (N) × distance in direction of force (m).', s:AQA_P2H_22},
  {q:'An electric car travels 7.5 km at maximum speed. Air resistance is 4000 N. Calculate the work done against air resistance.', a:'Convert: 7.5 km = 7500 m. W = Fs = 4000 × 7500 = 30 000 000 J = 3.0 × 10⁷ J.', t:'H', s:AQA_P2H_22},
  {q:'Give two factors (other than speed) that increase the braking distance of a car.', a:'Any two of: (1) Wet, icy or greasy road surface — less friction between tyres and road. (2) Worn tyres — reduced grip. (3) Worn or faulty brakes — less braking force applied. (4) Greater mass of vehicle — more kinetic energy to dissipate.', s:AQA_P2H_22},
  {q:'Explain why the driver\'s reaction time affects the thinking distance of a car.', a:'Thinking distance is the distance the car travels during the driver\'s reaction time (before the brakes are applied). Thinking distance = speed × reaction time. A longer reaction time means the car travels further before braking begins, so thinking distance (and therefore stopping distance) increases.', s:AQA_P2H_22},
  {q:'A speed camera road has a 20 m/s speed limit. The cameras are 1.5 km apart. Calculate the minimum time to travel 1.5 km without breaking the speed limit.', a:'Convert: 1.5 km = 1500 m. Use v = s/t: t = s/v = 1500 ÷ 20 = 75 s.', t:'H', s:AQA_P2H_22},
  {q:'Between two speed cameras, average speed and average velocity are different. Explain why.', a:'Average speed = total distance ÷ time. Average velocity = displacement ÷ time (displacement is the straight-line distance between start and end points, with direction). If the road between the cameras is not perfectly straight, the total distance travelled is greater than the displacement. Therefore average speed > magnitude of average velocity. Also, velocity is a vector (has direction) while speed is a scalar.', s:AQA_P2H_22},
  {q:'Why does a hailstone accelerate as it falls from a cloud?', a:'The weight (gravitational force, downward) is greater than the air resistance (upward). There is a resultant downward force, so the hailstone accelerates downward (Newton\'s Second Law: F = ma).', s:AQA_P2H_22},
  {q:'Explain why a falling hailstone reaches terminal velocity.', a:'As the hailstone speeds up, air resistance increases (drag increases with speed). Eventually air resistance equals the weight of the hailstone. The resultant force is zero. By Newton\'s First Law, the hailstone stops accelerating and moves at a constant (terminal) velocity.', s:AQA_P2H_22},
  {q:'Explain the difference in maximum kinetic energy between a hailstone of mass 10 g and a hailstone of mass 20 g, using data from a terminal velocity graph.', a:'⚠️ DIAGRAM REQUIRED — Figure 8 shows terminal velocity vs mass for hailstones. Read the terminal velocity for each mass from the graph. KE = ½mv². The 20 g hailstone has both greater mass AND greater terminal velocity (from Figure 8) than the 10 g hailstone. Both factors increase KE, so the 20 g hailstone has significantly greater maximum kinetic energy. Example: if v₁₀ ≈ 9 m/s and v₂₀ ≈ 13 m/s: KE₁₀ = ½ × 0.010 × 81 ≈ 0.41 J; KE₂₀ = ½ × 0.020 × 169 ≈ 1.69 J.', t:'H', s:AQA_P2H_22},
  {q:'A hailstone hits the ground at its terminal velocity of 25 m/s and takes 0.060 s to stop. Determine the average force on the hailstone. (Use Figure 8 for the mass.)', a:'⚠️ DIAGRAM REQUIRED — Figure 8 shows terminal velocity vs mass. Read off the mass corresponding to terminal velocity 25 m/s (approximately 40 g = 0.040 kg from the graph). Then: impulse = force × time → F = mΔv/t = (m × 25) / 0.060. Example with m = 0.040 kg: F = 0.040 × 25 / 0.060 = 1.0 / 0.060 ≈ 17 N. Show all working including mass read from graph.', t:'H', s:AQA_P2H_22},
  {q:'What is meant by the centre of mass of an object?', a:'The single point where the entire weight of the object can be considered to act. It is the point where all the mass of the object appears to be concentrated.', s:AQA_P2H_22},
  {q:'Calculate the mean weight of one tomato from a balance reading showing five tomatoes. (g = 9.8 N/kg)', a:'⚠️ DIAGRAM REQUIRED — Figure 9 shows a balance reading for five tomatoes. Read the total mass from the balance scale. Convert to kg if needed. Weight of all 5 = mass × 9.8. Mean weight of one tomato = total weight ÷ 5. Example: if total mass = 500 g = 0.50 kg → total weight = 0.50 × 9.8 = 4.9 N → mean weight per tomato = 4.9 ÷ 5 = 0.98 N.', s:AQA_P2H_22},
  {q:'A spring in a balance is compressed by 6.0 N of force. Determine its spring constant using Figure 10.', a:'⚠️ DIAGRAM REQUIRED — Figure 10 shows the spring with no force and with 6.0 N force. Read the compression/extension (e) from the figure. Rearrange Hooke\'s Law: k = F/e. Example: if e = 3.0 cm = 0.030 m → k = 6.0 ÷ 0.030 = 200 N/m. Show all working and unit conversion.', t:'H', s:AQA_P2H_22},
  {q:'Give one property of a spring that makes it suitable for use in a balance.', a:'The spring obeys Hooke\'s Law (up to its elastic limit) — extension is directly proportional to force. This gives a linear, uniform scale on the balance so equal increments of force produce equal increments of extension. Alternatively: it returns to its original length after the load is removed (elastic deformation), so it can be used repeatedly and reliably.', s:AQA_P2H_22},
  {q:'A diving brick is stationary at the bottom of a swimming pool. Explain why the forces cause it to be stationary.', a:'Three forces act: weight (downward), upthrust (upward, equal to weight of water displaced), and normal reaction from the pool floor (upward). The brick is denser than water so weight > upthrust. The pool floor provides a normal reaction force upward. The resultant of all forces is zero (weight = upthrust + normal reaction), so by Newton\'s First Law the brick remains stationary.', s:AQA_P2H_22},
  {q:'Calculate the density of water in a pool where the force on the top surface of a brick 2.50 m below the surface is 637 N. (g = 9.8 N/kg)', a:'⚠️ DIAGRAM REQUIRED — Figure 14 shows the diving brick dimensions. Read the top surface area (A) from the figure. Use: pressure P = F/A and P = ρgh → ρ = F/(A × g × h) = 637 ÷ (A × 9.8 × 2.50). Example: if A = 0.26 × 0.10 = 0.026 m² → ρ = 637 ÷ (0.026 × 9.8 × 2.50) = 637 ÷ 0.637 = 1000 kg/m³. Show area reading from figure and all working.', t:'H', s:AQA_P2H_22},
  {q:'In a deep pool, the force on the top of a brick at 2.50 m depth is 618 N. Determine the force on the top surface when the brick is at the bottom of the pool as shown in Figure 15.', a:'⚠️ DIAGRAM REQUIRED — Figure 15 shows the brick at the bottom of the deep pool; read the depth (h₂) from the figure. Since F = ρghA, and ρ, g, A are constant: F ∝ h. So F₂/F₁ = h₂/h₁ → F₂ = 618 × (h₂/2.50). Use this proportional method and show all working. Give answer to 3 significant figures.', t:'H', s:AQA_P2H_22},
  {q:'On an AquaShute ride, riders of different masses all reach approximately the same speed at the bottom of the slide. Explain why.', a:'All riders start at the same height, so they have the same gravitational potential energy per unit mass (specific GPE = gh). As they slide down, GPE is transferred to KE. Setting GPE = KE: mgh = ½mv². The mass m cancels from both sides, giving v = √(2gh) — the final speed depends only on height, not mass. Even with friction (where drag forces scale approximately with mass), mass cancels from the energy equation. So all riders reach the same speed at the bottom regardless of their mass.', t:'H', s:AQA_P1H_NOV20},
], mc: [
  {q:'A 5 kg object accelerates at 3 m/s². What is the resultant force?', o:['1.67 N','8 N','15 N','0.6 N'], c:2, e:'F = ma = 5 × 3 = 15 N.'},
  {q:'A car of mass 1000 kg moves at 20 m/s. What is its momentum?', o:['50 kg m/s','980 kg m/s','20 000 kg m/s','1020 kg m/s'], c:2, e:'p = mv = 1000 × 20 = 20 000 kg m/s.', t:'H'},
  {q:'What effect does doubling speed have on braking distance?', o:['Doubles','Triples','Quadruples','Stays the same'], c:2, e:'KE = ½mv². Doubling v quadruples KE. Brakes must do 4× more work → braking distance quadruples.', t:'H'},
  {q:'A 70 kg person stands on Earth (g = 10 N/kg). Their weight is:', o:['70 N','700 N','7 N','7000 N'], c:1, e:'W = mg = 70 × 10 = 700 N.'},
  {q:'When a spring obeys Hooke\'s Law, doubling the force:', o:['Has no effect on extension','Doubles the extension','Quadruples the extension','Halves the extension'], c:1, e:'F = ke → extension is directly proportional to force (up to the elastic limit). Double F → double e.'},
  {q:'Which of these is a contact force?', o:['Gravity','Magnetism','Friction','Electrostatic force'], c:2, e:'Friction acts between surfaces that are touching — it is a contact force. Gravity, magnetism, and electrostatic forces act at a distance.', t:'F'},
  {q:'A bumper car has a change in momentum of 700 kg m/s in a collision lasting 0.28 s. What is the force?', o:['196 N','700 N','2500 N','25 000 N'], c:2, e:'F = Δp/t = 700 / 0.28 = 2500 N. A longer collision time reduces the force for the same change in momentum.', t:'H', s:AQA_P2H},
  {q:'If thrust equals all resistive forces combined, an object moves at:', o:['Increasing speed','Decreasing speed','Constant speed','Zero speed'], c:2, e:'Resultant force = 0 → no acceleration. Newton\'s 1st Law: object continues at constant velocity (or stays at rest).', s:AQA_P2H},
  {q:'How does Newton\'s Third Law apply to a bumper car hitting a barrier?', o:['The car exerts a larger force on the barrier than the barrier exerts on the car','The barrier exerts a larger force on the car','The car and barrier exert equal and opposite forces on each other','No forces are exerted during the collision'], c:2, e:'Newton\'s 3rd Law: the car exerts a force on the barrier and the barrier exerts an equal and opposite force on the car. Same magnitude, opposite direction, different objects.', s:AQA_P2H},
  {q:'A car travels 150 m in 10 s at constant speed. What is its speed?', o:['1500 m/s','15 m/s','0.067 m/s','140 m/s'], c:1, e:'v = s/t = 150 ÷ 10 = 15 m/s.', t:'F'},
  {q:'Which of the following conclusions can be drawn from a box-and-whisker plot showing reaction times before and after drinking alcohol?', o:['Every person\'s reaction time increases after drinking alcohol','Mean reaction time increases after drinking alcohol','Some people\'s reaction time is not affected by drinking alcohol','There is a smaller range of reaction times after drinking alcohol'], c:1, e:'⚠️ DIAGRAM REQUIRED — Figure 5 shows a box plot of reaction times. From such plots: the MEAN (median) increases — this is directly visible. You cannot conclude every person\'s reaction time increased (individual variation). The range and spread can also vary. The correct conclusion readable from the mean/median line is that mean reaction time increases after drinking alcohol.', t:'H', s:AQA_P2H_22},
  {q:'Why does terminal velocity increase as the mass of a hailstone increases?', o:['As mass increases the cross-sectional surface area of a hailstone increases','As mass increases the volume of a hailstone increases','As mass increases the weight of a hailstone increases'], c:2, e:'Terminal velocity is reached when weight = air resistance. Greater mass → greater weight. A higher speed is needed for air resistance to equal the larger weight, so terminal velocity is higher. (Cross-sectional area and volume do increase with mass, but neither is the direct reason — weight is.)', s:AQA_P2H_22},
  {q:'Which of the following is the same as 1 joule?', o:['1 Nm','1 N/m','1 N/m²','1 Nm²'], c:0, e:'W = Fs (work = force × distance). Units: J = N × m = Nm. So 1 joule = 1 newton-metre (1 Nm).', s:AQA_P2H_22},
  {q:'A light gate is used to measure the speed of a sled on a slide. Which two quantities are needed?', o:['Mass of sled and gravitational field strength','Mass of sled and time for sled to pass the gate','Length of sled and time for sled to pass the gate','Temperature of surroundings and mass of rider'], c:2, e:'Speed = distance ÷ time. The light gate measures the time for the sled to interrupt the beam. The distance used is the known length of the sled. Speed = sled length ÷ time to pass the gate.', s:AQA_P1H_NOV20},
  {q:'A child stands still in a baby walker. What is the resultant vertical force on the child? Give a reason.', a:'Resultant vertical force = 0 N. Reason: the child is stationary/in equilibrium, so the upward contact force from the floor equals the downward weight of the child — balanced forces, resultant = 0.', s:AQA_P2H_JUN24},
  {q:'Write down the equation linking work done (W), force (F) and distance (s).', a:'W = Fs (work done = force × distance moved in the direction of the force). Units: J = N × m.', s:AQA_P2H_JUN24},
  {q:'A child pushes a baby walker 2.8 m across a floor doing 35 J of work. Calculate the horizontal force applied.', a:'Rearrange W = Fs: F = W ÷ s = 35 ÷ 2.8 = 12.5 N.', s:AQA_P2H_JUN24},
  {q:'A baby walker is pushed from carpet onto a hard floor with the same force. Explain why it speeds up.', a:'The hard floor has less friction than the carpet. With the same applied force but less friction/resistive force, the resultant (net) force is greater in the direction of motion. A greater resultant force causes greater acceleration, so the walker speeds up.', s:AQA_P2H_JUN24},
  {q:'Write down the equation linking moment (M), force (F) and perpendicular distance (d).', a:'M = Fd (moment = force × perpendicular distance from the pivot). Unit: Nm.', s:AQA_P2H_JUN24},
  {q:'A force of 2.0 N is applied to a gear at 7.5 cm from its pivot. Calculate the moment.', a:'Convert: 7.5 cm = 0.075 m. M = Fd = 2.0 × 0.075 = 0.15 Nm.', s:AQA_P2H_JUN24},
  {q:'Gear A is turned by applying a force. Explain what happens to gear B when it meshes with gear A.', a:'When gear A rotates, its teeth push against the teeth of gear B, causing gear B to rotate in the opposite direction. The moment (torque) is transmitted through the meshed teeth. If gear B has more teeth (larger radius) it rotates more slowly but with a greater moment; fewer teeth means faster rotation with a smaller moment.', s:AQA_P2H_JUN24},
  {q:'In a trolley acceleration experiment, what is the name given to the force F acting through the string?', a:'Tension.', s:AQA_P2H_JUN24},
  {q:'In a trolley acceleration experiment investigating F vs a, give one control variable.', a:'The mass of the trolley (must remain constant so only force is varied). Alternatively: the surface/slope angle of the runway.', s:AQA_P2H_JUN24},
  {q:'A trolley accelerates from rest through a measured distance in a measured time. Describe how to calculate its acceleration.', a:'Use the equation s = ut + ½at². Since the trolley starts from rest, u = 0, so s = ½at². Rearrange: a = 2s ÷ t². Measure the distance (s) with a ruler and the time (t) with a stop-watch or light gate timer. Substitute values to find a.', s:AQA_P2H_JUN24},
  {q:'Three acceleration values from repeated trolley releases are: 1.36, 1.39 and 1.33 m/s². Calculate the uncertainty.', a:'Uncertainty = half the range = (1.39 − 1.33) ÷ 2 = 0.06 ÷ 2 = ± 0.03 m/s².', t:'H', s:AQA_P2H_JUN24},
  {q:'A trolley experiment runway is raised at one end with the same string force applied. Explain the effect on acceleration.', a:'Raising one end means the trolley is now on a slope. The component of the trolley\'s weight acting along (down) the slope adds to the net force in the direction of motion. The resultant force is greater than before, so the acceleration increases.', s:AQA_P2H_JUN24},
  {q:'A train of mass 240 000 kg travelling at 60 m/s is stopped by a braking force of 270 000 N. Calculate the braking distance.', a:'Method 1 (energy): Work done by brakes = kinetic energy of train. Fs = ½mv². s = mv² ÷ (2F) = (240 000 × 60²) ÷ (2 × 270 000) = 864 000 000 ÷ 540 000 = 1600 m. Method 2 (Newton\'s 2nd + kinematics): a = F/m = 270 000/240 000 = 1.125 m/s². v² = u² − 2as → 0 = 3600 − 2(1.125)s → s = 3600/2.25 = 1600 m.', t:'H', s:AQA_P2H_JUN24},
  {q:'Explain how drinking alcohol before driving a train would affect stopping distance.', a:'Alcohol slows reaction time. A longer reaction time means the train travels further before the driver applies the brakes (thinking distance increases). The braking distance remains the same (same force/deceleration), but the total stopping distance = thinking distance + braking distance, so overall stopping distance increases.', s:AQA_P2H_JUN24},
  {q:'Explain the factors that affect stopping distance of a vehicle in an emergency. [6 marks]', a:'Stopping distance = thinking distance + braking distance. THINKING DISTANCE is increased by: higher speed (more distance covered during reaction time); alcohol or drugs (slow reaction time); tiredness/distraction (slower reactions). BRAKING DISTANCE is increased by: higher speed (more KE to be removed — v² relationship); worn brakes (less braking force); worn/bald tyres (less friction); wet/icy/oily roads (less grip — reduced friction between tyre and road). The greater the deceleration (braking force), the shorter the braking distance, but too high a deceleration risks wheel lock, skidding, or losing control.', s:AQA_P2H_JUN19},
  {q:'A vehicle is stopped by a braking force of 60 000 N. The work done was 900 000 J. Calculate the braking distance.', a:'Rearrange W = Fs: s = W ÷ F = 900 000 ÷ 60 000 = 15 m.', s:AQA_P2H_JUN19},
  {q:'Explain the possible dangers of a very large braking force when stopping a vehicle.', a:'A very large braking force causes a large deceleration. This could: (1) cause the wheels to lock/skid — loss of steering control as locked wheels slide rather than roll; (2) result in an uncontrolled stop or swerve, endangering other road users; (3) cause objects/passengers inside the vehicle to be thrown forwards violently.', s:AQA_P2H_JUN19},
  {q:'What is inertia?', a:'Inertia is the tendency of an object to remain at rest, or to continue moving in a straight line at constant speed. Objects with greater mass have greater inertia — they are harder to accelerate, decelerate, or change direction.', s:AQA_P2H_JUN19},
  {q:'A raw egg is dropped onto soft foam and does not break. Explain why foam protects the egg compared to a concrete floor.', a:'When the egg hits the foam, it decelerates over a much longer time than on concrete. For the same change in momentum (impulse = Ft = Δp), a longer stopping time means a smaller average force. The smaller force means the eggshell is less likely to crack. (F = Δp ÷ t — the foam increases t, reducing F.)' , s:AQA_P2H_JUN19},
  {q:'A child of mass 32 kg jumps from a swing and decelerates from her landing velocity to rest in 0.18 s. The average force from the ground is 800 N. Calculate her landing velocity.', a:'Impulse = change in momentum: Ft = mv (taking landing velocity as initial). v = Ft ÷ m = 800 × 0.180 ÷ 32 = 144 ÷ 32 = 4.5 m/s.', t:'H', s:AQA_P2H_JUN19},
  {q:'Explain the changing motion of a skydiver from the moment of jumping to reaching terminal velocity.', a:'Immediately after jumping: weight acts downward, drag (air resistance) is small (low speed). Resultant force is downward, so the skydiver accelerates downward. As speed increases: drag increases (air resistance increases with speed). Resultant force decreases, so the rate of acceleration decreases (still accelerating but more slowly). At terminal velocity: drag equals weight. Resultant force = 0. The skydiver moves at constant speed (terminal velocity). No further acceleration.', s:AQA_P2H_JUN19},
  {q:'A skydiver jumped from 39 000 m above Earth and reached a much higher maximum speed than from 4000 m. Explain why.', a:'At very high altitude (39 000 m) the air is much less dense. Therefore the drag force on the skydiver is very small even at high speeds. The weight still acts fully, so the resultant downward force remains large, allowing the skydiver to continue accelerating to a much greater speed before drag eventually equals weight. From 4000 m, the denser air produces much more drag at lower speeds, so terminal velocity is reached earlier and at a lower speed.', s:AQA_P2H_JUN19},
  {q:'Explain why it is easier to lower a lorry ramp by pulling a rope further from the pivot than pulling a handle closer to the pivot.', a:'Moment = force × perpendicular distance from pivot. For the same applied force, a greater distance from the pivot produces a greater moment (turning effect). The rope is further from the hinge (pivot) than the handle, so the same pull produces a greater moment, making it easier to lower the ramp.', s:AQA_P2H_JUN19},
  {q:'A trolley experiment, a velocity-time graph (Figure 12) shows a train journey. Determine the distance in the first 600 s and maximum deceleration.', a:'⚠️ DIAGRAM REQUIRED — Figure 12 is a velocity–time graph. DISTANCE: Area under the graph for the first 600 s. If the train accelerates then travels at constant velocity, calculate trapezium/triangles + rectangle. MAXIMUM DECELERATION: Find the steepest downward section (largest negative gradient). Deceleration = Δv ÷ Δt for that section. Show working on the graph.', t:'H', s:AQA_P2H_JUN24},
]},

'waves': { name: 'Waves', fc: [
  {q:'What is the difference between transverse and longitudinal waves?', a:'Transverse: oscillations perpendicular to direction of energy transfer (e.g. light, water). Longitudinal: oscillations parallel to direction of energy transfer (e.g. sound) — compressions and rarefactions.'},
  {q:'Define amplitude, frequency, wavelength, and wave speed.', a:'Amplitude: maximum displacement from equilibrium. Frequency (Hz): waves per second. Wavelength (m): distance between identical adjacent points. Wave speed (m/s): distance per second.'},
  {q:'State the wave equation.', a:'v = fλ where v = wave speed (m/s), f = frequency (Hz), λ = wavelength (m).'},
  {q:'What is the electromagnetic spectrum (in order of increasing frequency)?', a:'Radio, microwave, infrared, visible light, ultraviolet, X-ray, gamma ray. All travel at 3 × 10⁸ m/s in a vacuum.'},
  {q:'What is refraction?', a:'The change in direction (and speed) of a wave as it passes from one medium to another. The frequency does not change.'},
  {q:'State the law of reflection.', a:'Angle of incidence = angle of reflection. Both angles measured from the normal to the surface.'},
  {q:'What is total internal reflection (TIR)?', a:'When a ray hits a boundary at an angle greater than the critical angle, it is completely reflected back. Used in optical fibres and periscopes.'},
  {q:'Give uses of different parts of the EM spectrum.', a:'Radio: broadcasting. Microwave: satellite comms, cooking. IR: remote controls, thermal imaging. Visible: sight. UV: sterilisation. X-ray: medical imaging. Gamma: cancer treatment.'},
  {q:'Can sound travel through a vacuum? Explain.', a:'No — sound is a longitudinal mechanical wave that requires a medium (particles) to travel. There are no particles in a vacuum.'},
  {q:'In a transverse wave, what is the relationship between oscillation and energy transfer?', a:'The direction of oscillation is perpendicular (at 90°) to the direction of energy transfer.', s:AQA_P2H},
  {q:'A hot flask is left to cool. When does it emit infrared radiation at the greatest rate?', a:'At the start of cooling (the 1st minute), when its temperature — and the temperature difference with the surroundings — is greatest. Rate of IR emission depends on temperature.', s:AQA_P2H},
  {q:'What are two conclusions from comparing matt/shiny black/white surfaces absorbing IR?', a:'(1) Matt surfaces absorb more IR than shiny surfaces of the same colour. (2) Black surfaces absorb more IR than white surfaces of the same finish. Matt black absorbs most; shiny white absorbs least.', s:AQA_P2H},
  {q:'What is reflection from a smooth, flat surface called?', a:'Specular reflection. All reflected rays are parallel (uniform reflection). Contrast with diffuse reflection from rough surfaces.', s:AQA_P2H},
  {q:'A light ray hits a glass block at exactly 90° to the surface (along the normal). Does refraction occur? Why?', a:'No refraction occurs. Refraction happens when a wave crosses a boundary at an angle. A ray travelling along the normal has an angle of incidence of 0° — it passes straight through without bending.', s:AQA_P2H},
  {q:'Explain refraction at an air-glass boundary in terms of wavefronts.', a:'Wavefronts travel faster in air than glass. One end of a wavefront enters the glass and slows before the other end. This causes the wavefront to change direction (tilt), so the ray bends towards the normal.', s:AQA_P2H},
  {q:'Describe a method to investigate how the angle of refraction varies with the angle of incidence for a glass block.', a:'Place the glass block on a sheet of paper and draw around its outline. Draw a normal (dashed line perpendicular to the flat surface) at the point where the ray enters. Set the ray box to shine a single ray of light at the block at a chosen angle of incidence. Mark two points on the incident ray and two on the refracted ray (on the other side of the block). Remove the block and draw the rays. Measure the angle of incidence and angle of refraction with a protractor (both from the normal). Repeat for a range of angles of incidence (e.g. 10° to 80°). Record results in a table. The method may include a labelled diagram showing ray box, glass block, normal, incident ray, and refracted ray.', s:AQA_P2H_22},
  {q:'In a refraction experiment, angles of incidence from 10° to 80° are measured against angles of refraction. Describe how to complete the graph of these results.', a:'⚠️ DIAGRAM REQUIRED — Figure 2 is an incomplete graph. Label the axes: x-axis = angle of incidence (degrees), y-axis = angle of refraction (degrees). Plot any missing data points accurately (e.g. from Table 1: 10→5, 20→10, 30→14, 40→19, 50→23, 60→26, 70→28, 80→29). Draw a smooth curve of best fit through all plotted points.', s:AQA_P2H_22},
  {q:'Describe how to complete a ray diagram to show reflection from a plane mirror surface.', a:'⚠️ DIAGRAM REQUIRED — Figure 3 shows an incident ray hitting a mirror surface. Draw the normal at the point of incidence (a dashed line perpendicular to the mirror surface). Measure the angle of incidence (between incident ray and normal). Draw the reflected ray at the same angle on the other side of the normal (angle of reflection = angle of incidence), going away from the mirror surface.', s:AQA_P2H_22},
  {q:'In an investigation of reflection by a plane mirror, explain two ways that using a ray box with a slit (Method A) is better than using pins (Method B).', a:'⚠️ DIAGRAM REQUIRED — Figure 4 shows the two methods. Likely advantages of Method A (ray box) over Method B (pins): (1) The ray box produces a clearer, brighter ray of light, making it easier to see and mark the path of light accurately — less uncertainty in the direction. (2) A ray box with a slit produces a single, precise ray, whereas pins require lining up multiple pins by eye which introduces human error in judging alignment. (3) The results from the ray box method are more reproducible/repeatable.', s:AQA_P2H_22},
  {q:'What is the difference between a real and virtual image?', a:'Real: rays actually converge; can be projected on a screen. Virtual: rays appear to diverge from the point; cannot be projected (e.g. image in a plane mirror).', t:'H'},
  {q:'What is the resolution of a standard protractor used in optics experiments?', a:'⚠️ DIAGRAM REQUIRED — Figure 1 shows the protractor. Standard protractors are typically marked in 1° increments, so the resolution is 1°. The resolution is the smallest division on the scale.', s:AQA_P2H_JUN24},
  {q:'How does a graph of angle of refraction vs angle of incidence (for a glass block) show the two quantities are NOT directly proportional?', a:'If they were directly proportional, the graph would be a straight line passing through the origin. The graph is a curve (not a straight line) — as the angle of incidence increases, the angle of refraction increases by a smaller and smaller amount (the line flattens). This shows the relationship is not proportional.', s:AQA_P2H_JUN24},
  {q:'P-waves and S-waves are produced by earthquakes. Which best describes their wave types?', a:'P-waves are longitudinal (particles oscillate in the same direction as wave travel — compressions and rarefactions). S-waves are transverse (particles oscillate perpendicular to the direction of wave travel). P-waves can travel through solids and liquids; S-waves can only travel through solids.', s:AQA_P2H_JUN24},
  {q:'An S-wave has frequency 3.6 Hz and speed 4.5 km/s. Calculate its wavelength.', a:'Convert: v = 4.5 km/s = 4500 m/s. Rearrange v = fλ: λ = v ÷ f = 4500 ÷ 3.6 = 1250 m.', s:AQA_P2H_JUN24},
  {q:'Describe the relationship between the distance of an earthquake from a seismometer and the time gap between P-wave and S-wave arrival.', a:'The greater the distance between the earthquake and the seismometer, the longer the time gap between the arrival of the P-wave and the S-wave. P-waves travel faster than S-waves, so over greater distances the P-waves arrive proportionally further ahead of the S-waves.', s:AQA_P2H_JUN24},
  {q:'Give three similarities between radio waves and gamma rays.', a:'Any three: (1) both are part of the electromagnetic spectrum; (2) both travel at the same speed in a vacuum (3.0 × 10⁸ m/s); (3) both are transverse waves; (4) both can transfer energy; (5) both can travel through a vacuum.', s:AQA_P2H_JUN24},
  {q:'Give one medical use of gamma rays.', a:'Treating cancer (gamma knife/radiotherapy) — gamma rays can be targeted at tumours to kill cancer cells. Also used to sterilise medical equipment.', s:AQA_P2H_JUN24},
  {q:'Explain why exposure to gamma rays can be harmful but radio waves are not.', a:'Gamma rays have much higher frequency (and shorter wavelength) than radio waves. Higher frequency means greater photon energy. Gamma rays are ionising radiation — they have enough energy to remove electrons from atoms and damage or destroy DNA in cells, which can cause cancer or kill cells. Radio waves have too little energy per photon to ionise atoms and so cannot damage DNA.', s:AQA_P2H_JUN24},
  {q:'Explain how radio waves are produced at a specific frequency.', a:'An oscillating electrical charge (alternating current) in an aerial causes electrons to oscillate at a specific frequency. These oscillating charges emit radio waves at the same frequency as the oscillation. By controlling the frequency of the AC in the aerial, the frequency of the emitted radio waves is set.', s:AQA_P2H_JUN24},
  {q:'What is the focal length of a convex lens?', a:'The distance from the optical centre (middle) of the lens to the principal focus (focal point) — the point where parallel rays converge after passing through the lens.', s:AQA_P2H_JUN19},
  {q:'Give one similarity and one difference between images formed by convex and concave lenses.', a:'Similarity: both images are virtual and upright (when the object is placed within the focal length for a convex lens). Difference: a convex lens can form a real, inverted, magnified image (when the object is beyond the focal length), whereas a concave lens always produces a virtual, upright, diminished image on the same side as the object.', t:'H', s:AQA_P2H_JUN19},
  {q:'A lens produces an image of letters with magnification 6.0. The image height is 9.0 mm. Calculate the actual height of the letters.', a:'Magnification = image height ÷ object height. Object height = image height ÷ magnification = 9.0 ÷ 6.0 = 1.5 mm.', s:AQA_P2H_JUN19},
  {q:'In an experiment with a vibrating stretched string, the wavelength is measured as 80 cm. What instrument would you use to measure this?', a:'A ruler or metre rule. (The wavelength of 80 cm is a length measurement visible on the string between fixed points.)', s:AQA_P2H_JUN19},
  {q:'A string vibrates at 55 Hz with wavelength 80 cm. Calculate the wave speed.', a:'Convert: λ = 80 cm = 0.80 m. v = fλ = 55 × 0.80 = 44 m/s.', s:AQA_P2H_JUN19},
  {q:'Why is point A (under clear sky) cooler at night than point B (under thick cloud)?', a:'At night, the ground loses heat by emitting infrared radiation upward. Under a clear sky (point A), the IR escapes to space — no cloud reflects it back — so the ground and air above cools rapidly. Under thick cloud (point B), the cloud absorbs and re-emits IR back downward (high albedo 0.6–0.9), keeping the surface warmer. Point A loses more energy, so it cools faster.', s:AQA_P2H_JUN19},
  {q:'What is the Albedo value of a perfect black body?', a:'0.0 — a perfect black body absorbs all incident radiation and reflects none.', s:AQA_P2H_JUN19},
  {q:'In an IR emission experiment with a metal cube, four different surfaces give single temperature readings. Explain why these cannot show the detector gives precise readings.', a:'Precision requires repeated measurements of the same quantity to see if they are close together. Each surface only gives one reading — there are no repeat readings for any surface, so it is impossible to judge whether the detector gives consistent (precise) readings.', s:AQA_P2H_JUN19},
  {q:'A student concludes "a black surface always emits more IR than a white surface." How would a detector with 1°C resolution affect this conclusion?', a:'With 1°C resolution, the detector cannot distinguish between matt black (68.0°C) and matt white (65.5°C) — both would round to the same or adjacent values and the 2.5°C difference might fall within the uncertainty. The conclusion would be weakened — there would be insufficient evidence to distinguish the surfaces reliably.', t:'H', s:AQA_P2H_JUN19},
  {q:'Which animal cannot hear ultrasound (>20 kHz)?', a:'The chicken — its hearing range is 125 Hz to 2 kHz, which does not reach 20 kHz. All other animals listed (cat, dog, gerbil, horse) can hear above 20 kHz.', s:AQA_P2H_JUN19},
  {q:'What is the function of a microphone?', a:'To convert sound waves (pressure variations/vibrations in air) into electrical signals (alternating current) that vary in frequency and amplitude in the same way as the sound.', s:AQA_P2H_JUN19},
  {q:'Explain how a moving-coil microphone works.', a:'Sound waves cause the diaphragm of the microphone to vibrate. The diaphragm is attached to a small coil of wire that surrounds a permanent magnet. As the diaphragm vibrates, the coil moves back and forth in the magnetic field. This changing magnetic flux through the coil induces an alternating EMF (and therefore an alternating current) in the coil by electromagnetic induction. The frequency and amplitude of the AC signal match the sound wave.', t:'H', s:AQA_P2H_JUN19},
  {q:'An S-wave is both longitudinal and transverse. True or false?', o:['True — S-waves are longitudinal','False — S-waves are transverse (oscillations perpendicular to wave travel)','False — S-waves are longitudinal (oscillations parallel to wave travel)','True — S-waves are transverse'], c:1, e:'S-waves (secondary/shear waves) are TRANSVERSE — particles oscillate perpendicular to the direction of energy travel. This is why S-waves cannot pass through liquids (liquids can\'t sustain shear stress).'},
], mc: [
  {q:'A wave has frequency 200 Hz and wavelength 1.5 m. What is its speed?', o:['133 m/s','201.5 m/s','300 m/s','130 m/s'], c:2, e:'v = fλ = 200 × 1.5 = 300 m/s.'},
  {q:'Which part of the EM spectrum has the highest frequency?', o:['Radio waves','Infrared','Visible light','Gamma rays'], c:3, e:'Gamma rays have the highest frequency and shortest wavelength.'},
  {q:'Sound cannot travel through a vacuum because:', o:['It moves too slowly','It requires particles to propagate compressions and rarefactions','It is absorbed by empty space','It has no wavelength in a vacuum'], c:1, e:'Sound is a mechanical wave — it needs a medium to transfer energy. There are no particles in a vacuum.'},
  {q:'A ray hits a mirror at 30° to the surface. What is the angle of reflection from the normal?', o:['30°','60°','90°','15°'], c:1, e:'Angle to surface = 30°, so angle of incidence from normal = 60°. Angle of reflection = angle of incidence = 60°.'},
  {q:'Which type of wave is sound?', o:['Transverse','Longitudinal','Electromagnetic','Stationary'], c:1, e:'Sound is longitudinal — particles oscillate parallel to the direction of energy transfer, creating compressions and rarefactions.', t:'F'},
  {q:'A microwave has wavelength 12.5 cm and speed 3.0 × 10⁸ m/s. What is its frequency?', o:['2.4 × 10⁷ Hz','2.4 × 10⁸ Hz','2.4 × 10⁹ Hz','2.4 × 10¹⁰ Hz'], c:2, e:'Convert: 12.5 cm = 0.125 m. f = v/λ = 3.0 × 10⁸ / 0.125 = 2.4 × 10⁹ Hz.', t:'H', s:AQA_P2H},
  {q:'Which equation correctly links pressure, force and area?', o:['P = F × A','P = A / F','P = F / A','P = F × A²'], c:2, e:'Pressure = force ÷ area (Pa = N/m²). Rearranged: F = P × A and A = F/P.', s:AQA_P2H},
  {q:'Water at pressure 1500 Pa acts on the base of a cube of side 0.12 m. What is the force on the base?', o:['12.5 N','18 N','21.6 N','125 N'], c:2, e:'Area = 0.12 × 0.12 = 0.0144 m². F = P × A = 1500 × 0.0144 = 21.6 N.', t:'H', s:AQA_P2H},
  {q:'Total internal reflection occurs when:', o:['The wave speeds up at a boundary','The angle of incidence exceeds the critical angle at a boundary from a denser medium','Light enters a less dense medium at any angle','The wavelength increases'], c:1, e:'TIR requires: (1) light travelling from denser to less dense medium, AND (2) angle of incidence > critical angle.', t:'H'},
  {q:'P-waves are longitudinal and S-waves are transverse. Which correctly describes both?', o:['Both P and S-waves are longitudinal','Both P and S-waves are transverse','P-waves are longitudinal and S-waves are transverse','P-waves are transverse and S-waves are longitudinal'], c:2, e:'P-waves (primary waves) are longitudinal — compressions and rarefactions along the wave direction. S-waves (secondary/shear waves) are transverse — oscillations perpendicular to the direction of travel.', s:AQA_P2H_JUN24},
  {q:'Which direction does the EM spectrum arrow point for increasing frequency?', o:['Radio → gamma (frequency increases, wave speed in air stays same)','Gamma → radio (frequency increases, wave speed in air increases)','Radio → gamma (frequency increases, wavelength increases)','Gamma → radio (frequency decreases, wave speed increases)'], c:0, e:'The EM spectrum from radio to gamma rays: frequency INCREASES, wavelength DECREASES, wave speed in a vacuum/air STAYS THE SAME (3×10⁸ m/s for all EM waves).', s:AQA_P2H_JUN19},
  {q:'Explain how X-rays are suitable for medical imaging of bones.', o:['X-rays are absorbed by soft tissue and transmitted through bone','X-rays are absorbed by bone and transmitted through soft tissue, creating contrast on an image','X-rays ionise all body tissues equally','X-rays only penetrate to the skin surface'], c:1, e:'Bone absorbs X-rays (dense/calcium-rich). Soft tissue transmits X-rays. The contrast creates an image on a detector/film where bone appears white and soft tissue appears dark. Fractures or breaks show as disruptions in the bone outline.', s:AQA_P2H_JUN19},
  {q:'2 microseconds is equal to:', o:['2 × 10³ s','2 × 10⁻³ s','2 × 10⁻⁶ s','2 × 10⁻⁹ s'], c:2, e:'Micro = 10⁻⁶. Therefore 2 microseconds = 2 × 10⁻⁶ s.', s:AQA_P2H_JUN19},
  {q:'Which animal from this list cannot hear ultrasound (above 20 kHz)?', o:['Dog (20 Hz–30 kHz)','Cat (55 Hz–77 kHz)','Chicken (125 Hz–2 kHz)','Gerbil (56 Hz–60 kHz)'], c:2, e:'Chicken\'s maximum hearing frequency is 2 kHz, well below the 20 kHz threshold for ultrasound. All others can hear above 20 kHz.', s:AQA_P2H_JUN19},
]},

'magnetism': { name: 'Magnetism & Electromagnetism', fc: [
  {q:'What is the difference between a permanent and an induced magnet?', a:'Permanent: always magnetic (e.g. bar magnet). Induced: becomes magnetic in a field but loses most magnetism when removed.'},
  {q:'What is an electromagnet and how is it made?', a:'A coil of wire carrying a current, usually wound around a soft iron core. Produces a magnetic field only when current flows. Field can be turned on/off and its strength varied.', t:'F'},
  {q:'What is the motor effect?', a:'A current-carrying conductor in an external magnetic field experiences a force. Direction given by Fleming\'s Left-Hand Rule (thumb = force/motion, index = field, middle = current).'},
  {q:'What is the equation for the force on a current-carrying conductor?', a:'F = BIl where F = force (N), B = magnetic flux density (T), I = current (A), l = length of conductor in the field (m).', t:'H'},
  {q:'What is electromagnetic induction?', a:'A potential difference (and current if circuit is complete) is induced when a conductor moves through a magnetic field or the field changes. This is the generator effect.'},
  {q:'How does a transformer work?', a:'AC in the primary coil creates a changing magnetic field in the iron core, which induces an alternating pd in the secondary coil. Only works with AC.'},
  {q:'What is the transformer equation?', a:'Vp/Vs = np/ns. For an ideal transformer: VpIp = VsIs (power in = power out).', t:'H'},
  {q:'What is a step-up vs a step-down transformer?', a:'Step-up: more secondary turns → increases voltage, decreases current. Step-down: fewer secondary turns → decreases voltage, increases current.'},
  {q:'What is the name of the effect that causes a current-carrying coil to move inside a loudspeaker?', o:['Electromagnet effect','Induction effect','Motor effect','Speaker effect'], c:2, e:'Motor effect: a current-carrying conductor in a magnetic field experiences a force. AC current causes the coil to vibrate, moving the cone to produce sound.', s:AQA_P2H},
  {q:'F = BIl. Loudspeaker coil: I = 16 mA, F = 0.013 N, wire length = 6.5 m. What is B?', o:['0.013 T','0.125 T','1.25 T','12.5 T'], c:1, e:'B = F/(Il) = 0.013 / (0.016 × 6.5) = 0.013 / 0.104 = 0.125 T. Note: 16 mA = 0.016 A.', t:'H', s:AQA_P2H},
  {q:'How does a loudspeaker work?', a:'AC through a coil in a magnetic field causes it to vibrate (motor effect). The attached cone produces sound waves.'},
  {q:'Identify the three labelled parts of a transformer from Figure 12.', a:'⚠️ DIAGRAM REQUIRED — Figure 12 shows a transformer. Typical parts: A = primary coil (input coil, connected to the AC supply); B = iron core (carries the changing magnetic field from primary to secondary); C = secondary coil (output coil, where EMF is induced). Labels A, B, C may refer to these in any order — read from the figure.', s:AQA_P2H_22},
  {q:'A transformer has an alternating input pd of 230 V. Determine the output pd using Figure 12.', a:'⚠️ DIAGRAM REQUIRED — Figure 12 shows the number of turns on the primary and secondary coils. Read np and ns from the figure. Use transformer equation: Vs/Vp = ns/np → Vs = 230 × (ns/np). Show the turns ratio used and all working.', t:'H', s:AQA_P2H_22},
  {q:'A transformer has an AC input pd. Explain why there is an alternating current in the output circuit.', a:'The alternating input pd causes an alternating current in the primary coil. This creates a continuously changing magnetic field in the iron core. By electromagnetic induction (Faraday\'s law), the changing magnetic field induces an alternating EMF in the secondary coil. When the secondary coil is connected to an external circuit, this alternating EMF drives an alternating current.', t:'H', s:AQA_P2H_22},
  {q:'A cable carrying current (direction A to B) is supported between two poles in the Earth\'s magnetic field. State the direction of the force on the cable.', a:'⚠️ DIAGRAM REQUIRED — Figure 13 shows the cable orientation relative to the poles. Use Fleming\'s Left-Hand Rule: point the index finger in the direction of the magnetic field (Earth\'s field — roughly horizontal pointing north and downward in UK), middle finger in the direction of current (A to B as shown), and the thumb gives the direction of the force. The answer (up/down/left/right) depends on the exact geometry shown in Figure 13.', s:AQA_P2H_22},
  {q:'A cable experiences a force of 0.045 N in the Earth\'s magnetic field. The magnetic flux density is 60 µT and the current is 50 A. Calculate the length of the cable.', a:'Convert: B = 60 µT = 60 × 10⁻⁶ T = 6.0 × 10⁻⁵ T. Rearrange F = BIl: l = F ÷ (BI) = 0.045 ÷ (6.0 × 10⁻⁵ × 50) = 0.045 ÷ 0.003 = 15 m.', t:'H', s:AQA_P2H_22},
  {q:'State one assumption made when using F = BIl to calculate the length of a current-carrying cable in the Earth\'s magnetic field.', a:'Any one of: (1) The cable is straight (not curved). (2) The entire length of cable is in a uniform magnetic field. (3) The cable is perpendicular to the magnetic field direction (sin 90° = 1, so F = BIl applies). (4) The magnetic field is uniform along the length of the cable.', t:'H', s:AQA_P2H_22},
  {q:'How does a generator work?', a:'A coil rotating in a magnetic field has an alternating EMF induced. Slip rings give AC output; a split-ring commutator gives DC output.', t:'H'},
  {q:'What effect is demonstrated when a wire moved upward between two magnets causes a brief deflection on an ammeter?', a:'Electromagnetic induction. Moving the wire through the magnetic field causes a change in magnetic flux, which induces an EMF and a brief current in the wire.', s:AQA_P2H_JUN24},
  {q:'Explain why a current is induced when a wire is moved upward between two magnets.', a:'When the wire moves upward it cuts through (or changes the magnetic flux linking) the magnetic field lines between the magnets. A changing magnetic flux through a conductor induces an EMF (Faraday\'s Law). The circuit is complete, so this EMF drives a current. When the wire stops moving, flux stops changing and the current falls to zero.', s:AQA_P2H_JUN24},
  {q:'In the wire-in-magnet experiment, the magnetic field direction is reversed and the wire moved upward the same way as before. What happens to the ammeter needle?', a:'The needle deflects to −0.4 mA (opposite direction to before). Reversing the magnetic field reverses the direction of the induced EMF (and therefore current) for the same direction of wire movement.', s:AQA_P2H_JUN24},
  {q:'Explain how sound waves cause a current in a moving-coil microphone circuit.', a:'Sound waves cause pressure variations that make the diaphragm of the microphone vibrate. The diaphragm is connected to a small coil that surrounds a permanent magnet. As the coil moves back and forth, the magnetic flux through it changes, inducing an alternating EMF by electromagnetic induction (Faraday\'s Law). This drives an alternating current in the circuit that mirrors the frequency and amplitude of the sound.', s:AQA_P2H_JUN24},
  {q:'Two iron rods placed inside a solenoid move apart when the switch is closed. Explain why.', a:'When the switch is closed, current flows through the solenoid, creating a magnetic field. Both iron rods become magnetised by induction. The end of each rod closest to the centre of the solenoid acquires the same magnetic pole (both N or both S, depending on current direction). Like poles repel, so the two rods push apart.', s:AQA_P2H_JUN19},
  {q:'In an electromagnet investigation, a student varies both the current AND the number of turns simultaneously. Why is this method not valid?', a:'To investigate how one variable (e.g. current) affects the strength of the electromagnet, all other variables must be controlled (kept constant). The student changed two independent variables (current AND number of turns) at the same time, so it is impossible to determine which variable caused any change in strength. The investigation does not follow the fair-test principle.', s:AQA_P2H_JUN19},
  {q:'How does increasing the current in a wire affect the strength of an electromagnet?', a:'Increasing the current increases the magnetic field strength produced by the electromagnet — it can hold a greater weight/attract stronger. This is because a larger current produces a stronger magnetic field in the coil around the iron core.', s:AQA_P2H_JUN19},
  {q:'Increasing turns from 10 to 20 has a greater effect on electromagnet strength than increasing from 20 to 30 turns. What does this suggest?', a:'The relationship between number of turns and electromagnet strength is non-linear — there are diminishing returns. The first doubling (10→20) produces a larger increase in strength than the second increment (20→30), suggesting the strength increases less steeply at higher numbers of turns.', t:'H', s:AQA_P2H_JUN19},
], mc: [
  {q:'A transformer has 100 primary turns and 500 secondary turns. Input = 20 V. Output?', o:['4 V','20 V','100 V','500 V'], c:2, e:'Vs = Vp × (ns/np) = 20 × 500/100 = 100 V. Step-up transformer.', t:'H'},
  {q:'Fleming\'s Left-Hand Rule is used for:', o:['Generators','Transformers','The motor effect (force on current in a field)','Electromagnetic induction'], c:2, e:'Left-Hand Rule → motor effect: a current in a magnetic field experiences a force. Right-Hand Rule is used for generators.'},
  {q:'Why does a transformer only work with AC?', o:['DC has too much resistance','DC does not create a changing magnetic field, so no EMF is induced','DC voltage is too low','AC has more current'], c:1, e:'Electromagnetic induction requires a changing magnetic flux. DC produces a steady field — no change, no induced EMF.'},
  {q:'What is a step-down transformer used for?', o:['Increasing voltage to reduce current losses in cables','Decreasing voltage to a safer level for homes and appliances','Converting AC to DC','Generating electricity'], c:1, e:'Step-down transformers reduce the high National Grid voltage (e.g. 400 000 V) to safer levels for homes (230 V) and industry.', t:'F'},
  {q:'A cable carries a current from A to B in the Earth\'s magnetic field (Figure 13). Which direction is the force on the cable?', o:['Down','Left','Right','Up'], c:3, e:'⚠️ DIAGRAM REQUIRED — Figure 13 shows the cable between two poles. Using Fleming\'s Left-Hand Rule with the Earth\'s magnetic field direction and the current direction A→B as shown, the force on the cable is upward. (The exact answer depends on Figure 13 geometry — this is the typical AQA answer for a horizontal cable with northward field component and current east-west.)', t:'H', s:AQA_P2H_22},
  {q:'The force on a current-carrying wire F = BIl. If current doubles, force:', o:['Halves','Stays the same','Doubles','Quadruples'], c:2, e:'F = BIl — force is directly proportional to I. Double I → double F.', t:'H'},
]},

'space-physics': { name: 'Space Physics', fc: [
  {q:'What is the solar system?', a:'The Sun and everything that orbits it: eight planets (Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune), their moons, dwarf planets, asteroids, and comets.', t:'F'},
  {q:'Describe the life cycle of a star similar in mass to the Sun.', a:'Nebula → protostar → main sequence star (hydrogen fusion) → red giant → white dwarf → black dwarf.'},
  {q:'Describe the life cycle of a star much more massive than the Sun.', a:'Nebula → protostar → main sequence star → red supergiant → supernova → neutron star or black hole.'},
  {q:'What is the Big Bang theory?', a:'The universe began ~13.8 billion years ago from an extremely hot, dense point and has been expanding ever since. Evidence: redshift and cosmic microwave background (CMB) radiation.'},
  {q:'What is redshift and what does it tell us?', a:'Light from distant galaxies is shifted towards longer (red) wavelengths. Shows galaxies are moving away — evidence the universe is expanding. Greater distance = greater redshift (Hubble\'s Law).'},
  {q:'What is cosmic microwave background (CMB) radiation?', a:'Microwave radiation filling the universe uniformly in all directions. It is the remnant thermal radiation from the Big Bang — strong evidence for the Big Bang theory.', t:'H'},
  {q:'What force keeps planets in orbit?', a:'Gravity provides the centripetal force keeping planets in orbit around the Sun. Larger orbital radius → lower orbital speed and longer orbital period.'},
  {q:'What is a galaxy?', a:'A very large collection of billions of stars, gas, and dust held together by gravity. The Sun is in the Milky Way. There are billions of galaxies in the observable universe.'},
  {q:'What is the general name for objects that orbit a planet?', a:'Satellites — both natural (e.g. the Moon) and artificial (e.g. the Hubble Space Telescope, GPS satellites).', s:AQA_P2H},
  {q:'Explain the effect of Earth\'s gravitational force on the Hubble Space Telescope\'s motion.', a:'Gravity provides the centripetal force needed for circular orbit. It constantly pulls the telescope towards Earth, changing its direction without changing its speed. Without gravity, the telescope would travel in a straight line.', s:AQA_P2H},
  {q:'Compare the formation and life cycles of stars with a similar mass to the Sun with those of stars with a much greater mass than the Sun. [6 marks]', a:'FORMATION (both similar): Both begin as a cloud of gas and dust (nebula). Gravity pulls the material together, forming a protostar. Temperature rises until nuclear fusion begins (hydrogen fuses to helium), forming a main sequence star. LIFE CYCLE (Sun-like): The Sun-like star remains on the main sequence for billions of years. When hydrogen runs out, it expands into a red giant (fusing helium). Outer layers are ejected as a planetary nebula, leaving a white dwarf that cools to a black dwarf. LIFE CYCLE (Massive star): The massive star expands to a red supergiant. It explodes as a supernova (releasing heavy elements). The remnant collapses to a neutron star (if moderately massive) or a black hole (if very massive).', t:'H', s:AQA_P2H_22},
  {q:'Describe what is meant by red-shift of light from a distant galaxy.', a:'The wavelengths of light emitted by the galaxy are observed to be longer (shifted towards the red end of the electromagnetic spectrum) compared to the same wavelengths measured in a laboratory on Earth. This occurs because the galaxy is moving away from us — the light waves are stretched as the source moves away. The greater the red-shift, the faster the galaxy is receding.', s:AQA_P2H_22},
  {q:'A diagram shows several galaxies with arrows indicating their velocities relative to the Milky Way, all pointing away from it. Explain how this provides evidence for the Big Bang theory.', a:'⚠️ DIAGRAM REQUIRED — Figure 11 shows galaxies with velocity arrows pointing away from the Milky Way. All galaxies shown are moving away from the Milky Way (evidenced by the arrows pointing outward). Galaxies further away appear to be moving faster (longer arrows). This shows the universe is expanding in all directions. Tracing back this expansion, all matter would have originated from a single point — consistent with the Big Bang theory. If the Big Bang occurred, all matter would be moving apart, exactly as observed.', s:AQA_P2H_22},
  {q:'Give the reason why scientists sometimes have to change theories about the universe.', a:'New evidence (from observations or experiments) is discovered that cannot be explained by, or contradicts, the existing theory. Scientists must modify or replace the old theory to account for the new evidence.', s:AQA_P2H_22},
  {q:'Two galaxies A and B show dark lines shifted to longer wavelengths compared to the Sun. Galaxy A has greater shift than B. What conclusions can you draw?', a:'Both galaxies show redshift — they are both moving away from Earth (universe is expanding). Galaxy A has greater redshift than B, so A is moving away faster (and is likely further away from Earth than B).', s:AQA_P2H},
  {q:'Give three types of object (other than the Sun) that form our solar system.', a:'Any three from: planets (Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune); moons/natural satellites; dwarf planets (e.g. Pluto); asteroids/minor planets; comets.', s:AQA_P2H_JUN24},
  {q:'Stars A (2.2×10³⁰ kg), B (2.2×10³¹ kg), C (1.4×10³⁰ kg), Sun (2.0×10³⁰ kg). Which is most likely to form a black hole?', a:'Star B (2.2×10³¹ kg) — it has by far the greatest mass. Only stars significantly more massive than the Sun can form black holes after a supernova (rather than a neutron star or white dwarf).', s:AQA_P2H_JUN24},
  {q:'A star is 3.6×10¹⁴ km from Earth. Speed of light = 3.0×10⁸ m/s. Calculate the time for light to reach Earth.', a:'Convert: d = 3.6×10¹⁴ km = 3.6×10¹⁷ m. t = d ÷ v = 3.6×10¹⁷ ÷ 3.0×10⁸ = 1.2×10⁹ s.', t:'H', s:AQA_P2H_JUN24},
  {q:'Describe how stars produce all other naturally occurring elements beyond hydrogen.', a:'Main sequence stars fuse hydrogen into helium (and small amounts of heavier elements up to iron) through nuclear fusion in their cores. When massive stars reach the end of their lives they explode as supernovae. During a supernova, the extreme temperatures and pressures are sufficient to fuse nuclei into elements heavier than iron. These elements are ejected into space by the explosion and can later form planets and living things.', t:'H', s:AQA_P2H_JUN24},
  {q:'Red-shift of light from a galaxy describes the observed increase in which property?', a:'Wavelength (the light is shifted towards longer wavelengths — the red end of the visible spectrum). This occurs because the galaxy is moving away from the observer; the light waves are stretched.', s:AQA_P2H_JUN19},
  {q:'Describe how the Big Bang theory describes the universe when it began.', a:'The universe began from an extremely small, hot, and dense point (a singularity) about 13.8 billion years ago. It has been expanding (and cooling) ever since.', s:AQA_P2H_JUN19},
  {q:'Describe the relationship between a galaxy\'s speed and its distance from Earth (Hubble\'s Law).', a:'The speed at which a galaxy moves away from Earth is directly proportional to its distance from Earth. More distant galaxies move away faster. This is Hubble\'s Law and supports the Big Bang theory.', s:AQA_P2H_JUN19},
  {q:'New observations show distant galaxies are moving away at an increasingly fast rate. What does this suggest?', a:'The expansion of the universe is accelerating, not slowing down as gravity alone would predict. This suggests there is a repulsive force (attributed to dark energy) driving the galaxies apart faster over time.', t:'H', s:AQA_P2H_JUN19},
  {q:'Give one reason why peer review is an important scientific process.', a:'Any one of: (1) Other scientists check for errors in methodology, data, or conclusions. (2) It validates results — independent experts agree the evidence supports the claims. (3) It maintains scientific standards and helps prevent fraudulent or unreliable results being published. (4) Other experts can suggest improvements to the method.', s:AQA_P2H_JUN19},
  {q:'The Andromeda galaxy is moving towards Earth. Describe the change to wavelength and frequency of its light as observed from Earth.', a:'Blue-shift: the wavelength of light from Andromeda appears shorter (shifted towards the blue end of the spectrum) and the frequency appears higher than when measured in a laboratory. This is because the source is moving towards the observer — the light waves are compressed.', s:AQA_P2H_JUN19},
], mc: [
  {q:'What force keeps planets in orbit around the Sun?', o:['Friction','Magnetic force','Gravity','Nuclear force'], c:2, e:'Gravity acts between the Sun and each planet, providing the centripetal force needed to keep them in orbit.', t:'F'},
  {q:'What is the main evidence that the universe is expanding?', o:['The Sun is getting hotter','Light from distant galaxies shows redshift','Stars are increasing in number','The Moon is moving closer to Earth'], c:1, e:'Redshift shows galaxies are moving away. The further away, the greater the redshift — Hubble\'s Law.'},
  {q:'A microwave has wavelength 12.5 cm, speed 3.0 × 10⁸ m/s. Frequency in standard form?', o:['2.4 × 10⁷ Hz','2.4 × 10⁸ Hz','2.4 × 10⁹ Hz','2.4 × 10¹⁰ Hz'], c:2, e:'f = v/λ = 3.0 × 10⁸ / 0.125 = 2.4 × 10⁹ Hz. Convert 12.5 cm → 0.125 m first.', t:'H', s:AQA_P2H},
  {q:'What name is given to natural or artificial objects that orbit a planet?', o:['Comets','Stars','Satellites','Asteroids'], c:2, e:'Objects orbiting a planet are called satellites. Natural: the Moon. Artificial: Hubble, GPS satellites. Comets and asteroids orbit the Sun.', s:AQA_P2H},
  {q:'After a massive star goes supernova, the remnant becomes:', o:['A white dwarf','A red giant','A neutron star or black hole','A new nebula only'], c:2, e:'Supernova remnant: neutron star (if ~1.4–3 solar masses) or black hole (if more massive).', t:'H'},
  {q:'The Sun is currently in which stage of its life?', o:['Red giant','Protostar','Main sequence star','White dwarf'], c:2, e:'The Sun has been a main sequence star for ~4.6 billion years, fusing hydrogen into helium.'},
  {q:'CMB radiation supports the Big Bang theory because:', o:['It comes from the Sun','It is uniform microwave radiation consistent with the thermal afterglow of a very hot early universe','It shows Earth is 4.6 billion years old','It shows stars moving closer together'], c:1, e:'CMB\'s uniform distribution and temperature (~2.7 K) is consistent with the universe cooling from an extremely hot, dense origin.', t:'H'},
  {q:'Which star is most likely to form a black hole after a supernova?', o:['A star with mass 2.2×10³⁰ kg','A star with mass 1.4×10³⁰ kg','A star with mass 2.2×10³¹ kg','The Sun (2.0×10³⁰ kg)'], c:2, e:'Black holes form from the most massive stars. 2.2×10³¹ kg is 10× more massive than the other options — only stars far exceeding the Sun\'s mass form black holes rather than neutron stars or white dwarfs.', s:AQA_P2H_JUN24},
  {q:'1.1×10⁸ gigametres is the same as:', o:['1.1×10¹¹ m','1.1×10¹⁴ m','1.1×10¹⁷ m','1.1×10²⁰ m'], c:2, e:'1 gigametre (Gm) = 10⁹ m. So 1.1×10⁸ Gm = 1.1×10⁸ × 10⁹ m = 1.1×10¹⁷ m.', s:AQA_P2H_JUN24},
  {q:'6×10¹² terametres is the same as:', o:['6×10¹⁵ m','6×10¹⁸ m','6×10²¹ m','6×10²⁴ m'], c:3, e:'1 terametre (Tm) = 10¹² m. So 6×10¹² Tm = 6×10¹² × 10¹² m = 6×10²⁴ m.', s:AQA_P2H_JUN19},

'atomic-structure': { name: 'Atomic Structure & Periodic Table', fc: [
  {q:'What are the relative masses and charges of protons, neutrons, and electrons?', a:'Proton: mass 1, charge +1. Neutron: mass 1, charge 0. Electron: mass ~0, charge −1.'},
  {q:'How are elements arranged in the modern periodic table?', a:'In order of increasing atomic number (protons). Elements in the same group have the same number of outer electrons and similar chemical properties.'},

  {q:'What are isotopes?', a:'Atoms of the same element with the same number of protons but different numbers of neutrons (different mass numbers). Same chemical properties.'},
  {q:'What is the difference between a metal and a non-metal in the periodic table?', a:'Metals (left/centre): shiny, malleable, good conductors of heat and electricity. Non-metals (right/top): poor conductors, brittle if solid, often gases at room temperature.'},
  {q:'Why did Mendeleev leave gaps in his periodic table?', a:'He predicted undiscovered elements would fill them — later confirmed (e.g. gallium, germanium). He also swapped some elements by atomic mass to better match their properties.'},

  {q:'What are group 0 elements (noble gases) and why are they unreactive?', a:'He, Ne, Ar, Kr, Xe, Rn. Full outer electron shells — very stable. No tendency to gain, lose, or share electrons.'},
  {q:'What is the trend in reactivity going down group 1?', a:'Reactivity increases — outer electron is further from the nucleus, less attracted, more easily lost. Lower ionisation energy.'},
  {q:'What is the trend in reactivity going down group 7?', a:'Reactivity decreases — larger atoms attract an extra electron less strongly. More reactive halogen can displace a less reactive one.'},
  {q:'How do you work out the number of protons, neutrons, and electrons in an atom?', a:'Protons = atomic number. Electrons = atomic number (neutral atom). Neutrons = mass number − atomic number.', t:'F'},
], mc: [
  {q:'Which species has the same electronic structure as a noble gas?', o:['Na⁺','Cl','Na','Fe²⁺'], c:0, e:'Na (2,8,1) loses one electron → Na⁺ (2,8) — same as neon (a noble gas). This is why Na⁺ is stable.'},
  {q:'The atomic number of an atom with 8 protons and 9 neutrons is:', o:['9','17','8','1'], c:2, e:'Atomic number = number of protons = 8. (Mass number = 8 + 9 = 17; this is oxygen-17.)'},
  {q:'Which group 1 metal reacts most vigorously with water?', o:['Lithium','Sodium','Potassium','They react identically'], c:2, e:'Reactivity increases down group 1. Potassium > sodium > lithium. Potassium ignites the hydrogen gas produced.'},

  {q:'Why are elements in the same group chemically similar?', o:['Same mass number','Same number of electron shells','Same number of outer electrons','All are metals'], c:2, e:'Chemical behaviour is determined by valence (outer) electrons. Elements in the same group have the same number of outer electrons.'},
  {q:'An atom has 6 protons and 7 neutrons. Its mass number is:', o:['6','7','13','1'], c:2, e:'Mass number = protons + neutrons = 6 + 7 = 13. (Carbon-13.)'},

'bonding': { name: 'Bonding, Structure & Properties', fc: [
  {q:'What is ionic bonding?', a:'Transfer of electrons from metal to non-metal, forming oppositely charged ions. Strong electrostatic attraction holds ions in a giant ionic lattice.'},
  {q:'What is covalent bonding?', a:'Sharing of a pair of electrons between two non-metal atoms. Each shared pair is one covalent bond.'},
  {q:'What is metallic bonding?', a:'Metal atoms lose outer electrons forming a lattice of positive ions surrounded by a "sea" of delocalised electrons. Strong electrostatic attraction throughout.'},
  {q:'Why do ionic compounds have high melting and boiling points?', a:'Giant ionic lattices have many strong electrostatic forces between oppositely charged ions. A large amount of energy is needed to overcome them.'},
  {q:'Why do ionic compounds conduct electricity when molten or dissolved, but not as a solid?', a:'Conduction requires free-moving ions. In a solid, ions are fixed in the lattice. When molten or dissolved, ions are free to move and carry charge.'},
  {q:'What is a simple molecular structure?', a:'Small molecules with strong internal covalent bonds but only weak intermolecular forces between molecules. Low melting/boiling points; do not conduct electricity.'},
  {q:'What are giant covalent structures? Give two examples.', a:'Lattices of atoms all joined by strong covalent bonds throughout. Very high melting points. Examples: diamond (C), graphite (C), silicon dioxide (SiO₂).'},
  {q:'Why does graphite conduct electricity but diamond does not?', a:'Graphite: each carbon forms 3 bonds, leaving one delocalised electron per atom to carry charge. Diamond: all 4 outer electrons are in covalent bonds — no free electrons.', t:'H'},
  {q:'Why is graphite soft and slippery?', a:'Graphite has layers of carbon atoms held together by weak intermolecular forces. Layers can slide over each other — making it a good lubricant.'},
  {q:'What are fullerenes? Give one use.', a:'Carbon structures shaped like cages or tubes (e.g. C₆₀ buckminsterfullerene, carbon nanotubes). Uses: drug delivery, lubricants, reinforcing materials.', t:'H'},
  {q:'What are nanoparticles and why do they have unusual properties?', a:'Particles 1–100 nm in size. Extremely high surface area to volume ratio — a far greater proportion of atoms are on the surface. Properties can differ significantly from bulk material.', t:'H'},
  {q:'What type of bond forms between a metal and a non-metal?', a:'Ionic bonding. The metal loses electrons to form positive ions; the non-metal gains electrons to form negative ions. E.g. Na gives an electron to Cl → Na⁺Cl⁻.', t:'F'},
], mc: [
  {q:'Which type of bonding involves the transfer of electrons?', o:['Covalent','Metallic','Ionic','Van der Waals'], c:2, e:'Ionic bonding: electrons transfer from metal to non-metal → oppositely charged ions held by electrostatic attraction.'},
  {q:'Why do metals conduct electricity?', o:['They have mobile ions','They have delocalised electrons free to carry charge','They are liquid at room temperature','They have simple molecular structures'], c:1, e:'Metallic bonding produces a sea of delocalised electrons that move through the structure and carry electrical charge.'},
  {q:'Diamond has a very high melting point because:', o:['It has strong intermolecular forces','It has ionic bonds','It has a giant covalent structure — every atom bonded by strong covalent bonds throughout','It is made of very heavy atoms'], c:2, e:'Diamond: giant covalent lattice where every C atom bonds to 4 others by strong covalent bonds. Enormous energy needed to break them.'},
  {q:'A substance has a low melting point and does not conduct electricity in any state. It is most likely:', o:['An ionic compound','A metallic element','A simple molecular substance','A giant covalent structure'], c:2, e:'Low melting point → weak intermolecular forces. No electrical conduction in any state → no free ions or electrons. Matches a simple molecular substance.'},
  {q:'Sodium chloride conducts electricity when molten because:', o:['It forms covalent bonds when heated','The Na⁺ and Cl⁻ ions become free to move and carry charge','Electrons become delocalised','It becomes a simple molecular substance'], c:1, e:'Melting breaks down the lattice structure, freeing the ions to move. Mobile ions can carry electrical charge through the liquid.', t:'F'},
  {q:'Why do nanoparticles have different properties from bulk materials?', o:['Different chemical formula','Much higher surface area to volume ratio','Always toxic','Made of different elements'], c:1, e:'The extremely high surface area to volume ratio means a far greater proportion of atoms are on the surface, giving different physical/chemical properties.', t:'H'},
]},

'quantitative-chemistry': { name: 'Quantitative Chemistry', fc: [
  {q:'What is relative atomic mass (Ar)?', a:'The average mass of an atom of an element relative to 1/12 the mass of carbon-12. Takes into account the natural abundance of all isotopes.'},
  {q:'What is relative formula mass (Mr)?', a:'The sum of all relative atomic masses in a formula. E.g. Mr of H₂O = (2 × 1) + 16 = 18.'},
  {q:'What is a mole?', a:'The amount of substance containing 6.02 × 10²³ (Avogadro\'s number) particles. One mole of a substance has a mass equal to its Mr in grams.'},
  {q:'What is the equation linking moles, mass, and Mr?', a:'n = m/Mr → m = n × Mr → Mr = m/n. (n = moles, m = mass in g, Mr = relative formula mass).', t:'H'},
  {q:'What is the equation for concentration?', a:'c = n/V where c = concentration (mol/dm³), n = moles, V = volume (dm³).', t:'H'},
  {q:'What is percentage yield and why is it rarely 100%?', a:'% yield = (actual yield ÷ theoretical yield) × 100. Less than 100% due to: incomplete reaction, side reactions, loss during separation.'},
  {q:'What is atom economy and why does it matter?', a:'Atom economy = (Mr of desired product ÷ total Mr of all products) × 100. High atom economy means less waste — more sustainable and cost-effective.', t:'H'},
  {q:'What is the limiting reagent?', a:'The reactant used up first, which limits the amount of product that can form. The other reactant(s) are in excess.', t:'H'},
  {q:'What is the molar volume of a gas at RTP?', a:'At room temperature and pressure (RTP), 1 mole of any gas occupies 24 dm³ (24 000 cm³). Volume = n × 24 dm³.', t:'H'},
  {q:'How do you calculate Mr from a chemical formula?', a:'Add up the Ar values for all atoms in the formula. E.g. Mr of CO₂ = 12 + (2 × 16) = 44. (Use the Ar values given in the question or periodic table.)', t:'F'},
], mc: [
  {q:'What is the Mr of CO₂? (C = 12, O = 16)', o:['28','40','44','32'], c:2, e:'Mr = 12 + (2 × 16) = 12 + 32 = 44.'},
  {q:'How many moles are in 36 g of water? (Mr of H₂O = 18)', o:['0.5 mol','1 mol','2 mol','18 mol'], c:2, e:'n = m/Mr = 36/18 = 2 mol.', t:'H'},
  {q:'A reaction gives 4.5 g of product; theoretical yield is 9 g. Percentage yield?', o:['25%','45%','50%','90%'], c:2, e:'% yield = (actual/theoretical) × 100 = (4.5/9) × 100 = 50%.'},
  {q:'Why is atom economy important in industrial chemistry?', o:['To speed up reaction rate','To reduce waste and improve sustainability','To lower product quality','To increase percentage yield'], c:1, e:'High atom economy: more reactant atoms become desired product → less waste produced → lower cost and better environmental impact.', t:'H'},
  {q:'What volume does 2 moles of hydrogen gas occupy at RTP?', o:['12 dm³','24 dm³','48 dm³','96 dm³'], c:2, e:'V = n × 24 = 2 × 24 = 48 dm³ at RTP.', t:'H'},
